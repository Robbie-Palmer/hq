# Config for the typos spell-checker (mise run //:lint:typos)

[default.extend-words]
# Legitimate words and proper nouns the dictionary would "correct".
# Keys are lowercase per typos convention; matching is case-insensitive.
unparseable = "unparseable" # valid English; also a user-facing diagnostic string in recipe-parsing
hashi = "hashi" # HashiCorp
juni = "juni" # coding agent referenced in ADR 012
symetry = "symetry" # SymetryML, streaming ML product
vertica = "vertica" # Vertica analytics database
sie = "sie" # split from the SIEM(s) acronym

[default.extend-identifiers]
CelesTrak = "CelesTrak" # orbital-data and reference-software publisher

[files]
extend-exclude = [
    # Deliberate typo examples demonstrating fuzzy search ("machne" -> "machine")
    "ui/content/projects/personal-knowledge-graph/adrs/022-fuse-js.mdx",
    # The typos ADR quotes the misspellings it fixed
    "ui/content/projects/personal-knowledge-graph/adrs/055-typos.mdx",
    # Standalone design artifact full of encoded SVG/data strings
    "ui/public/recipe-site-design/",
    # Generated and minified Emscripten loader contains ABI symbol names that
    # resemble misspellings.
    "ui/public/simulations/autonomic-satellite-swarm/wasm/satellite-swarm.mjs",
    # Generated correction dictionary for the recipe editor spell-checker: it is
    # a list of typos by construction, so typos must not scan it (see
    # ui/scripts/generate-typos-dictionary.ts).
    "ui/public/recipes/typos-dictionary.tsv",
    # Spell-checker tests use deliberate misspellings as fixtures.
    "ui/tests/lib/domain/recipe/spellcheck.test.ts",
    "ui/tests/lib/domain/recipe/typoDictionary.test.ts",
    "ui/tests/scripts/typos-dictionary.test.ts",
    "ui/tests/components/recipes/spellcheck-editor.test.tsx",
    "ui/tests/hooks/use-typo-dictionary.test.tsx",
]
