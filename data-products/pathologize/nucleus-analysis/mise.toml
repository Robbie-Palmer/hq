[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked nucleus-analysis dataset environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the nucleus-analysis dataset lockfile"
run = "uv lock"

[tasks.format]
description = "Format nucleus-analysis dataset code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint nucleus-analysis dataset code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check nucleus-analysis dataset code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run nucleus-analysis dataset tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run nucleus-analysis dataset tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.dvc]
description = "Run a DVC command in the nucleus-analysis dataset project"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.build]
description = "Build the source-preserving NuCLS nucleus-analysis product"
depends = ["sync"]
run = "uv run --locked nucleus-analysis-data build"

[tasks.repro]
description = "Reproduce the nucleus-analysis product through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic nucleus-analysis dataset checks"
depends = ["lint", "typecheck", "test:coverage"]
