[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked ROI-segmentation dataset environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the ROI-segmentation dataset lockfile"
run = "uv lock"

[tasks.format]
description = "Format ROI-segmentation dataset code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint ROI-segmentation dataset code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check ROI-segmentation dataset code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run ROI-segmentation dataset tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run ROI-segmentation dataset tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.dvc]
description = "Run a DVC command in the ROI-segmentation dataset project"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.build]
description = "Build the multi-source slide-coordinate ROI product"
depends = ["sync"]
run = "uv run --locked roi-segmentation-data build"

[tasks.repro]
description = "Reproduce the ROI-segmentation product through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic ROI-segmentation dataset checks"
depends = ["lint", "typecheck", "test:coverage"]
