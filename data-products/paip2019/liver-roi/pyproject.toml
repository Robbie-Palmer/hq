[project]
name = "paip2019-source-data"
version = "0.1.0"
description = "Source-native PAIP 2019 liver ROI data product"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "defusedxml>=0.7,<0.8",
  "fire>=0.7,<0.8",
  "pydantic>=2.12,<3",
  "tifffile>=2026.9,<2027",
]

[project.scripts]
paip2019-source-data = "paip2019_source_data.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
  "ty>=0.0.75,<0.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=paip2019_source_data --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "C90", "E", "F", "I", "N", "PERF", "PTH", "RUF", "S", "SIM", "T20", "TRY", "UP"]
ignore = ["T201", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
