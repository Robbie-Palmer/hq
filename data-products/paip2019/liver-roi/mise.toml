[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked PAIP 2019 source-data environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the PAIP 2019 source-data lockfile"
run = "uv lock"

[tasks.format]
description = "Format PAIP 2019 source-data code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint PAIP 2019 source-data code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check PAIP 2019 source-data code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run PAIP 2019 source-data tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run PAIP 2019 source-data tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.dvc]
description = "Run a DVC command in the PAIP 2019 source-data project"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.publish]
description = "Validate and publish the metadata-only PAIP 2019 source contract"
depends = ["sync"]
run = "uv run --locked paip2019-source-data publish"

[tasks.index]
description = "Index an approved complete PAIP 2019 source release"
depends = ["sync"]
run = "uv run --locked paip2019-source-data index"

[tasks.repro]
description = "Reproduce the metadata-only PAIP 2019 source contract through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic metadata-only PAIP 2019 source-data checks"
depends = ["lint", "typecheck", "test:coverage"]
