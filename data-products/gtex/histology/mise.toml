[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked GTEx histology source-data environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the GTEx histology source-data lockfile"
run = "uv lock"

[tasks.format]
description = "Format GTEx histology source-data code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint GTEx histology source-data code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check GTEx histology source-data code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run GTEx histology source-data tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run GTEx histology source-data tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.dvc]
description = "Run a DVC command in the GTEx histology source-data project"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.acquire]
description = "Acquire pinned GTEx metadata without source image bytes"
depends = ["sync"]
run = "uv run --locked gtex-histology-source-data acquire"

[tasks.index]
description = "Index GTEx histology metadata in publisher-native namespaces"
depends = ["sync"]
run = "uv run --locked gtex-histology-source-data index"

[tasks."identity:check"]
description = "Check live GTEx, IDC, AnVIL, Zenodo, and NCI identities"
depends = ["sync"]
run = "uv run --locked gtex-histology-source-data verify-live"

[tasks.repro]
description = "Reproduce the metadata-only GTEx histology product through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic credential-free GTEx histology checks"
depends = ["lint", "typecheck", "test:coverage"]
