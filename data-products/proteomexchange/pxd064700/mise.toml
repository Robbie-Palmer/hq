[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked PXD064700 source product environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the PXD064700 source product lockfile"
run = "uv lock"

[tasks.format]
description = "Format PXD064700 source product code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint PXD064700 source product code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check PXD064700 source product code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run PXD064700 source product tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run PXD064700 source product tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.dvc]
description = "Run a DVC command in the PXD064700 source product"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.refresh]
description = "Refresh public PXD064700 metadata without proteomics payloads"
depends = ["sync"]
run = "uv run --locked pxd064700-source refresh"

[tasks."verify:live"]
description = "Check live PXD064700 identities over allowlisted HTTPS endpoints"
depends = ["sync"]
run = "uv run --locked pxd064700-source verify-live"

[tasks.publish]
description = "Validate and publish source-native PXD064700 indexes"
depends = ["sync"]
run = "uv run --locked pxd064700-source publish"

[tasks.repro]
description = "Reproduce the PXD064700 metadata product through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic credential-free PXD064700 metadata checks"
depends = ["lint", "typecheck", "test:coverage"]
