[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked BCSS source-data environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the BCSS source-data lockfile"
run = "uv lock"

[tasks.format]
description = "Format BCSS source-data code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint BCSS source-data code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check BCSS source-data code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run BCSS source-data tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run BCSS source-data tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.dvc]
description = "Run a DVC command in the BCSS source-data project"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.publish]
description = "Validate and publish the metadata-only native BCSS corpus"
depends = ["sync"]
run = "uv run --locked bcss-source-data publish"

[tasks."acquire:masks"]
description = "Explicitly acquire and verify the 28.4 MB native BCSS masks"
depends = ["sync"]
run = "uv run --locked bcss-source-data acquire-masks"

[tasks.repro]
description = "Reproduce the metadata-only BCSS source product through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic BCSS source-data checks"
depends = ["lint", "typecheck", "test:coverage"]
