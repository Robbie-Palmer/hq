[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked CPTAC-LSCC source product environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the CPTAC-LSCC source product lockfile"
run = "uv lock"

[tasks.format]
description = "Format CPTAC-LSCC source product code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint CPTAC-LSCC source product code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check CPTAC-LSCC source product code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run CPTAC-LSCC source product tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run CPTAC-LSCC source product tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.dvc]
description = "Run a DVC command in the CPTAC-LSCC source product"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.refresh]
description = "Refresh public repository metadata without downloading data artifacts"
depends = ["sync"]
run = "uv run --locked cptac-lscc-source refresh"

[tasks."verify:live"]
description = "Compare official live release identities with the pinned snapshot"
depends = ["sync"]
run = "uv run --locked cptac-lscc-source verify-live"

[tasks.publish]
description = "Validate and publish the source-native CPTAC-LSCC linkage indexes"
depends = ["sync"]
run = "uv run --locked cptac-lscc-source publish"

[tasks.repro]
description = "Reproduce the CPTAC-LSCC source product through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic metadata-only CPTAC-LSCC checks"
depends = ["lint", "typecheck", "test:coverage"]
