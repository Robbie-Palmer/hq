[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked AIRAQc product environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the AIRAQc product lockfile"
run = "uv lock"

[tasks.format]
description = "Format AIRAQc product code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint AIRAQc product code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check AIRAQc product code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run AIRAQc product tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run AIRAQc product tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.dvc]
description = "Run a DVC command in the AIRAQc product"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.publish]
description = "Validate and publish the native AIRAQc corpus"
depends = ["sync"]
run = "uv run --locked airaqc-tcga-product publish"

[tasks.acquire]
description = "Explicitly acquire the pinned 15.8 GB raw AIRAQc pilot"
depends = ["sync"]
run = "uv run --locked airaqc-tcga-product acquire"

[tasks.repro]
description = "Reproduce the AIRAQc product contract through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic AIRAQc product checks"
depends = ["lint", "typecheck", "test:coverage"]
