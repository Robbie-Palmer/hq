[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked SegPath source-data environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the SegPath source-data lockfile"
run = "uv lock"

[tasks.format]
description = "Format SegPath source-data code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint SegPath source-data code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check SegPath source-data code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run SegPath source-data tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run SegPath source-data tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.dvc]
description = "Run a DVC command in the SegPath source-data project"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.verify]
description = "Verify pinned SegPath metadata without downloading dataset bytes"
depends = ["sync"]
run = "uv run --locked segpath-source-data verify"

[tasks."acquire:metadata"]
description = "Acquire the pinned 22.4 MB publisher metadata"
depends = ["sync"]
run = "uv run --locked segpath-source-data acquire-metadata"

[tasks."acquire:artifacts"]
description = "Explicitly acquire the pinned 305.5 GB H&E and mask archives"
depends = ["sync"]
run = "uv run --locked segpath-source-data acquire-artifacts --max-bytes 305525589629"

[tasks.index]
description = "Index SegPath in its source-native antigen tasks"
depends = ["sync"]
run = "uv run --locked segpath-source-data index"

[tasks.repro]
description = "Reproduce the SegPath metadata product through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic SegPath source-data checks"
depends = ["verify", "lint", "typecheck", "test:coverage"]
