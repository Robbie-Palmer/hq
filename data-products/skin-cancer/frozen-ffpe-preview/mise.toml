[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked skin preview source environment"
run = "uv sync --locked --python 3.12"

[tasks.lock]
description = "Update the skin preview source lockfile"
run = "uv lock"

[tasks.format]
description = "Format the skin preview source product"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint the skin preview source product"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check the skin preview source product"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run skin preview source tests"
depends = ["sync"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Run skin preview tests with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml"

[tasks.contracts]
description = "Regenerate checked-in JSON schemas"
depends = ["sync"]
run = "uv run --locked skin-frozen-ffpe-preview contracts"

[tasks.index]
description = "Publish the metadata-only native index"
depends = ["sync"]
run = "uv run --locked skin-frozen-ffpe-preview index"

[tasks."live-check"]
description = "Verify current Zenodo metadata without downloading file payloads"
depends = ["sync"]
run = "uv run --locked skin-frozen-ffpe-preview live-check"

[tasks."payload-check"]
description = "Temporarily fetch all 30 small files and test MRXS readability"
depends = ["sync"]
run = "uv run --locked skin-frozen-ffpe-preview payload-check"

[tasks.acquire]
description = "Acquire one named Zenodo file after size and MD5 verification"
depends = ["sync"]
run = "uv run --locked skin-frozen-ffpe-preview acquire"

[tasks.dvc]
description = "Run a DVC command in the skin preview source project"
run = "bash ../../../ml-pipelines/scripts/dvc.sh"

[tasks.repro]
description = "Reproduce the metadata-only source registry through DVC"
run = "bash ../../../ml-pipelines/scripts/dvc.sh repro"

[tasks.check]
description = "Run deterministic skin preview source checks"
depends = ["lint", "typecheck", "test:coverage"]
