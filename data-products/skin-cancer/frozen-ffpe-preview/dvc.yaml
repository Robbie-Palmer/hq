stages:
  index_preview_metadata:
    cmd: uv run --locked skin-frozen-ffpe-preview index
    deps:
      - .python-version
      - contracts
      - manifest.json
      - pyproject.toml
      - src/skin_frozen_ffpe_preview
      - uv.lock
    outs:
      - outputs/native-index.jsonl
      - outputs/source-contract.json
    metrics:
      - outputs/source-metrics.json
