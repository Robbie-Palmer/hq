[project]
name = "colorectal-multistain-source"
version = "0.1.0"
description = "Source-native colorectal H&E, IHC, and ISH epithelium segmentation data product"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fire>=0.7,<0.8",
  "pydantic>=2.12,<3",
  "remotezip>=0.12,<0.13",
]

[project.scripts]
colorectal-multistain-source = "colorectal_multistain_source.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
  "ty>=0.0.75,<0.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=colorectal_multistain_source --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "C90", "E", "F", "I", "N", "PERF", "PTH", "RUF", "S", "SIM", "T20", "TRY", "UP"]
ignore = ["T201", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
