codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 0%

bundle_analysis:
  # Block only when a PR exceeds Codecov's default relative regression threshold.
  # The current main upload supplies the comparison baseline, so this needs no
  # guessed byte budget.
  status: true
  warning_threshold: 5%

comment:
  layout: "condensed_header, components, condensed_files, condensed_footer"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  hide_project_coverage: false
  require_bundle_changes: false

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    - component_id: ui
      name: Web UI
      paths:
        - ui/**
    - component_id: workers
      name: Cloudflare Workers
      paths:
        - workers/**
    - component_id: domain_packages
      name: TypeScript packages
      paths:
        - packages/**
    - component_id: ai_review
      name: AI review
      paths:
        - ai-review/**
    - component_id: data_and_ml
      name: Data and ML pipelines
      paths:
        - data-pipelines/**
        - ml-pipelines/**
    - component_id: satellite_swarm
      name: Satellite swarm C++
      paths:
        - cpp/autonomic-satellite-swarm/**

github_checks:
  annotations: true
