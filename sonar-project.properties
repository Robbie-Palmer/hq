# Top-level build/generator scripts are I/O tooling run at build time, not
# unit-tested application code, so keep them out of the coverage denominator.
# The recipe service worker is a browser-loaded static asset. Its VM harness
# tests install, session fallback, sender validation, and cache cleanup, but
# Vitest cannot map that runtime evaluation back to the public source file.
# The scorecard report and replay CLIs are in the same category: they are
# operator CLIs driven by mise tasks and exercised by bash fixture tests that
# shell out to duckdb, which no LCOV runner observes. The R2 pull tool is the
# same kind of operator task, driven through Doppler against the live bucket.
# Spectral custom functions are the same category: rule logic executed by
# Spectral against the OpenAPI spec, not by the vitest suites (see recipe-site
# ADR 065). The Drizzle schema is declarative database metadata exercised by
# migration checks and integration tests, not application control flow.
# Homelab ops scripts (shell/python) run on the Mac mini host via mise tasks,
# outside any test runner. The satellite firmware adapters require Arduino
# platform APIs and remain compile-gated until physical hardware is available;
# the portable coordination core and host simulation retain coverage gates.
# The public satellite module worker is exercised through browser and protocol
# tests, but Vitest cannot map worker execution back to a public static asset.
# Recipe-dataset stage entrypoints orchestrate large JSONL files and are exercised
# end-to-end by DVC reproduction; their parsing helpers retain unit LCOV gates.
# The GECToR and punctuation runtimes require the pinned CUDA environment and
# real checkpoints. Their integration suites run on a GPU laptop rather than
# the CPU-only Sonar coverage job.
# The WSI GPU benchmark runner likewise requires CUDA, nvImageCodec, and a
# public DICOM fixture; its CPU-safe contracts and CLI boundary remain covered.
# Vitest and Stryker config modules are declarative runner inputs. Their tasks
# validate them while retaining coverage and mutation gates over domain source.
# The Work Graph fixture assertion driver is likewise executed end to end by
# the dbt fixture gate; pytest coverage remains enforced over its library code.
sonar.coverage.exclusions=ai-review/analytics/report.ts,ai-review/analytics/replay.ts,ai-review/analytics/corpus-replay.ts,ai-review/analytics/*.py,ml-pipelines/pathologize-slide-quality-benchmark/scripts/*.py,**/scripts/*.ts,**/scripts/*.mjs,**/spectral-functions/*.js,**/playwright*.config.ts,**/vitest.config.ts,**/stryker*.config.mjs,packages/inbox-signal-data/src/schema.ts,packages/personal-finance-data/src/runtime-schema.ts,packages/recipe-db/src/schema.ts,packages/work-graph-db/src/schema.ts,packages/work-graph-cli/openapi-ts.config.ts,ui/public/recipes-sw.js,ui/public/simulations/autonomic-satellite-swarm/**,homelab/**,cpp/autonomic-satellite-swarm/firmware/**,ml-pipelines/recipe-dataset/src/stages/**,ml-pipelines/writing-editor-evaluation/python/gector_runtime.py,ml-pipelines/writing-editor-evaluation/python/punctuation_runtime.py,ml-pipelines/pathologize-tiling-benchmark/src/pathologize_tiling_benchmark/gpu_benchmark.py,data-pipelines/work-graph-analytics/scripts/assert_fixture.py

# These curated data lists and validation fixtures repeat a fixed field schema.
# The copy-paste detector reads that inherent structural repetition as
# duplication. They are data, not logic, so keep them out of duplication
# detection.
sonar.cpd.exclusions=ui/content/technologies.ts,ui/content/adr-aliases.ts,packages/finance-tax-rules/src/validationData.ts

# The scorecard report and replay CLIs are operator tools run from a local
# terminal over the operator's own marts, manifests, baseline files, and
# executor processes. Their purpose is to read those inputs, write reports
# beside them, and log what they did; the taint-analysis rules below model a
# remote attacker influencing the CLI arguments, which does not apply to a
# single-user batch tool whose byte-identical determinism is fixture-tested.
# The writing editor extractor has the same trust boundary: it calls the Git
# binary selected by the operator and reads pinned revisions from that repository.
# The satellite core and both reference adapters intentionally retain Arduino's C++11 boundary.
# Newer-language suggestions are not actionable there: using-enum and span require C++20,
# if-init and std::byte require C++17, and to_underlying requires C++23. The AVR standard library
# lacks std::array, so fixed C arrays remain necessary in shared/Uno code. The bounded indexed loop
# is also deliberate because its configured message budget is the loop's contract.
# A dedicated worker has a private message channel to its creator rather than a
# Window message surface. Its requests are schema and range checked, while
# MessageEvent.origin is not an authorization boundary in that worker scope.
# Work Graph analytics is another local operator CLI. Its staging path is an
# explicit destination, while its output names are fixed in code; raw object
# keys are separately constrained to the verified dataset root. The dbt SQL is
# DuckDB with Jinja model references, so PL/SQL's duplicate-literal rule does
# not describe reusable constants in that source language.
