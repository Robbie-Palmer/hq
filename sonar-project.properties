# Keep test code out of production-code metrics and let SonarQube apply its
# test-specific analysis rules. Test inclusions are also source exclusions.
sonar.sources=.
sonar.tests=.
sonar.javascript.node.maxspace=8192
sonar.test.inclusions=**/tests/**/*,**/tests-runtime/**/*,**/python-tests/**/*,ui/e2e/**/*,scripts/*.test.ts

# Vendored design prototypes exported from Claude Design and their generated
# standalone build are not part of the maintained application source. Binary
# public assets are excluded so language sensors do not try to decode them as UTF-8.
# The scorecard query targets DuckDB rather than PL/SQL, so Sonar's PL/SQL rules
# do not apply to it; its behavior is covered by the scorecard fixture tests.
# The .vale tree is imported style packages (proselint, write-good) plus the
# site's own prose rules; it is data for Vale, not source Sonar should analyze.
# The recipe-parsing visualizer entry point only mounts the React application.
# SonarJasmin spends several minutes traversing its import graph whenever any
# JS/TS source changes, while the imported application files remain analyzed.
# CelesTrak's checked-in SGP4 implementation is vendored reference code; its
# local adapter and reference-vector tests remain analyzed and coverage-gated.
# Emscripten generates the satellite-swarm loader from the pinned toolchain;
# browser parity CI rebuilds and executes it instead of treating it as authored JS.
# Hey API generates the Work Graph client from the canonical OpenAPI document;
# its drift check and mocked CLI tests cover the maintained integration layer.
# Drizzle Kit snapshots and OpenAPI documents are also regenerated and checked
# for drift in CI. Sonar should analyze the schema and route definitions instead.
sonar.exclusions=ui/content/projects/*/designs/**,ui/public/recipe-site-design/standalone.html,**/coverage/**,ui/public/**/*.png,workers/recipe-api/drizzle/*.sql,workers/recipe-api/drizzle/meta/**,packages/inbox-signal-data/drizzle/*.sql,packages/inbox-signal-data/drizzle/meta/**,packages/wedding-planner-data/drizzle/*.sql,packages/wedding-planner-data/drizzle/meta/**,packages/work-graph-db/drizzle/*.sql,packages/work-graph-db/drizzle/meta/**,workers/recipe-api/openapi.json,workers/work-graph-api/openapi.json,packages/work-graph-cli/src/generated/**,ai-review/analytics/scorecard.sql,.vale/**,ml-pipelines/recipe-parsing/tools/viz/src/main.tsx,ui/public/simulations/autonomic-satellite-swarm/wasm/**,cpp/autonomic-satellite-swarm/third_party/**

