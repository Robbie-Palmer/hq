# Root-level tasks for repo-wide tooling
[tasks."work-graph:launch-agent"]
description = "Create a T3 Code thread for one explicitly selected Work Graph ticket"
depends = ["//:install"]
run = """
#!/usr/bin/env bash
set -euo pipefail

git_common_dir="$(git rev-parse --path-format=absolute --git-common-dir)"
export T3_WORK_GRAPH_PROJECT_ROOT="$(dirname "$git_common_dir")"
base_branch="${T3_WORK_GRAPH_BASE_BRANCH:-}"
if [[ -z "$base_branch" ]]; then
  remote_head="$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null || true)"
  base_branch="${remote_head#origin/}"
fi
if [[ -z "$base_branch" ]]; then
  base_branch="$(git config --get init.defaultBranch || true)"
fi
export T3_WORK_GRAPH_BASE_BRANCH="${base_branch:-main}"
t3_home="${T3CODE_HOME:-$HOME/.t3}"
export T3_WORK_GRAPH_ORIGIN="$(jq -er '.origin' "$t3_home/userdata/server-runtime.json")"
ticket_id="${T3_WORK_GRAPH_TICKET_ID:?Set T3_WORK_GRAPH_TICKET_ID to the one approved ticket}"
ticket="$(work-graph show "$ticket_id")"
jq -e '
  .id == $ticket_id and
  .lifecycle == "open" and
  .stage == "ready" and
  .currentLease == null
' --arg ticket_id "$ticket_id" >/dev/null <<<"$ticket"
context="$(work-graph context show "$ticket_id")"
export T3_WORK_GRAPH_CLI="$(command -v work-graph)"
export T3_WORK_GRAPH_SELECTION="$(jq -cn \
  --argjson ticket "$ticket" \
  --argjson context "$context" \
  '{ticket: $ticket, context: $context.items}')"
export T3_ACCESS_TOKEN="$(t3 auth session issue \
  --base-dir "$t3_home" \
  --ttl 15m \
  --label work-graph-agent-launcher \
  --token-only)"

exec pnpm exec tsx scripts/launch-work-graph-agent.ts
"""

