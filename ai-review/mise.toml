[tasks.install]
description = "Install stateful AI review and evaluation dependencies"
run = "pnpm install --frozen-lockfile --filter ai-review... --filter ai-review-evaluation-pipeline..."

[tasks.typecheck]
description = "Typecheck the stateful AI review Worker"
depends = ["install"]
run = """
pnpm typecheck
pnpm exec tsc --noEmit --project tsconfig.workerd.json
"""

[tasks.test]
description = "Run the stateful AI review tests"
depends = ["install"]
run = "pnpm test"

[tasks."test:workerd"]
description = "Run Durable Object integration tests in workerd"
depends = ["install"]
run = "pnpm exec vitest run --config vitest.workerd.config.ts"

[tasks."test:coverage"]
description = "Run stateful AI review tests with LCOV coverage"
depends = ["install"]
run = "pnpm test:coverage"

[tasks.check]
description = "Run all stateful AI review checks"
depends = ["//packages/ai-review-domain:check", "typecheck", "test", "test:workerd", "scorecard:test", "scorecard:report:test", "scorecard:replay:test"]

[tasks.deploy]
description = "Deploy the stateful AI review Worker"
depends = ["install"]
run = "bash scripts/deploy.sh"

[tasks."deploy:dry-run"]
description = "Bundle the stateful AI review Worker without deploying it"
depends = ["install"]
run = "pnpm exec wrangler deploy --dry-run"

[tasks."deploy:staging"]
description = "Deploy the isolated staging AI review Worker"
depends = ["install"]
run = "bash scripts/deploy.sh"

[tasks."deploy:staging".env]
AI_REVIEW_DOPPLER_CONFIG = "stg"
AI_REVIEW_WRANGLER_CONFIG = "wrangler.staging.toml"

[tasks."deploy:staging:dry-run"]
description = "Bundle the isolated staging AI review Worker without deploying it"
depends = ["install"]
run = "pnpm exec wrangler deploy --config wrangler.staging.toml --dry-run"

[tasks."e2e:staging"]
description = "Send a signed staging webhook and verify visible and R2 results"
depends = ["install"]
run = """
doppler run --project ai-review --config stg -- \
  bash scripts/staging-e2e.sh
"""

[tasks."lifecycle:verify"]
description = "Verify the AI review R2 lifecycle policy"
depends = ["install"]
run = "bash scripts/verify-lifecycle.sh"

[tasks."scorecard:pull"]
description = "Pull AI review records from the ai-review-data R2 bucket into the local scorecard cache"
run = "doppler run --project ai-review --config prd -- python3 analytics/pull-records.py"

[tasks."scorecard:build"]
description = "Build deterministic DuckDB scorecard marts from schema-v1 and schema-v2 JSON (defaults to the pulled cache)"
run = "bash analytics/build-scorecard.sh"

[tasks."scorecard:test"]
description = "Test scorecard marts against fixed schema-v1 and schema-v2 fixtures"
depends = ["install"]
run = "bash analytics/test-scorecard.sh"

[tasks."scorecard:report"]
description = "Generate versioned JSON and Markdown scorecard reports from built marts"
run = "pnpm exec tsx analytics/report.ts"

[tasks."scorecard:baseline"]
description = "Build the reproducible schema-v1 stateless review-efficiency baseline"
run = "pnpm exec tsx analytics/stateless-baseline.ts"

[tasks."scorecard:report:test"]
description = "Test the scorecard report CLI against mixed schema-version fixtures"
depends = ["install"]
run = "bash analytics/test-report.sh"

[tasks."scorecard:replay"]
description = "Plan or execute an opt-in, budget-capped controlled replay from a frozen manifest"
run = "pnpm exec tsx analytics/replay.ts"

[tasks."corpus:replay"]
description = "Plan or execute the production-isolated runner against one frozen corpus snapshot"
run = "pnpm exec tsx analytics/corpus-replay.ts"

[tasks."scorecard:replay:test"]
description = "Test controlled replay opt-in gating and budget enforcement"
depends = ["install"]
run = "bash analytics/test-replay.sh"
