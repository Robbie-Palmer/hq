[tasks.install]
description = "Install recipe API dependencies"
run = "pnpm install --frozen-lockfile --filter recipe-api..."

[tasks.typecheck]
description = "Typecheck the recipe API"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Run recipe API tests"
depends = ["install"]
run = "pnpm test"

[tasks."openapi:generate"]
description = "Generate the committed recipe API OpenAPI contract"
depends = ["install"]
run = "pnpm openapi:generate"

[tasks."lint:api"]
description = "Check and lint the committed recipe API OpenAPI contract"
depends = ["install"]
run = "pnpm lint:api"

[tasks."openapi:breaking"]
description = "Fail when openapi.json breaks the contract at a Git revision"
depends = ["lint:api"]
run = "bash scripts/check-openapi-breaking.sh"

[tasks."test:coverage"]
description = "Run recipe API tests with LCOV coverage"
depends = ["//:install"]
run = "pnpm test:coverage"

[tasks."test:integration"]
description = "Run recipe API integration tests against disposable PostgreSQL"
depends = ["install"]
run = "pnpm test:integration"

[tasks."test:integration:coverage"]
description = "Cover recipe API database boundaries with disposable PostgreSQL"
depends = ["install"]
run = "bash scripts/test-integration.sh --coverage"

[tasks.check]
description = "Run all recipe API checks"
depends = ["typecheck", "test", "db:check", "lint:api"]

[tasks."db:check"]
description = "Validate the Drizzle migration history and schema snapshot"
depends = ["install"]
run = "pnpm db:check"

[tasks."db:generate"]
description = "Generate a Drizzle migration from schema changes"
depends = ["install"]
run = "pnpm db:generate"

[tasks."db:migrate"]
description = "Apply committed Drizzle migrations to DATABASE_URL"
depends = ["install"]
run = "pnpm db:migrate"

[tasks."db:seed:preview"]
description = "Seed deterministic preview users and data"
depends = ["install"]
run = "pnpm preview:seed"

[tasks."preview:smoke"]
description = "Smoke-test a deployed preview Worker with a direct seeded session"
depends = ["install"]
run = "pnpm exec tsx scripts/smoke-preview.ts"

[tasks."preview:smoke:profiles"]
description = "Smoke-test authenticated profiles on a deployed preview Worker"
depends = ["install"]
run = "pnpm exec tsx scripts/smoke-preview-profiles.ts"

[tasks."preview:smoke:agent-auth"]
description = "Run the interactive delegated agent-auth smoke test against a PR preview"
depends = ["install"]
run = "pnpm exec tsx scripts/smoke-preview-agent-auth.ts"

[tasks."preview:smoke:realtime"]
description = "Smoke-test two-session realtime pantry fan-out on a deployed preview Worker"
depends = ["install"]
run = "pnpm exec tsx scripts/smoke-preview-realtime.ts"

[tasks."db:backfill:cookware"]
description = "Canonicalize existing recipe cookware against the equipment registry (read-only; pass -- --apply to write)"
depends = ["install"]
run = "pnpm backfill:cookware"

[tasks."db:studio"]
description = "Open Drizzle Studio for DATABASE_URL"
depends = ["install"]
run = "pnpm db:studio"

[tasks."preview:deploy"]
description = "Deploy an isolated preview Worker"
depends = ["install"]
run = """
#!/usr/bin/env bash
set -euo pipefail

: "${PREVIEW_WORKER_NAME:?PREVIEW_WORKER_NAME is required}"
: "${PREVIEW_INGEST_NAME:?PREVIEW_INGEST_NAME is required}"
: "${PREVIEW_SITE_URL:?PREVIEW_SITE_URL is required}"
: "${CF_ACCESS_TEAM_DOMAIN:?CF_ACCESS_TEAM_DOMAIN is required}"
: "${CF_ACCESS_AUD:?CF_ACCESS_AUD is required}"
: "${PREVIEW_SECRETS_FILE:?PREVIEW_SECRETS_FILE is required}"

PREVIEW_CONFIG=$(mktemp ./wrangler.preview.generated.XXXXXX.toml)
trap 'rm -f "$PREVIEW_CONFIG"' EXIT
sed \
  -e "s/__PREVIEW_INGEST_NAME__/$PREVIEW_INGEST_NAME/g" \
  wrangler.preview.toml > "$PREVIEW_CONFIG"

pnpm exec wrangler deploy \
  --config "$PREVIEW_CONFIG" \
  --name "$PREVIEW_WORKER_NAME" \
  --var DEPLOYMENT_ENV:preview \
  --var BETTER_AUTH_URL:"$PREVIEW_SITE_URL" \
  --var CF_ACCESS_TEAM_DOMAIN:"$CF_ACCESS_TEAM_DOMAIN" \
  --var CF_ACCESS_AUD:"$CF_ACCESS_AUD" \
  --secrets-file "$PREVIEW_SECRETS_FILE"
"""

[tasks."preview:delete"]
description = "Delete an isolated preview Worker"
depends = ["install"]
run = """
#!/usr/bin/env bash
set -euo pipefail
: "${PREVIEW_WORKER_NAME:?PREVIEW_WORKER_NAME is required}"
pnpm exec wrangler delete --name "$PREVIEW_WORKER_NAME" --force
"""
