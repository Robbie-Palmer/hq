name = "work-graph-github-observer"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = true

[[queues.producers]]
binding = "DELIVERIES"
queue = "work-graph-github-deliveries"

[[queues.consumers]]
queue = "work-graph-github-deliveries"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 300
dead_letter_queue = "work-graph-github-deliveries-dlq"
max_concurrency = 1

# Replaced by the deploy helper with the Terraform-managed binding.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
