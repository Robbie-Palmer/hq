name = "work-graph-github-observer"
main = "src/index.ts"
compatibility_date = "2026-09-15"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[[queues.producers]]
binding = "DELIVERIES"
queue = "work-graph-github-deliveries"

# The follow-up consumer ticket replaces the retry-only handler with evidence
# normalization. Until then, bounded retries move accepted deliveries to the
# DLQ instead of silently discarding them.
[[queues.consumers]]
queue = "work-graph-github-deliveries"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 300
dead_letter_queue = "work-graph-github-deliveries-dlq"
max_concurrency = 1
