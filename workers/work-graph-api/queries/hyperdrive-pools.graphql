query WorkGraphPools(
  $accountTag: string!
  $configId: string!
  $bucketName: string!
  $start: Time!
  $end: Time!
) {
  viewer {
    accounts(filter: { accountTag: $accountTag }) {
      hyperdrivePoolSizesAdaptiveGroups(
        limit: 10000
        filter: {
          configId: $configId
          datetime_geq: $start
          datetime_leq: $end
        }
      ) {
        avg {
          currentPoolSize
          availablePoolSlots
          waitingClients
        }
        max {
          maxPoolSize
          currentPoolSize
          waitingClients
        }
        dimensions {
          coloCode
        }
      }
      hyperdriveQueriesAdaptiveGroups(
        limit: 10000
        filter: {
          configId: $configId
          datetime_geq: $start
          datetime_leq: $end
          eventStatus: "error"
        }
      ) {
        count
      }
      r2OperationsAdaptiveGroups(
        limit: 10000
        filter: {
          bucketName: $bucketName
          datetime_geq: $start
          datetime_leq: $end
        }
      ) {
        sum {
          requests
        }
        dimensions {
          actionType
          actionStatus
        }
      }
      r2StorageAdaptiveGroups(
        limit: 1
        filter: {
          bucketName: $bucketName
          datetime_geq: $start
          datetime_leq: $end
        }
        orderBy: [datetime_DESC]
      ) {
        max {
          objectCount
          uploadCount
          payloadSize
          metadataSize
        }
        dimensions {
          datetime
        }
      }
    }
  }
}
