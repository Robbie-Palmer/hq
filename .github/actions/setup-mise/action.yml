name: Setup mise
description: Install the repository's pinned mise version and root tools

runs:
  using: composite
  steps:
    - name: Read pinned mise version
      id: version
      shell: bash
      env:
        MISE_VERSION_FILE: ${{ github.action_path }}/mise-version
      run: |
        version="$(<"$MISE_VERSION_FILE")"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::mise-version must contain one mise version"
          exit 1
        fi
        printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ steps.version.outputs.value }}
        experimental: true
        minimum_release_age: 24h
