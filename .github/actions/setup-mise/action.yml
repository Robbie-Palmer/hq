name: Setup mise
description: Install the repository's pinned mise version and root tools

runs:
  using: composite
  steps:
    - name: Read pinned mise version
      id: version
      shell: bash
      env:
        T3_CODE_DOCKERFILE: ${{ github.action_path }}/../../../homelab/images/t3-code/Dockerfile
      run: |
        version="$(sed -n \
          's/^FROM ghcr\.io\/jdx\/mise:\([^@]*\)@sha256:[a-f0-9]\{64\} AS mise-cli$/\1/p' \
          "$T3_CODE_DOCKERFILE")"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::the t3-code Dockerfile must pin one mise image version and digest"
          exit 1
        fi
        printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ steps.version.outputs.value }}
        experimental: true
        minimum_release_age: 24h
