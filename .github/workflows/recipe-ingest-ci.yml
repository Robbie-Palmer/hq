name: Recipe Ingest CI

on:
  pull_request:
    paths:
      - "workers/recipe-ingest/**"
      - "packages/recipe-parsing/**"
      - "packages/recipe-db/**"
      - "packages/recipe-domain/**"
      - "patches/**"
      - ".github/workflows/recipe-ingest-ci.yml"
      # Mirrored in tests/config-parity.test.ts, so drift in any copy of the
      # shared model/bucket/Hyperdrive settings fails this workflow.
      - "workers/recipe-api/wrangler.toml"
      - "workers/recipe-api/wrangler.preview.toml"
      - "ml-pipelines/recipe-parsing/params.yaml"
      - "infra/public-platform/variables.tf"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/recipe-ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter recipe-ingest...

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate Worker bundle
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/recipe-ingest-bundle
