name: Personal Finance Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/personal-finance/**"
      - ".github/workflows/personal-finance-infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-finance-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-personal-finance
    defaults:
      run:
        working-directory: infra/personal-finance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Remove stale Terraform plan
        run: rm -f .planfile

      - name: Terraform plan with apply credentials
        run: mise run //infra/personal-finance:plan
        env:
          CI: "true"
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

      - name: Add Terraform plan to summary
        uses: borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542 # v3
        with:
          token: ${{ github.token }}
          planfile: .planfile
          working-directory: ./infra/personal-finance
          skip-comment: true

      - name: Terraform apply
        if: ${{ success() && hashFiles('infra/personal-finance/.planfile') != '' }}
        run: mise run //infra/personal-finance:apply
        env:
          CI: "true"
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

      - name: Remove Terraform plan
        if: ${{ always() }}
        run: rm -f .planfile
