name: Lint CI

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.yml"
      - "**/*.yaml"
      # Code files: only the spelling step checks these, but without them a
      # code-only PR would skip the typos gate entirely
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - ".github/workflows/lint-ci.yml"
      - ".mise.toml"
      - ".markdownlint.json"
      - ".yamllint"
      - "_typos.toml"
      - "package.json"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise run //:install

      - name: Lint Markdown files
        run: mise run //:lint:markdown:check

      - name: Lint YAML files
        run: mise run //:lint:yaml

      - name: Lint GitHub Actions workflows
        run: mise run //:lint:actions

      - name: Check spelling
        run: mise run //:lint:typos
