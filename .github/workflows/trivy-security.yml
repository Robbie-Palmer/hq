name: Trivy Security Scan

on:
  pull_request:
    paths:
      # IaC / config-shaped paths (keep broad enough that new roots are not
      # silently skipped on PRs; weekly schedule is the full-tree backstop)
      - "infra/**"
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - "**/compose.yml"
      - "**/compose.yaml"
      - "**/Chart.yaml"
      - "**/values.yml"
      - "**/values.yaml"
      - "**/kubernetes/**"
      - "**/k8s/**"
      - "**/helm/**"
      - ".trivyignore.yaml"
      # Dependencies
      - "**/pnpm-lock.yaml"
      - "**/package.json"
      - ".github/workflows/trivy-security.yml"
  schedule:
    # Weekly scan every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      # Trivy treats each Kustomize patch as a complete Kubernetes object. Scan
      # the deployed form so inherited security settings remain visible.
      - name: Render Kubernetes manifests
        run: |
          mkdir -p trivy-rendered-kubernetes
          mise run //homelab:k3s-render-home > trivy-rendered-kubernetes/home.yaml
          mise run //homelab:k3s-render-remote > trivy-rendered-kubernetes/remote.yaml

      # Whole workspace: never pin to a single Terraform root.
      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-iac-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          trivyignores: ".trivyignore.yaml"
          timeout: "10m"
          skip-dirs: "node_modules,.pnpm-store,.terraform,homelab/k3s"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: "trivy-iac-results.sarif"
          category: "trivy-iac"

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-deps-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          timeout: "10m"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: "trivy-deps-results.sarif"
          category: "trivy-dependencies"
