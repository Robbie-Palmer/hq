name: Tailnet Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailnet-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-tailnet-infra
    defaults:
      run:
        working-directory: infra/tailnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mise

      - name: Remove stale Terraform plan
        run: rm -f .planfile

      - name: Create a fresh plan with apply credentials
        run: mise run //infra/tailnet:plan
        env:
          CI: "true"
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
          TAILNET_PRIVATE_ADDRESS_LAB_HOST: ${{ secrets.TAILNET_PRIVATE_ADDRESS_LAB_HOST }}
          TAILNET_PRIVATE_ADDRESS_PRIMARY_DNS: ${{ secrets.TAILNET_PRIVATE_ADDRESS_PRIMARY_DNS }}
          TAILNET_USER_LOGIN_OPERATOR: ${{ secrets.TAILNET_USER_LOGIN_OPERATOR }}

      - name: Apply the fresh plan
        run: mise run //infra/tailnet:apply
        env:
          CI: "true"
          TAILNET_APPLY_CONFIRM: apply hq-tailnet
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
          TAILNET_PRIVATE_ADDRESS_LAB_HOST: ${{ secrets.TAILNET_PRIVATE_ADDRESS_LAB_HOST }}
          TAILNET_PRIVATE_ADDRESS_PRIMARY_DNS: ${{ secrets.TAILNET_PRIVATE_ADDRESS_PRIMARY_DNS }}
          TAILNET_USER_LOGIN_OPERATOR: ${{ secrets.TAILNET_USER_LOGIN_OPERATOR }}

      - name: Remove Terraform plan
        if: ${{ always() }}
        run: rm -f .planfile
