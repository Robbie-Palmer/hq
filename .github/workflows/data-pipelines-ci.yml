name: Data Pipelines CI

on:
  push:
    paths:
      - "data-pipelines/**"
      - ".github/actions/setup-mise/**"
      - ".github/workflows/data-pipelines-ci.yml"
      - ".mise.toml"
  pull_request:
    paths:
      - "data-pipelines/**"
      - ".github/actions/setup-mise/**"
      - ".github/workflows/data-pipelines-ci.yml"
      - ".mise.toml"

permissions:
  contents: read

jobs:
  work-graph-analytics-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check Work Graph dbt lakehouse models
        run: mise run //data-pipelines/work-graph-analytics:check
