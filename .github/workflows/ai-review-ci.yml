name: Stateful AI review CI

on:
  pull_request:
    paths:
      - "ai-review/**"
      - "packages/ai-review-domain/**"
      - ".github/workflows/ai-review-ci.yml"
      - ".mise.toml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check standalone project
        run: mise run //ai-review:check

      - name: Verify deploy bundle
        run: mise run //ai-review:deploy:dry-run
