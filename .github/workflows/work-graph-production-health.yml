name: Work Graph production health

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: work-graph-production-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-work-graph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
      - name: Query 5XX and Hyperdrive health
        run: mise run //workers/work-graph-api:diagnostics:monitor
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DIAGNOSTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_DIAGNOSTICS_API_TOKEN }}
          WORK_GRAPH_HYPERDRIVE_ID: ${{ secrets.WORK_GRAPH_HYPERDRIVE_ID }}
      - name: Smoke-test production
        if: ${{ !cancelled() }}
        run: mise run //workers/work-graph-api:smoke:production
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          WORK_GRAPH_API_URL: ${{ secrets.WORK_GRAPH_API_URL }}
