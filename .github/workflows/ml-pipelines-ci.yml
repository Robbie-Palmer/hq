name: ML Pipelines CI

on:
  pull_request:
    paths:
      - "ml-pipelines/**"
      - "data-products/nucls/**"
      - "data-products/panda/**"
      - "data-products/pathologize/nucleus-analysis/**"
      - "packages/recipe-parsing/**"
      - "packages/recipe-domain/**"
      - "packages/ai-review-domain/**"
      - "packages/data-artifacts/**"
      - "packages/ml-evaluation/**"
      - "packages/pathologize-tiler/**"
      - "packages/ultralytics-extensions/**"
      - "patches/@cooklang__cooklang@*.patch"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ml-pipelines-ci.yml"

permissions:
  contents: read

jobs:
  data-artifacts-package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check shared data artifacts package
        run: mise run //packages/data-artifacts:check

  ml-evaluation-package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check shared ML evaluation package
        run: mise run //packages/ml-evaluation:check

  pathologize-tiler-package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check Pathologize tiler package
        run: mise run //packages/pathologize-tiler:check

  ultralytics-extensions-package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check Ultralytics extensions package
        run: mise run //packages/ultralytics-extensions:check

  nucls-data-products-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - nucls/corrected-single-rater
          - panda/challenge-2020
          - pathologize/nucleus-analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check ${{ matrix.project }} data product
        run: mise run //data-products/${{ matrix.project }}:check

  ai-review-evaluation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check AI reviewer evaluation pipeline
        run: mise run //ml-pipelines/ai-review-evaluation:check

  financial-document-idp-evaluation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check financial-document IDP evaluation pipeline
        run: mise run //ml-pipelines/financial-document-idp-evaluation:check

  pathologize-benchmark-contracts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check shared Pathologize benchmark contracts
        run: mise run //ml-pipelines/pathologize-benchmark-contracts:check

  pathologize-benchmark-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - pathologize-slide-quality-benchmark
          - pathologize-tiling-benchmark
          - pathologize-cell-analysis-benchmark
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check ${{ matrix.project }}
        run: mise run //ml-pipelines/${{ matrix.project }}:check

  pathologize-data-registry-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check Pathologize data registry
        run: mise run //ml-pipelines/pathologize-data-registry:check

  wsi-analysis-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-pipelines/wsi-analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check WSI analysis Python project
        run: mise run //ml-pipelines/wsi-analysis:check

  dvc-validate-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: production-ci
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      matrix:
        pipeline:
          - recipe-parsing
          - recipe-dataset
          - writing-editor-evaluation
    defaults:
      run:
        working-directory: ml-pipelines/${{ matrix.pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Validate DVC remote
        if: matrix.pipeline != 'writing-editor-evaluation'
        run: mise run //ml-pipelines:dvc -- pull

      - name: Pull writing review evidence
        if: matrix.pipeline == 'writing-editor-evaluation'
        run: mise run //ml-pipelines/writing-editor-evaluation:review-evidence:pull

      - name: Get pnpm store directory
        if: matrix.pipeline == 'recipe-parsing'
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.pipeline == 'recipe-parsing'
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise run //:install

      - name: Check shared parsing package
        if: matrix.pipeline == 'recipe-parsing'
        run: mise run //packages/recipe-parsing:check

      - name: Run tests
        if: matrix.pipeline == 'recipe-parsing'
        run: mise :test

      - name: Gate deterministic URL-import baseline
        if: matrix.pipeline == 'recipe-parsing'
        run: mise run //ml-pipelines/recipe-parsing:url-import:baseline

      - name: Check recipe dataset pipeline
        if: matrix.pipeline == 'recipe-dataset'
        run: mise run //ml-pipelines/recipe-dataset:check

      - name: Check writing editor evaluation pipeline
        if: matrix.pipeline == 'writing-editor-evaluation'
        run: mise run //ml-pipelines/writing-editor-evaluation:check

      - name: Reproduce recipe dataset pipeline
        if: matrix.pipeline == 'recipe-dataset'
        run: mise run //ml-pipelines/recipe-dataset:repro

      - name: Reproduce writing review scorecard
        if: matrix.pipeline == 'writing-editor-evaluation'
        run: mise run //ml-pipelines/writing-editor-evaluation:evaluate:reviews

      - name: Comment metrics on PR
        run: |
          # Fetch main to ensure we have a reference for diff
          git fetch origin main:refs/remotes/origin/main || echo "Failed to fetch origin/main"
          
          echo "Debug: Running dvc metrics diff..."
          DIFF=$(mise run //ml-pipelines:dvc -- metrics diff --md origin/main || echo "DVC diff failed")
          echo "Debug: DIFF Content:"
          echo "$DIFF"
          
          DATA_ROWS=$(echo "$DIFF" | grep -c '^|' || true)
          echo "Debug: Data rows count: $DATA_ROWS"
          
          if [ "$DATA_ROWS" -gt 2 ]; then
             BODY="## ${{ matrix.pipeline }} metrics diff"$'\n\n'"$DIFF"
          else
             echo "Debug: Running dvc metrics show..."
             # Note: --all is not valid for 'show', removing it.
             SHOW=$(mise run //ml-pipelines:dvc -- metrics show --md || echo "DVC show failed")
             echo "Debug: SHOW Content:"
             echo "$SHOW"
             BODY="## ${{ matrix.pipeline }} metrics"$'\n\n'"$SHOW"
          fi
          
          MARKER="<!-- dvc-metrics:${{ matrix.pipeline }} -->"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          UPDATED_AT=$(date -u '+%Y-%m-%d %H:%M UTC')
          BODY="$MARKER"$'\n'"$BODY"$'\n\n'\
          "_Updated by [ML Pipelines CI run ${GITHUB_RUN_NUMBER}]($RUN_URL) at $UPDATED_AT._"

          # Update only this pipeline's comment so matrix jobs cannot overwrite
          # one another.
          BODY_FILE=$(mktemp)
          echo "$BODY" > "$BODY_FILE"

          COMMENT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" \
            | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/$COMMENT_ID" \
              -F "body=@$BODY_FILE" > /dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$BODY_FILE"
          fi

          rm -f "$BODY_FILE"
