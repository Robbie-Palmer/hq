name: t3-code image

on:
  pull_request:
    paths:
      - ".config/mise/**"
      - ".github/actions/setup-mise/**"
      - "homelab/images/t3-code/**"
      - "homelab/scripts/build-and-check-t3-image"
      - "homelab/scripts/check-t3-image"
      - "homelab/mise.toml"
      - ".github/workflows/t3-code-image.yml"
  push:
    branches:
      - main
    paths:
      - ".config/mise/**"
      - ".github/actions/setup-mise/**"
      - "homelab/images/t3-code/**"
      - "homelab/scripts/build-and-check-t3-image"
      - "homelab/scripts/check-t3-image"
      - "homelab/mise.toml"
      - ".github/workflows/t3-code-image.yml"
  workflow_dispatch:

concurrency:
  group: t3-code-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Build and test image
        run: mise run //homelab:t3-image-build-check

  publish:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Build and test image
        run: mise run //homelab:t3-image-build-check

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish image
        run: mise run //homelab:t3-image-push

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io || true
