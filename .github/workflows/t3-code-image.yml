name: t3-code image

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-mise/**"
      - "homelab/images/t3-code/**"
      - "homelab/scripts/check-t3-image"
      - "homelab/mise.toml"
      - ".github/workflows/t3-code-image.yml"
  workflow_dispatch:

concurrency:
  group: t3-code-image
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Build and test image
        run: |
          previous_apparmor_restriction=
          restore_apparmor_restriction() {
            if [ -n "$previous_apparmor_restriction" ]; then
              sudo sysctl --write \
                "kernel.apparmor_restrict_unprivileged_userns=$previous_apparmor_restriction"
            fi
          }
          trap restore_apparmor_restriction EXIT
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            previous_apparmor_restriction=$(sysctl --values kernel.apparmor_restrict_unprivileged_userns)
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          mise run //homelab:t3-image-build
          mise run //homelab:t3-image-check

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish image
        run: mise run //homelab:t3-image-push

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io || true
