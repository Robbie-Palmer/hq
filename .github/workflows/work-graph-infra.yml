name: Work Graph Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/work-graph/**"
      - ".github/workflows/work-graph-infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-graph-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-work-graph-infra
    defaults:
      run:
        working-directory: infra/work-graph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Create empty .env for mise
        run: touch .env

      - name: Remove stale Terraform plan
        run: rm -f .planfile

      - name: Terraform plan
        run: mise run //infra/work-graph:plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          TF_VAR_neon_org_id: ${{ secrets.NEON_ORG_ID }}
          WORK_GRAPH_DOPPLER_SERVICE_TOKEN: ${{ secrets.WORK_GRAPH_DOPPLER_SERVICE_TOKEN }}

      - name: Add Terraform plan to summary
        uses: borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542 # v3
        with:
          token: ${{ github.token }}
          planfile: .planfile
          working-directory: ./infra/work-graph
          skip-comment: true

      - name: Terraform apply and state credential check
        if: ${{ success() && hashFiles('infra/work-graph/.planfile') != '' }}
        run: mise run //infra/work-graph:apply
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          TF_VAR_neon_org_id: ${{ secrets.NEON_ORG_ID }}
          WORK_GRAPH_DOPPLER_SERVICE_TOKEN: ${{ secrets.WORK_GRAPH_DOPPLER_SERVICE_TOKEN }}

      - name: Remove Terraform plan
        if: ${{ always() }}
        run: rm -f .planfile
