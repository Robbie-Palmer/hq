name: Stateful AI review CD

on:
  push:
    branches:
      - main
    paths:
      - "ai-review/**"
      - "packages/ai-review-domain/**"
      - ".github/workflows/ai-review-cd.yml"
      - ".mise.toml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-review-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production-ai-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check standalone project
        run: mise run //ai-review:check

      - name: Deploy Worker, Durable Object, and Workflow
        env:
          AI_REVIEW_APP_ID: ${{ vars.AI_REVIEW_APP_ID }}
          AI_REVIEW_APP_INSTALLATION_ID: ${{ vars.AI_REVIEW_APP_INSTALLATION_ID }}
          AI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          AI_REVIEW_WEBHOOK_SECRET: ${{ secrets.AI_REVIEW_WEBHOOK_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: mise run //ai-review:deploy

      - name: Verify R2 lifecycle policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: mise run //ai-review:lifecycle:verify
