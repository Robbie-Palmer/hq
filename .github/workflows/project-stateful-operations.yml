name: Project stateful operations

on:
  workflow_call:
    inputs:
      action:
        description: Operation accepted by the generated project dispatcher
        required: true
        type: string
      operations_root:
        description: Repository-relative Terraform component path
        required: true
        type: string
      github_environment:
        description: Protected GitHub environment named by the project profile
        required: true
        type: string
      secret_config_ref:
        description: Redacted Doppler config reference named by the project profile
        required: true
        type: string
      subject:
        description: PR number, rollback revision, or restore drill ID
        required: false
        default: ""
        type: string
      checkout_ref:
        description: Exact revision to operate
        required: false
        default: ""
        type: string
      plan_artifact:
        description: Artifact carrying a reviewed production Terraform plan
        required: false
        default: "stateful-production-plan"
        type: string
      expected_plan_sha256:
        description: Digest returned by a prior production-plan call
        required: false
        default: ""
        type: string
    secrets:
      DOPPLER_TOKEN:
        description: Config-scoped token for secret_config_ref
        required: true
    outputs:
      plan_sha256:
        description: Digest of the saved Terraform plan
        value: ${{ jobs.operate.outputs.plan_sha256 }}

permissions:
  contents: read

jobs:
  operate:
    name: ${{ inputs.action }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.github_environment }}
    outputs:
      plan_sha256: ${{ steps.result.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: $/.github/actions/setup-mise

      - name: Validate requested operation
        env:
          ACTION: ${{ inputs.action }}
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          OPERATIONS_GITHUB_ENVIRONMENT: ${{ inputs.github_environment }}
          OPERATIONS_ROOT: ${{ inputs.operations_root }}
          OPERATIONS_SECRET_CONFIG_REF: ${{ inputs.secret_config_ref }}
          SUBJECT: ${{ inputs.subject }}
        run: mise run //:project:stateful-operation -- validate

      - name: Download reviewed Terraform plan
        if: ${{ inputs.action == 'production-apply' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.plan_artifact }}
          path: ${{ inputs.operations_root }}/operations/evidence

      - name: Run generated operation
        env:
          ACTION: ${{ inputs.action }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          OPERATIONS_GITHUB_ENVIRONMENT: ${{ inputs.github_environment }}
          OPERATIONS_ROOT: ${{ inputs.operations_root }}
          OPERATIONS_SECRET_CONFIG_REF: ${{ inputs.secret_config_ref }}
          SUBJECT: ${{ inputs.subject }}
        run: mise run //:project:stateful-operation -- run

      - name: Record plan digest
        id: result
        if: ${{ inputs.action == 'production-plan' }}
        env:
          ACTION: ${{ inputs.action }}
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          OPERATIONS_GITHUB_ENVIRONMENT: ${{ inputs.github_environment }}
          OPERATIONS_ROOT: ${{ inputs.operations_root }}
          OPERATIONS_SECRET_CONFIG_REF: ${{ inputs.secret_config_ref }}
          SUBJECT: ${{ inputs.subject }}
        run: mise run //:project:stateful-operation -- record-plan-digest

      - name: Upload reviewed Terraform plan
        if: ${{ inputs.action == 'production-plan' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.plan_artifact }}
          path: |
            ${{ inputs.operations_root }}/operations/evidence/production.tfplan.age
            ${{ inputs.operations_root }}/operations/evidence/production.tfplan.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Upload rollout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollout-evidence-${{ inputs.action }}-${{ github.run_attempt }}
          path: ${{ inputs.operations_root }}/operations/evidence/*.json
          if-no-files-found: error
          retention-days: 30
