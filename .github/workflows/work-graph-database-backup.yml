name: Work Graph Database Backup

on:
  workflow_dispatch:
  schedule:
    # Match the recipe database policy chosen for Neon Free plan egress.
    - cron: "17 3 * * 0"

concurrency:
  group: work-graph-database-backup
  cancel-in-progress: false

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    environment:
      name: production-work-graph-backup
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Create and upload encrypted backup
        timeout-minutes: 30
        run: mise run //backups:backup
        env:
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_BACKUP_LABEL: work-graph
          NEON_DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_DATABASE_BACKUPS_BUCKET_NAME: ${{ vars.R2_DATABASE_BACKUPS_BUCKET_NAME }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  notify-failure:
    needs: backup
    if: ${{ always() && needs.backup.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh issue list --search "Work Graph database backup failed in:title" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "Issue #$existing already exists, skipping"
          else
            gh issue create \
              --title "Work Graph database backup failed" \
              --body "The scheduled encrypted Work Graph database backup failed.

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The most recent successful Work Graph R2 backup may now be stale. Please investigate and rerun the workflow."
          fi
