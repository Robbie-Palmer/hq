name: Public Platform Infrastructure CD

on:
  push:
    branches:
      - main
    paths:
      - "infra/public-platform/**"
      - ".github/workflows/infra-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment:
      name: production-infra
    defaults:
      run:
        working-directory: infra/public-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      # mise (infra/public-platform/mise.toml) loads .env if present; create it empty so the
      # secrets below reach terraform through the step env: blocks rather than the
      # runner filesystem or the checkout/mise/comment steps.
      - name: Create empty .env for mise
        run: touch .env

      - name: Terraform Plan
        run: mise run //infra/public-platform:plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cf_images_account_hash: ${{ vars.CF_IMAGES_ACCOUNT_HASH }}
          TF_VAR_posthog_key: ${{ vars.POSTHOG_KEY }}
          TF_VAR_github_token: ${{ secrets.MISE_GITHUB_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          TF_VAR_neon_org_id: ${{ secrets.NEON_ORG_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          TF_VAR_posthog_project_id: ${{ vars.POSTHOG_PROJECT_ID }}
          TF_VAR_slack_webhook_url: ${{ secrets.CLOUDFLARE_SLACK_WEBHOOK_URL }}

      - name: Add Terraform Plan to Summary
        uses: borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542 # v3
        with:
          token: ${{ github.token }}
          planfile: .planfile
          working-directory: ./infra/public-platform
          skip-comment: true

      - name: Terraform Apply
        run: mise run //infra/public-platform:apply
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cf_images_account_hash: ${{ vars.CF_IMAGES_ACCOUNT_HASH }}
          TF_VAR_posthog_key: ${{ vars.POSTHOG_KEY }}
          TF_VAR_github_token: ${{ secrets.MISE_GITHUB_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          TF_VAR_neon_org_id: ${{ secrets.NEON_ORG_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          TF_VAR_posthog_project_id: ${{ vars.POSTHOG_PROJECT_ID }}
          TF_VAR_slack_webhook_url: ${{ secrets.CLOUDFLARE_SLACK_WEBHOOK_URL }}
