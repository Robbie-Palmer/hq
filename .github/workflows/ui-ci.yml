name: UI CI

on:
  pull_request:
    paths:
      - "ui/**"
      - "cpp/autonomic-satellite-swarm/**"
      - "cpp/mise.toml"
      - ".github/workflows/ui-ci.yml"
      - ".mise.toml"
      - ".remarkrc.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    environment:
      name: production-site-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The dependency detector compares the PR head with both parents of
          # GitHub's synthetic merge commit.
          fetch-depth: 2
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      # Cache the pnpm content-addressable store so installs restore packages
      # from disk instead of re-downloading them on every run.
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise run //:install

      - name: Detect Mermaid dependency update
        id: mermaid-dependency
        working-directory: ui
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(pnpm exec tsx scripts/dependency-version-changed.ts mermaid "$BASE_SHA" "$HEAD_SHA")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Lint MDX files
        run: mise run //:lint:mdx:check

      - name: Run checks
        run: mise run //ui:check

      # Persist Next.js's incremental build cache (compiled modules, SWC output)
      # so the Build step reuses unchanged work. The key is invalidated on lock
      # or source changes; restore-keys still seeds the cache from the closest
      # previous build so a content edit doesn't force a cold compile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('ui/app/**', 'ui/components/**', 'ui/content/**', 'ui/lib/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: |
          mise run //ui:build
        env:
          NEXT_PUBLIC_CF_IMAGES_ACCOUNT_HASH: ${{ vars.CF_IMAGES_ACCOUNT_HASH }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      # Depends on build output - mise caches the build
      - name: Run integration tests
        run: mise run //ui:test:integration

      - name: Render Mermaid diagrams with Playwright
        if: steps.mermaid-dependency.outputs.changed == 'true'
        run: mise run //ui:test:e2e:mermaid

      - name: Audit satellite-swarm browser simulation
        run: mise run //ui:audit:satellite-swarm:serve
        env:
          NEXT_PUBLIC_CF_IMAGES_ACCOUNT_HASH: ${{ vars.CF_IMAGES_ACCOUNT_HASH }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
