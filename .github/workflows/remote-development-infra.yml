name: Remote Development Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the saved remote-development Terraform plan
        required: true
        default: false
        type: boolean

concurrency:
  group: remote-development-infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-remote-development-infra
    defaults:
      run:
        working-directory: infra/remote-development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Create empty .env for mise
        run: touch .env

      - name: Remove stale Terraform plan file
        run: rm -f .planfile

      - name: Terraform Plan
        run: mise run //infra/remote-development:plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          TF_VAR_bootstrap_ssh_cidrs: ${{ vars.BOOTSTRAP_SSH_CIDRS || '[]' }}
          TF_VAR_bootstrap_mode_enabled: ${{ vars.BOOTSTRAP_MODE_ENABLED || 'false' }}

      - name: Add Terraform Plan to Summary
        uses: borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542 # v3
        with:
          token: ${{ github.token }}
          planfile: .planfile
          working-directory: ./infra/remote-development
          skip-comment: true

      - name: Terraform Apply
        if: ${{ inputs.apply && success() && hashFiles('infra/remote-development/.planfile') != '' }}
        run: mise run //infra/remote-development:apply
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          TF_VAR_bootstrap_ssh_cidrs: ${{ vars.BOOTSTRAP_SSH_CIDRS || '[]' }}
          TF_VAR_bootstrap_mode_enabled: ${{ vars.BOOTSTRAP_MODE_ENABLED || 'false' }}

      - name: Remove Terraform plan
        if: ${{ always() }}
        run: rm -f .planfile
