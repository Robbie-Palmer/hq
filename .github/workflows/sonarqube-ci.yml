name: SonarQube CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile_jasmin:
        description: Profile the SonarJasmin JS/TS security engine
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise run //:install

      - name: Evaluate NixOS definitions
        run: mise run //homelab:nix-flake-check

      - name: Test Kubernetes manifests
        run: mise run //homelab:k3s-test-remote

      - name: Resolve C++ toolchain cache paths
        id: cpp-toolchain
        shell: bash
        run: |
          paths="$(
            mise ls --current --json --cd cpp/autonomic-satellite-swarm |
              jq --raw-output --arg prefix "$GITHUB_WORKSPACE/cpp/" '
                [
                  to_entries[].value[]
                  | select(.source.type == "mise.toml")
                  | select(.source.path | startswith($prefix))
                  | .install_path
                ]
                | unique[]
              '
          )"

          if [ -z "$paths" ]; then
            echo "::error::mise did not resolve any C++ toolchain cache paths"
            exit 1
          fi

          {
            echo 'paths<<MISE_PATHS'
            echo "$paths"
            echo 'MISE_PATHS'
          } >> "$GITHUB_OUTPUT"

      - name: Restore C++ toolchain cache
        id: cpp-toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cpp-toolchain.outputs.paths }}
          key: mise-cpp-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup-mise/**', 'cpp/**/mise.toml') }}

      - name: Install coverage toolchain
        shell: bash
        run: |
          attempt=1
          until mise install --jobs 1 --cd cpp/autonomic-satellite-swarm; do
            if (( attempt >= 4 )); then
              echo "::error::Coverage toolchain installation failed after $attempt attempts"
              exit 1
            fi

            delay=$((attempt * 10))
            echo "::warning::Coverage toolchain installation failed on attempt $attempt; retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Save C++ toolchain cache
        if: steps.cpp-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cpp-toolchain.outputs.paths }}
          key: ${{ steps.cpp-toolchain-cache.outputs.cache-primary-key }}

      - name: Generate coverage reports
        # Several coverage tasks invoke pnpm install against the shared workspace.
        # Serial execution avoids install races and CPU-starved test timeouts.
        run: mise run --jobs 1 //:sonar:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ai-review/coverage/lcov.info
            cpp/autonomic-satellite-swarm/coverage/sonarqube.xml
            ui/coverage/lcov.info
            packages/ai-review-domain/coverage/lcov.info
            packages/browser-base/coverage/lcov.info
            packages/node-base/coverage/lcov.info
            packages/observability/coverage/lcov.info
            packages/recipe-parsing/coverage/lcov.info
            packages/ts-base/coverage/lcov.info
            packages/work-graph-cli/coverage/lcov.info
            packages/work-graph-db/coverage/lcov.info
            packages/work-graph-domain/coverage/lcov.info
            packages/writing-editor-domain/coverage/lcov.info
            ml-pipelines/ai-review-evaluation/coverage/lcov.info
            ml-pipelines/recipe-parsing/coverage/lcov.info
            ml-pipelines/writing-editor-evaluation/coverage/lcov.info
            ml-pipelines/wsi-analysis/coverage.xml
            workers/recipe-api/coverage/lcov.info
            workers/recipe-ingest/coverage/lcov.info
            workers/work-graph-api/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  analysis:
    name: Analysis
    needs: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment:
      name: production-ci
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore SonarQube package cache
        id: sonar-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise run //:install

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      # This job never runs for fork pull requests, so environment protection
      # and repository secrets cannot delay or leak into their test job.
      - name: Verify SonarQube credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is required for SonarQube Cloud analysis"
            exit 1
          fi

      - name: Read project version
        if: github.ref == 'refs/heads/main'
        id: project-version
        shell: bash
        run: |
          version=$(node --print "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version is not a safe semantic version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Configure scanner arguments
        id: scanner-arguments
        shell: bash
        env:
          PROJECT_VERSION: ${{ steps.project-version.outputs.version }}
          PROFILE_JASMIN: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_jasmin }}
        run: |
          args=()

          if [ -n "$PROJECT_VERSION" ]; then
            args+=("-Dsonar.projectVersion=$PROJECT_VERSION")
          fi

          if [ "$PROFILE_JASMIN" = "true" ]; then
            args+=(
              "-Dsonar.jasmin.internal.js.ts.disabled=false"
              "-Dsonar.jasmin.internal.enable.metrics=true"
              "-Dsonar.jasmin.internal.enable.stacktracing=true"
              "-Dsonar.verbose=true"
            )
          fi

          printf 'args=%s\n' "${args[*]}" >> "$GITHUB_OUTPUT"

      - name: Scan with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: ${{ steps.scanner-arguments.outputs.args }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Save SonarQube package cache
        if: github.ref == 'refs/heads/main' && steps.sonar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ steps.sonar-cache.outputs.cache-primary-key }}
