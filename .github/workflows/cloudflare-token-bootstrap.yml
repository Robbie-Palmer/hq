name: Cloudflare Token Bootstrap

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: Committed project secret-bootstrap plan
        required: true
        type: string
      checkpoint:
        description: Human-provisioning checkpoint to acknowledge when applying
        required: false
        type: string
      apply:
        description: Create and distribute the declared account-owned tokens
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-token-bootstrap
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-cloudflare-token-bootstrap
    env:
      BOOTSTRAP_PLAN_PATH: ${{ inputs.plan_path }}
      BOOTSTRAP_CHECKPOINT: ${{ inputs.checkpoint }}
      CLOUDFLARE_TOKEN_PROVISIONER_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN_PROVISIONER_TOKEN }}
      CLOUDFLARE_BOOTSTRAP_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DOPPLER_BOOTSTRAP_TOKEN: ${{ secrets.DOPPLER_BOOTSTRAP_TOKEN }}
      GITHUB_BOOTSTRAP_TOKEN: ${{ secrets.GITHUB_BOOTSTRAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Show redacted plan
        run: mise //:project:secret-bootstrap:plan -- "$BOOTSTRAP_PLAN_PATH"

      - name: Check provisioning authority
        if: ${{ inputs.apply }}
        run: mise //:project:secret-bootstrap:conformance -- "$BOOTSTRAP_PLAN_PATH"

      - name: Create and distribute tokens
        if: ${{ inputs.apply }}
        run: |
          if [[ -n "$BOOTSTRAP_CHECKPOINT" ]]; then
            mise //:project:secret-bootstrap:apply -- "$BOOTSTRAP_PLAN_PATH" --acknowledge "$BOOTSTRAP_CHECKPOINT"
          else
            mise //:project:secret-bootstrap:apply -- "$BOOTSTRAP_PLAN_PATH"
          fi
