name: Autonomic Satellite Swarm CI

on:
  pull_request:
    paths:
      - ".github/workflows/autonomic-satellite-swarm-ci.yml"
      - ".mise.toml"
      - "cpp/.clang-format"
      - "cpp/.clang-tidy"
      - "cpp/.editorconfig"
      - "cpp/mise.toml"
      - "cpp/autonomic-satellite-swarm/**"
      - "ui/lib/browser/satellite-swarm-worker-client.ts"
      - "ui/public/simulations/autonomic-satellite-swarm/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autonomic-satellite-swarm-ci.yml"
      - ".mise.toml"
      - "cpp/.clang-format"
      - "cpp/.clang-tidy"
      - "cpp/.editorconfig"
      - "cpp/mise.toml"
      - "cpp/autonomic-satellite-swarm/**"
      - "ui/lib/browser/satellite-swarm-worker-client.ts"
      - "ui/public/simulations/autonomic-satellite-swarm/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check developer environment
        run: mise run //cpp/autonomic-satellite-swarm:doctor

      - name: Format, lint, test, sanitize, cover, and spell-check
        run: |
          mise run //cpp:format:check
          mise run //cpp/autonomic-satellite-swarm:lint
          mise run //cpp/autonomic-satellite-swarm:test
          mise run //cpp/autonomic-satellite-swarm:sanitize
          mise run //cpp/autonomic-satellite-swarm:coverage
          mise run //cpp/autonomic-satellite-swarm:scripts:check
          mise run //cpp/autonomic-satellite-swarm:lint:typos

  firmware:
    name: Firmware (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - uno
          - esp32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Compile firmware
        run: mise run //cpp/autonomic-satellite-swarm:firmware:${{ matrix.target }}

  browser:
    name: Browser WebAssembly parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Build WebAssembly and check native parity
        run: mise run //cpp/autonomic-satellite-swarm:browser:parity

      - name: Verify generated browser artifacts are untracked
        run: |
          test -f ui/public/simulations/autonomic-satellite-swarm/wasm/satellite-swarm.mjs
          test -f ui/public/simulations/autonomic-satellite-swarm/wasm/satellite-swarm.wasm
          test -z "$(git ls-files -- ui/public/simulations/autonomic-satellite-swarm/wasm)"
