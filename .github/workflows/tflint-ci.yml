name: TFLint CI

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/.tflint.hcl"
      - ".mise.toml"
      - ".github/workflows/tflint-ci.yml"

permissions: {}

jobs:
  tflint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Lint public platform infrastructure with TFLint
        run: mise run //infra/public-platform:lint:tflint

      - name: Lint bootstrap infrastructure with TFLint
        run: mise run //infra/bootstrap:lint:tflint

      - name: Lint remote development infrastructure with TFLint
        run: mise run //infra/remote-development:lint:tflint

      - name: Lint Work Graph infrastructure with TFLint
        run: mise run //infra/work-graph:lint:tflint
