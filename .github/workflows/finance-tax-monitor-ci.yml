name: Finance Tax Monitor CI

on:
  pull_request:
    paths:
      - "workers/finance-tax-monitor/**"
      - "packages/drizzle-postgres/**"
      - "packages/finance-tax-rules/**"
      - "packages/ts-base/**"
      - ".github/workflows/finance-tax-monitor-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mise

      - name: Check tax rule library
        run: mise run //packages/finance-tax-rules:check

      - name: Check shared PostgreSQL connection helpers
        run: mise run //packages/drizzle-postgres:check

      - name: Check scheduled Workflow
        run: mise run //workers/finance-tax-monitor:check
