[tools]
"conda:gxx" = "16.2.0"
# The pipx backend uses uv to install the pinned Python tools below.
uv = "0.12.15"
# Espressif's Arduino build tools invoke python3 during ESP32 firmware compilation.
python = "3.12.14"
cmake = "4.4.3"
ninja = "1.13.2"
"pipx:clang-format" = "23.1.1"
"pipx:clang-tidy" = "22.1.8"
"pipx:gcovr" = "8.6"

[tasks.format]
description = "Format all C++ and Arduino sources"
dir = "{{config_root}}"
run = "find . -type f ! -path '*/build/*' \\( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.ino' \\) -print0 | xargs -0 clang-format -i"

[tasks."format:check"]
description = "Check formatting for all C++ and Arduino sources"
dir = "{{config_root}}"
run = "find . -type f ! -path '*/build/*' \\( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.ino' \\) -print0 | xargs -0 clang-format --dry-run --Werror"
