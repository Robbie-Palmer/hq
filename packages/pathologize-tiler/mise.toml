[tools]
python = "3.12"
uv = "0.12.22"

[env]
PYTHONDONTWRITEBYTECODE = "1"

[tasks.sync]
description = "Install the locked Pathologize tiler environment"
run = "uv sync --locked"

[tasks.lock]
description = "Update the Pathologize tiler lockfile"
run = "uv lock"

[tasks.format]
description = "Format the Pathologize tiler"
depends = ["sync"]
run = "uv run --locked ruff format ."

[tasks.lint]
description = "Lint the Pathologize tiler"
depends = ["sync"]
run = "uv run --locked ruff format --check . && uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check the Pathologize tiler"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Test the Pathologize tiler"
depends = ["sync"]
run = "uv run --locked pytest --no-cov"

[tasks."test:coverage"]
description = "Test the Pathologize tiler with Cobertura coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml:coverage.xml"

[tasks.check]
description = "Run all Pathologize tiler checks"
depends = ["lint", "typecheck", "test:coverage"]
