[project]
name = "pathologize-tiler"
version = "0.1.0"
description = "CPU-first whole-slide tiling and physical-scale reads"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "openslide-bin>=4.0.0.11",
    "openslide-python>=1.4.3",
    "pillow>=13.0.0",
    "pylibjpeg>=2.1.0,<3",
    "wsidicom[pylibjpeg-openjpeg]>=0.36.1,<0.37",
]

[project.optional-dependencies]
cuda = [
    "nvidia-nvimgcodec-cu13[nvjpeg,nvjpeg2k]>=0.10.0.9,<0.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cases>=3.10.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "ty>=0.0.75",
]

[tool.uv.sources]
# Remove when https://github.com/smarie/python-pytest-cases/pull/386 is released.
pytest-cases = { git = "https://github.com/smarie/python-pytest-cases.git", rev = "37c72c1350899d45bc80e92b4b4168b5f7a7af7c" }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=pathologize_tiler --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
dynamic-function-decorator-return = "ignore"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "C90", "E", "F", "I", "N", "PERF", "PTH", "RUF", "S", "SIM", "T20", "TRY", "UP"]
ignore = [
    "TRY003", # Validation errors report the rejected request field and value.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
