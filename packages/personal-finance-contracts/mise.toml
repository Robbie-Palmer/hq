[tasks.install]
description = "Install dependencies for Personal Finance contracts"
depends = ["//:install"]

[tasks.typecheck]
description = "Typecheck Personal Finance contracts"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Test Personal Finance contracts"
depends = ["install"]
run = "pnpm test"

[tasks."test:coverage"]
description = "Test Personal Finance contracts with coverage"
depends = ["install"]
run = "pnpm test:coverage"

[tasks.check]
description = "Validate Personal Finance contracts"
depends = ["typecheck", "test"]
run = "test -f generated-component.yaml"
