[tools]
python = "3.12"
uv = "0.12.22"

[env]
PYTHONDONTWRITEBYTECODE = "1"
UV_PYTHON = "3.12"

[tasks.sync]
description = "Install the locked Ultralytics extensions environment"
run = "uv sync --locked"

[tasks.lock]
description = "Update the Ultralytics extensions lockfile"
run = "uv lock"

[tasks.format]
description = "Format Ultralytics extensions Python code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint Ultralytics extensions Python code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check Ultralytics extensions Python code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run Ultralytics extensions tests"
depends = ["sync"]
run = "uv run --locked pytest --no-cov"

[tasks."test:coverage"]
description = "Run Ultralytics extensions tests with Cobertura coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml:coverage.xml"

[tasks.check]
description = "Run all Ultralytics extensions checks"
depends = ["lint", "typecheck", "test:coverage"]
