[tasks.install]
description = "Install MDX rendering dependencies"
run = "pnpm install --frozen-lockfile --filter mdx-rendering..."

[tasks.typecheck]
description = "Typecheck the MDX rendering package"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Test the MDX rendering package"
depends = ["install"]
run = "pnpm test"

[tasks."test:coverage"]
description = "Test the MDX rendering package with LCOV coverage"
depends = ["install"]
run = "pnpm test:coverage"

[tasks.check]
description = "Check the MDX rendering package"
depends = ["typecheck", "test"]
