[tools]
python = "3.12"
uv = "0.12.22"

[env]
PYTHONDONTWRITEBYTECODE = "1"
UV_PYTHON = "3.12"

[tasks.sync]
description = "Install the locked ML evaluation environment"
run = "uv sync --locked"

[tasks.lock]
description = "Update the ML evaluation lockfile"
run = "uv lock"

[tasks.format]
description = "Format ML evaluation Python code"
depends = ["sync"]
run = "uv run --locked ruff format ."

[tasks.lint]
description = "Lint ML evaluation Python code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check ML evaluation Python code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run ML evaluation tests"
depends = ["sync"]
run = "uv run --locked pytest --no-cov"

[tasks."test:coverage"]
description = "Run ML evaluation tests with Cobertura coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml:coverage.xml"

[tasks.check]
description = "Run all ML evaluation checks"
depends = ["lint", "typecheck", "test:coverage"]
