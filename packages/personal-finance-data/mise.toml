[tasks.install]
description = "Install Personal Finance data boundary dependencies"
run = "pnpm install --frozen-lockfile --filter personal-finance-data..."

[tasks.typecheck]
description = "Typecheck Personal Finance data boundary"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Test Personal Finance data boundary"
depends = ["install"]
run = "pnpm test"

[tasks."test:coverage"]
description = "Test Personal Finance data boundary with coverage"
depends = ["install"]
run = "pnpm test:coverage"

[tasks."db:check"]
description = "Validate Personal Finance data boundary migration history and schema snapshot"
depends = ["install"]
run = "pnpm db:check"

[tasks."db:generate"]
description = "Generate a named Personal Finance data boundary migration"
depends = ["install"]
run = "pnpm db:generate"

[tasks."db:migrate"]
description = "Apply committed Personal Finance data boundary migrations to DATABASE_URL"
depends = ["install"]
run = "pnpm db:migrate"

[tasks.check]
description = "Check Personal Finance data boundary"
depends = ["typecheck", "test", "db:check"]
