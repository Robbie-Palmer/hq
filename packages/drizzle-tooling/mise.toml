[tasks.install]
description = "Install shared Drizzle tooling dependencies"
run = "pnpm install --frozen-lockfile --filter drizzle-tooling..."

[tasks.test]
description = "Test shared Drizzle migration tooling"
depends = ["install"]
run = "pnpm test"

[tasks.check]
description = "Check shared Drizzle migration tooling"
depends = ["test"]
