schema_version: 1

project:
  id: "example-stateful-service"
  name: "Example stateful service"
  kind: "application"
  published: false

components:
  - id: "api"
    name: "Example API"
    kind: "worker"
    template_ownership: "structure-only"
  - id: "example-stateful-service"
    name: "Example infrastructure"
    kind: "terraform-root"
    template_ownership: "structure-only"

layers:
  - layer: "governance"
  - layer: "base"
    slots:
      - "delivery.preview-environment"
      - "security.preview-access"
      - "secrets.runtime-store"
      - "secrets.ci-store"
  - layer: "typescript"
  - layer: "backend-api"
    slots:
      - "backend-api.runtime"
      - "backend-api.relational-connection"
  - layer: "database"
    slots:
      - "database.relational-engine"
      - "database.relational-host"
      - "database.relational-access"
      - "database.migration-discipline"
      - "database.backup-restore"
      - "database.preview-isolation"
  - layer: "infrastructure"
    slots:
      - "infrastructure.provisioner"
      - "infrastructure.state-backend"
  - layer: "observability"
    slots:
      - "observability.telemetry-protocol"
      - "observability.application-telemetry"
      - "observability.alert-evaluation"
      - "observability.alert-delivery"
  - layer: "storage"
    slots:
      - "storage.object-store"

requirements:
  - "preview-scoped-credentials"
  - "synthetic-preview-data"
  - "preview-cleanup"
  - "provider-registration"
  - "committed-migration-history"
  - "serialized-migration-runner"
  - "backup-key-custody"
  - "backup-retention-policy"
  - "restore-drill"
  - "fresh-migration-baseline"
  - "instrumented-runtime"
  - "telemetry-redaction"
  - "bounded-exporter-failure"
  - "telemetry-retention"
  - "responder-ownership"
  - "alert-routing"
  - "project-owned-slack-credentials"
  - "data-classification"
  - "object-lifecycle-policy"
  - "scoped-storage-credentials"

reconciliation:
  mode: "tracking"

nix:
  boundary: "none"

opentelemetry:
  enabled: true
  runtime: "typescript-worker"

rollout:
  operational_checks:
    - id: "generic-contract-check"
      command: "mise //packages/project-generator:check"
  migration_checkpoints: []
  stateful_operations:
    preview:
      github_environment: "example-preview"
      secret_config_ref: "doppler://example-stateful-service/prv_ci"
      provision: "mise //workers/example-api:preview:provision"
      migrate: "mise //workers/example-api:db:migrate:preview"
      seed_synthetic: "mise //workers/example-api:db:seed:preview"
      deploy: "mise //workers/example-api:deploy:preview"
      smoke_authenticated: "mise //workers/example-api:smoke:preview"
      smoke_telemetry: "mise //workers/example-api:smoke:telemetry"
      cleanup: "mise //workers/example-api:preview:cleanup"
    production:
      github_environment: "example-production"
      plan_secret_config_ref: "doppler://example-stateful-service/prd_plan"
      apply_secret_config_ref: "doppler://example-stateful-service/prd_apply"
      migrate: "mise //workers/example-api:db:migrate:production"
      deploy: "mise //workers/example-api:deploy:production"
      smoke: "mise //workers/example-api:smoke:production"
      rollback: "mise //workers/example-api:rollback:production"
    backup:
      github_environment: "example-backup"
      secret_config_ref: "doppler://example-stateful-service/prd_backup"
      schedule: "17 3 * * 0"
      create: "mise //backups:backup"
      restore: "mise //workers/example-api:restore:drill"
    alerting:
      github_environment: "example-alerting"
      secret_config_ref: "doppler://example-stateful-service/prd_alerts"
      responder: "Example service owner"
      smoke: "mise //workers/example-api:smoke:alert"
