# Score projection exercised by ADR 043 with score-compose 0.49.0 and score-k8s 0.22.0.
apiVersion: score.dev/v1b1
metadata:
  name: representative-service
containers:
  migrations:
    image: docker.io/library/busybox:1.37.0
    command: ["sh", "-c"]
    args: ["echo applying migrations to ${DATABASE_URL}"]
    variables:
      DATABASE_URL: "postgresql://${resources.database.username}:${resources.database.password}@${resources.database.host}:${resources.database.port}/${resources.database.database}"
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    before:
      api:
        ready: complete
  api:
    image: docker.io/library/busybox:1.37.0
    command: ["httpd", "-f", "-p", "8080"]
    variables:
      APP_ENV: prototype
      DATABASE_URL: "postgresql://${resources.database.username}:${resources.database.password}@${resources.database.host}:${resources.database.port}/${resources.database.database}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.telemetry.svc:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: representative-service
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /
        port: 8080
    readinessProbe:
      httpGet:
        path: /
        port: 8080
service:
  ports:
    http:
      port: 8080
      targetPort: 8080
resources:
  database:
    type: postgres
  hostname:
    type: dns
  ingress:
    type: route
    params:
      host: ${resources.hostname.host}
      path: /
      port: http
