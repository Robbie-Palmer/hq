        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Void one complete account history series
  /api/v1/households/{householdId}/accounts/{accountId}/capital-flows/{date}/{flowKind}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/Date"
      - $ref: "#/components/parameters/CapitalFlowKind"
    delete:
      operationId: deleteCapitalFlow
      x-browser-commands:
        - deleteCapitalFlow
      summary: Void one classified capital-flow observation
      tags:
        - Facts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Void one classified capital-flow observation
  /api/v1/households/{householdId}/transfers:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: recordTransfer
      x-browser-commands:
        - recordTransfer
      summary: Record a transfer, external income, or external spending
      tags:
        - Facts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordTransferRequest"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Record a transfer, external income, or external spending
  /api/v1/households/{householdId}/account-history-imports:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: importAccountHistory
      x-browser-commands:
        - importAccountHistory
      summary: Apply one atomic account-history import
      tags:
        - Facts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAccountHistoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
