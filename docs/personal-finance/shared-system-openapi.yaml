  /api/v1/households/{householdId}/exports:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: exportHousehold
      summary: Export the household in a selected portable format
      tags:
        - Migration
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - format
              properties:
                format:
                  type: string
                  enum:
                    - complete-v1
                    - assettracker-data-v1
      responses:
        "200":
          description: Portable export or a list of records that block legacy rollback
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                required:
                  - revision
                  - format
                  - status
                properties:
                  revision:
                    type: integer
                    minimum: 0
                    format: int64
                    maximum: 9007199254740991
                  format:
                    type: string
                    maxLength: 500
                  status:
                    type: string
                    enum:
                      - ready
                      - incompatible
                  data:
                    type: object
                    additionalProperties: true
                  blockingRecordTypes:
                    type: array
                    items:
                      type: string
                      maxLength: 500
                    maxItems: 10000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Export the household in a selected portable format
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: asset_tracker_session
  headers:
    ETag:
      description: Quoted household revision, for example `"42"`.
      schema:
        type: string
        pattern: ^"[0-9]+"$
        maxLength: 500
    RetryAfter:
      description: Seconds before the caller should retry.
      schema:
        type: integer
        minimum: 1
        format: int64
        maximum: 9007199254740991
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      description: Household authorization boundary
      schema:
        type: string
        format: uuid
        maxLength: 36
    AccountId:
      name: accountId
      in: path
      required: true
      description: Financial account ID
      schema:
        type: string
        format: uuid
        maxLength: 36
    FlowId:
      name: flowId
      in: path
      required: true
      description: Logical recurring-flow ID
      schema:
        type: string
        format: uuid
        maxLength: 36
    ExpenditureId:
      name: expenditureId
      in: path
      required: true
      description: Logical planned-expenditure ID
      schema:
        type: string
        format: uuid
        maxLength: 36
    ImportId:
      name: importId
      in: path
      required: true
      description: Validated local JSON import ID
      schema:
        type: string
        format: uuid
        maxLength: 36
    Date:
      name: date
      in: path
      required: true
      description: Financial fact valid date
      schema:
        type: string
        format: date
        maxLength: 10
    HistoryKind:
      name: historyKind
      in: path
      required: true
      description: Account history series to clear
      schema:
        type: string
        enum:
          - balances
          - capital-flows
    CapitalFlowKind:
      name: flowKind
      in: path
      required: true
      description: Capital-flow classification
      schema:
        $ref: "#/components/schemas/CapitalFlowKind"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID reused only when retrying this exact request
      schema:
        type: string
        format: uuid
        maxLength: 36
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted household revision last seen by the client
      schema:
        type: string
        pattern: ^"[0-9]+"$
        maxLength: 500
  responses:
    MutationSucceeded:
      description: The command committed or an earlier committed response was replayed.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MutationResult"
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid consumer session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The household role cannot perform this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Household or resource not found for this caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Idempotency key, domain state, or concurrent request conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaleRevision:
      description: If-Match does not equal the current household revision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Request JSON is well formed but violates a domain rule
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: If-Match was not supplied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
          maxLength: 80
        message:
          type: string
          maxLength: 500
        requestId:
          type: string
          maxLength: 80
        details:
          type: object
          additionalProperties: true
    HouseholdMembership:
      type: object
      additionalProperties: false
      required:
        - householdId
        - householdName
        - role
      properties:
        householdId:
          type: string
          format: uuid
          maxLength: 36
        householdName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum:
            - owner
            - editor
            - viewer
    Currency:
      type: string
      enum:
        - GBP
        - USD
    Money:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
        currency:
          $ref: "#/components/schemas/Currency"
    AssetType:
      type: string
      enum:
        - cash
        - stocks
        - bonds
        - reits
        - crypto
        - property
        - mortgage
        - debt
    LiquidityTier:
      type: string
      enum:
        - cash
        - liquid
        - illiquid
    CapitalFlowKind:
      type: string
      enum:
        - personalSaving
        - debtPrincipal
        - external
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - provider
        - currency
        - assetType
        - expectedAnnualReturn
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        provider:
          type: string
          minLength: 1
          maxLength: 200
        currency:
          $ref: "#/components/schemas/Currency"
        assetType:
          $ref: "#/components/schemas/AssetType"
        liquidity:
          $ref: "#/components/schemas/LiquidityTier"
        expectedAnnualReturn:
          type: number
          exclusiveMinimum: -1
        linkedAccountId:
          type: string
          format: uuid
          maxLength: 36
        openingBalance:
          type: number
        openingDate:
          type: string
          format: date
          maxLength: 10
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        closedAt:
          type: string
          format: date
          maxLength: 10
        transferToAccountId:
          type: string
          format: uuid
          maxLength: 36
        liquidity:
          $ref: "#/components/schemas/LiquidityTier"
    RecordBalanceRequest:
      type: object
      additionalProperties: false
      required:
        - balance
      properties:
        balance:
          type: number
    RecordTransferRequest:
      type: object
      additionalProperties: false
      required:
        - date
        - amount
      anyOf:
        - required:
            - fromAccountId
        - required:
            - toAccountId
      properties:
        date:
          type: string
          format: date
          maxLength: 10
        fromAccountId:
          type: string
          format: uuid
          maxLength: 36
        toAccountId:
          type: string
          format: uuid
          maxLength: 36
        amount:
          type: number
          exclusiveMinimum: 0
        receivedAmount:
          type: number
          exclusiveMinimum: 0
        feeAmount:
          type: number
          minimum: 0
        conversionProvider:
          type: string
          minLength: 1
          maxLength: 200
        flowId:
          type: string
          format: uuid
          maxLength: 36
    HistoryValue:
      type: object
      additionalProperties: false
      required:
        - date
        - value
      properties:
        date:
          type: string
          format: date
          maxLength: 10
        value:
          type: number
    ImportAccountHistoryRequest:
      type: object
      additionalProperties: false
      required:
        - accountId
      properties:
        accountId:
          type: string
          format: uuid
          maxLength: 36
        balances:
          type: array
          items:
            $ref: "#/components/schemas/HistoryValue"
          maxItems: 10000
        capitalFlows:
          type: array
          items:
            $ref: "#/components/schemas/HistoryValue"
          maxItems: 10000
        capitalFlowKind:
          $ref: "#/components/schemas/CapitalFlowKind"
        replaceCapitalFlows:
          type: boolean
    ImportIncomeHistoryRequest:
      type: object
      additionalProperties: false
      required:
        - income
      properties:
        income:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - date
              - amount
            properties:
              date:
                type: string
                format: date
                maxLength: 10
              amount:
                type: number
                minimum: 0
          maxItems: 10000
    FlowConversion:
      type: object
      additionalProperties: false
      required:
        - received
      properties:
        received:
          allOf:
            - $ref: "#/components/schemas/Money"
            - type: object
              properties:
                amount:
                  type: number
                  exclusiveMinimum: 0
        fee:
          allOf:
            - $ref: "#/components/schemas/Money"
            - type: object
              properties:
                amount:
                  type: number
                  minimum: 0
        provider:
          type: string
          minLength: 1
          maxLength: 200
    RecurringFlowRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - currency
        - frequency
      anyOf:
        - required:
            - fromAccountId
        - required:
            - toAccountId
      oneOf:
        - required:
            - amount
        - required:
            - formula
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        fromAccountId:
          type: string
          format: uuid
          maxLength: 36
        toAccountId:
          type: string
          format: uuid
          maxLength: 36
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          $ref: "#/components/schemas/Currency"
        conversion:
          $ref: "#/components/schemas/FlowConversion"
        grossAmount:
          type: number
          exclusiveMinimum: 0
        formula:
          type: object
          additionalProperties: false
          required:
            - kind
            - percentOfBalance
            - floor
          properties:
            kind:
              type: string
              const: minimumPayment
            percentOfBalance:
              type: number
              exclusiveMinimum: 0
              exclusiveMaximum: 1
            floor:
              type: number
              minimum: 0
        compensationKind:
          type: string
          enum:
            - takeHomeIncome
            - employeePension
            - employerPension
        frequency:
          type: string
          enum:
            - weekly
            - monthly
            - quarterly
            - yearly
        startDate:
          type: string
          format: date
          maxLength: 10
        endDate:
          type: string
          format: date
          maxLength: 10
    PlannedExpenditureRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - amount
        - date
        - fromAccountId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          type: number
          exclusiveMinimum: 0
        date:
          type: string
          format: date
          maxLength: 10
        fromAccountId:
          type: string
          format: uuid
          maxLength: 36
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        baseCurrency:
          $ref: "#/components/schemas/Currency"
        expectedAnnualInflation:
          type: number
          exclusiveMinimum: -1
        targetNetWorth:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        targetNetWorthIsReal:
          type: boolean
        withdrawalRate:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        valuationMaxAgeDays:
          type: integer
          minimum: 0
          format: int64
          maximum: 9007199254740991
    AccountSummary:
      type: object
      description: Current account projection. Responses may add fields within API v1.
      required:
        - id
        - name
        - provider
        - currency
        - assetType
        - expectedAnnualReturn
        - isOpen
        - latestBalance
        - latestSnapshotDate
        - cagr
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 500
        provider:
          type: string
          maxLength: 500
        currency:
          $ref: "#/components/schemas/Currency"
        assetType:
          $ref: "#/components/schemas/AssetType"
        liquidity:
          $ref: "#/components/schemas/LiquidityTier"
        expectedAnnualReturn:
          type: number
        isOpen:
          type: boolean
        latestBalance:
          type:
            - number
            - "null"
        latestSnapshotDate:
          type:
            - string
            - "null"
          format: date
          maxLength: 10
        cagr:
          type:
            - number
            - "null"
    AccountDetail:
      allOf:
        - $ref: "#/components/schemas/AccountSummary"
        - type: object
          required:
            - createdAt
            - snapshots
            - capitalFlows
            - netContributed
            - gainLoss
          properties:
            createdAt:
              type: string
              format: date
              maxLength: 10
            closedAt:
              type: string
              format: date
              maxLength: 10
            linkedAccountId:
              type: string
              format: uuid
              maxLength: 36
            expectedReturnChanges:
              type: array
              items:
                type: object
                required:
                  - date
                  - rate
                properties:
                  date:
                    type: string
                    format: date
                    maxLength: 10
                  rate:
                    type: number
              maxItems: 10000
            snapshots:
              type: array
              items:
                type: object
                required:
                  - date
                  - balance
                properties:
                  date:
                    type: string
                    format: date
                    maxLength: 10
                  balance:
                    type: number
              maxItems: 10000
            capitalFlows:
              type: array
              items:
                type: object
                required:
                  - date
                  - amount
                properties:
                  date:
                    type: string
                    format: date
                    maxLength: 10
                  amount:
                    type: number
                  kind:
                    $ref: "#/components/schemas/CapitalFlowKind"
              maxItems: 10000
            netContributed:
              type:
                - number
                - "null"
            gainLoss:
              type:
                - number
                - "null"
    DatedSeriesPoint:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          format: date
          maxLength: 10
      additionalProperties:
        type:
          - number
          - string
          - "null"
        maxLength: 500
    Transfer:
      type: object
      description: Accepted transfer fact. Responses may add fields within API v1.
      required: [id, date, amount]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        date:
          type: string
          format: date
          maxLength: 10
        fromAccountId:
          type: string
          format: uuid
          maxLength: 36
        toAccountId:
          type: string
          format: uuid
          maxLength: 36
        amount:
          type: number
        fromAmount:
          type: number
        toAmount:
          type: number
        feeAmount:
          type: number
        conversionProvider:
          type: string
          maxLength: 200
        flowId:
          type: string
          format: uuid
          maxLength: 36
    RecurringFlow:
      type: object
      description: Current recurring-flow plan. Responses may add fields within API v1.
      required: [id, name, currency, frequency, startDate]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 200
        fromAccountId:
          type: string
          format: uuid
          maxLength: 36
        toAccountId:
          type: string
          format: uuid
          maxLength: 36
        amount:
          type: number
        currency:
          $ref: "#/components/schemas/Currency"
        conversion:
          $ref: "#/components/schemas/FlowConversion"
        grossAmount:
          type: number
        formula:
          type: object
          additionalProperties: false
          required: [kind, percentOfBalance, floor]
          properties:
            kind:
              type: string
              const: minimumPayment
            percentOfBalance:
              type: number
            floor:
              type: number
        compensationKind:
          type: string
          enum: [takeHomeIncome, employeePension, employerPension]
        frequency:
          type: string
          enum: [weekly, monthly, quarterly, yearly]
        startDate:
          type: string
          format: date
          maxLength: 10
        endDate:
          type: string
          format: date
          maxLength: 10
    PlannedExpenditure:
      type: object
      description: Current planned expenditure. Responses may add fields within API v1.
      required: [id, name, amount, date, fromAccountId]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 200
        amount:
          type: number
        date:
          type: string
          format: date
          maxLength: 10
        fromAccountId:
          type: string
          format: uuid
          maxLength: 36
    IncomeRecord:
      type: object
      additionalProperties: false
      required:
        - date
        - amount
        - currency
      properties:
        date:
          type: string
          format: date
          maxLength: 10
        amount:
          type: number
          minimum: 0
        currency:
          $ref: "#/components/schemas/Currency"
    ValuationIssue:
      type: object
      additionalProperties: false
      required:
        - kind
        - date
      properties:
        kind:
          type: string
          enum:
            - missing_price
            - stale_price
            - missing_exchange_rate
            - stale_exchange_rate
        date:
          type: string
          format: date
          maxLength: 10
        accountId:
          type: string
          format: uuid
          maxLength: 36
        instrumentId:
          type: string
          format: uuid
          maxLength: 36
        currency:
          $ref: "#/components/schemas/Currency"
        observedAt:
          type: string
          format: date
          maxLength: 10
    HouseholdWorkspace:
      type: object
      additionalProperties: false
      required:
        - householdId
        - revision
        - role
        - accounts
        - accountDetails
        - netWorthData
        - contributionData
        - assetAllocation
        - assetAllocationHistory
        - transfers
        - recurringFlows
        - plannedExpenditures
        - incomeHistory
        - flowSankeyData
        - financialIndependence
        - portfolioReturn
        - inflation
        - netWorthTarget
        - netWorthTargetIsReal
        - withdrawalRate
        - baseCurrency
        - valuationMaxAgeDays
        - valuationDate
        - valuationIssues
      properties:
        householdId:
          type: string
          format: uuid
          maxLength: 36
        revision:
          type: integer
          minimum: 0
          format: int64
          maximum: 9007199254740991
        role:
          type: string
          enum:
            - owner
            - editor
            - viewer
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
          maxItems: 10000
        accountDetails:
          type: array
          items:
            $ref: "#/components/schemas/AccountDetail"
          maxItems: 10000
        netWorthData:
          type: array
          items:
            $ref: "#/components/schemas/DatedSeriesPoint"
          maxItems: 10000
        contributionData:
          type: array
          items:
            $ref: "#/components/schemas/DatedSeriesPoint"
          maxItems: 10000
        assetAllocation:
          type: array
          items:
            type: object
            required:
              - assetType
              - total
            properties:
              assetType:
                $ref: "#/components/schemas/AssetType"
              total:
                type: number
          maxItems: 10000
        assetAllocationHistory:
          type: array
          items:
            $ref: "#/components/schemas/DatedSeriesPoint"
          maxItems: 10000
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"
          maxItems: 10000
        recurringFlows:
          type: array
          items:
            $ref: "#/components/schemas/RecurringFlow"
          maxItems: 10000
        plannedExpenditures:
          type: array
          items:
            $ref: "#/components/schemas/PlannedExpenditure"
          maxItems: 10000
        incomeHistory:
          type: array
          items:
            $ref: "#/components/schemas/IncomeRecord"
          maxItems: 10000
        flowSankeyData:
          type: object
          description: Sankey nodes and links in the household base currency.
          additionalProperties: true
        financialIndependence:
          type: object
          description: Reconciliation, runway, target, and projection read model.
          additionalProperties: true
        portfolioReturn:
          type:
            - number
            - "null"
        inflation:
          type: number
        netWorthTarget:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        netWorthTargetIsReal:
          type: boolean
        withdrawalRate:
          type: number
        baseCurrency:
          $ref: "#/components/schemas/Currency"
        valuationMaxAgeDays:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        valuationDate:
          type:
            - string
            - "null"
          format: date
          maxLength: 10
        valuationIssues:
          type: array
          items:
            $ref: "#/components/schemas/ValuationIssue"
          maxItems: 10000
    MutationResult:
      type: object
      additionalProperties: false
      required:
        - revision
        - workspace
      properties:
        revision:
          type: integer
          minimum: 1
          format: int64
          maximum: 9007199254740991
        workspace:
          $ref: "#/components/schemas/HouseholdWorkspace"
    LocalJsonImportRequest:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - sourceSha256
        - data
      properties:
        schemaVersion:
          type: integer
          const: 1
          format: int64
          minimum: 0
          maximum: 9007199254740991
        sourceSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          maxLength: 500
        data:
          type: object
          description: An AssetTrackerData v1 document validated by the importer.
          additionalProperties: true
    LocalJsonImportValidation:
      type: object
      additionalProperties: false
      required:
        - importId
        - sourceSha256
        - expiresAt
        - counts
        - defaultsApplied
        - warnings
      properties:
        importId:
          type: string
          format: uuid
          maxLength: 36
        sourceSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          maxLength: 500
        expiresAt:
          type: string
          format: date-time
          maxLength: 500
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            format: int64
            maximum: 9007199254740991
        defaultsApplied:
          type: array
          items:
            type: string
            maxLength: 500
          maxItems: 10000
        warnings:
          type: array
          items:
            type: string
            maxLength: 500
          maxItems: 10000
