        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Apply one atomic account-history import
  /api/v1/households/{householdId}/income-history:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    put:
      operationId: replaceIncomeHistory
      x-browser-commands:
        - importIncomeHistory
      summary: Replace the complete income history atomically
      tags:
        - Facts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportIncomeHistoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Replace the complete income history atomically
    delete:
      operationId: clearIncomeHistory
      x-browser-commands:
        - clearIncomeHistory
      summary: Void the complete income history
      tags:
        - Facts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Void the complete income history
  /api/v1/households/{householdId}/recurring-flows:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: addRecurringFlow
      x-browser-commands:
        - addRecurringFlow
      summary: Add a recurring-flow plan
      tags:
        - Plans
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringFlowRequest"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Add a recurring-flow plan
  /api/v1/households/{householdId}/recurring-flows/{flowId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/FlowId"
    delete:
      operationId: deleteRecurringFlow
      x-browser-commands:
        - deleteRecurringFlow
      summary: Delete a recurring-flow plan by appending a tombstone version
      tags:
        - Plans
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Delete a recurring-flow plan by appending a tombstone version
  /api/v1/households/{householdId}/recurring-flows/{flowId}/materializations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/FlowId"
    post:
      operationId: materializeRecurringFlow
      x-browser-commands:
        - materializeFlow
      summary: Record due occurrences from one recurring flow
      tags:
        - Plans
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - throughDate
              properties:
                throughDate:
                  type: string
                  format: date
                  maxLength: 10
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Record due occurrences from one recurring flow
  /api/v1/households/{householdId}/planned-expenditures:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: addPlannedExpenditure
      x-browser-commands:
        - addPlannedExpenditure
      summary: Add a planned expenditure
      tags:
        - Plans
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannedExpenditureRequest"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Add a planned expenditure
  /api/v1/households/{householdId}/planned-expenditures/{expenditureId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ExpenditureId"
    delete:
      operationId: deletePlannedExpenditure
      x-browser-commands:
        - deletePlannedExpenditure
      summary: Delete a planned expenditure by appending a tombstone version
      tags:
        - Plans
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Delete a planned expenditure by appending a tombstone version
  /api/v1/households/{householdId}/accounts/{accountId}/expected-returns/{effectiveFrom}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
      - name: effectiveFrom
        in: path
        required: true
        description: First date on which the rate applies
        schema:
          type: string
          format: date
          maxLength: 10
    put:
      operationId: setExpectedReturn
      x-browser-commands:
        - setExpectedReturn
      summary: Set an account's expected return from a date
      tags:
        - Plans
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - rate
              properties:
                rate:
                  type: number
                  exclusiveMinimum: -1
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Set an account's expected return from a date
  /api/v1/households/{householdId}/settings:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    patch:
      operationId: updateHouseholdSettings
      x-browser-commands:
        - setBaseCurrency
        - setInflation
        - setNetWorthTarget
        - setWithdrawalRate
      summary: Change one or more household planning settings
      tags:
        - Plans
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
