openapi: 3.1.0
info:
  title: Asset Tracker shared household API
  version: 1.0.0
  contact:
    name: Robbie Palmer
    url: https://robbiepalmer.me
  description: Version 1 contract for authenticated household financial data. Financial writes require
    an idempotency key and the household revision last seen by the client.
servers:
  - url: https://finance.robbiepalmer.me
    description: Production
    x-internal: false
security:
  - sessionCookie: []
tags:
  - name: Households
  - name: Accounts
  - name: Facts
  - name: Plans
  - name: Migration
paths:
  /api/v1/households:
    get:
      operationId: listHouseholds
      summary: List the caller's household memberships
      tags:
        - Households
      responses:
        "200":
          description: Active household memberships
          content:
            application/json:
              schema:
                type: object
                required:
                  - households
                properties:
                  households:
                    type: array
                    items:
                      $ref: "#/components/schemas/HouseholdMembership"
                    maxItems: 10000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
      description: List the caller's household memberships
  /api/v1/households/{householdId}/workspace:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: getHouseholdWorkspace
      x-browser-commands:
        - load
      summary: Load the complete Asset Tracker browser read model
      tags:
        - Households
      responses:
        "200":
          description: Current household workspace
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdWorkspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Load the complete Asset Tracker browser read model
  /api/v1/households/{householdId}/accounts:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: createAccount
      x-browser-commands:
        - createAccount
      summary: Create a financial account
      tags:
        - Accounts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Create a financial account
  /api/v1/households/{householdId}/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getAccount
      summary: Load one account detail read model
      tags:
        - Accounts
      responses:
        "200":
          description: Account detail at the current household revision
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Load one account detail read model
    patch:
      operationId: updateAccount
      x-browser-commands:
        - closeAccount
        - setAccountLiquidity
      summary: Close an account or change its liquidity
      tags:
        - Accounts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Close an account or change its liquidity
  /api/v1/households/{householdId}/accounts/{accountId}/balance-snapshots/{date}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/Date"
    put:
      operationId: recordBalance
      x-browser-commands:
        - recordBalance
      summary: Record or correct an account balance
      tags:
        - Facts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBalanceRequest"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Record or correct an account balance
    delete:
      operationId: deleteBalanceSnapshot
      x-browser-commands:
        - deleteSnapshot
      summary: Void an account balance observation
      tags:
        - Facts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/MutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/StaleRevision"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      description: Void an account balance observation
  /api/v1/households/{householdId}/accounts/{accountId}/history/{historyKind}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/HistoryKind"
    delete:
      operationId: clearAccountHistory
      x-browser-commands:
        - clearAccountHistory
