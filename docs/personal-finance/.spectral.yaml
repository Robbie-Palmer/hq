extends:
  - "../../api-governance/spectral.yaml"

functionsDir: "../../api-governance/spectral-functions"
functions:
  - noVerbPaths
  - pluralCollections

rules:
  paths-no-verbs:
    description: Asset Tracker paths model resources rather than commands.
    severity: error
    given: "$.paths[*]~"
    then:
      function: noVerbPaths
      functionOptions:
        allowedSegments: []

  collections-are-plural:
    description: Asset Tracker collection paths use plural nouns.
    severity: warn
    given: "$.paths[*]~"
    then:
      function: pluralCollections
      functionOptions:
        singletons:
          - financial-data
          - history
          - income-history
          - settings
          - workspace
