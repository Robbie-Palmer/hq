---
- name: Verify common fleet health
  hosts: all
  gather_facts: false
  serial: 1
  tasks:
    - name: Check Tailscale connectivity
      ansible.builtin.raw: tailscale status --json >/dev/null
      check_mode: false
      changed_when: false
      failed_when: false
      register: tailscale_status

    - name: Report Tailscale health
      ansible.builtin.debug:
        msg: "Tailscale: {{ 'OK' if tailscale_status.rc == 0 else 'FAILED' }}"

    - name: Record Tailscale health
      ansible.builtin.set_fact:
        tailscale_healthy: "{{ tailscale_status.rc == 0 }}"

- name: Verify both DNS resolvers
  hosts: dns_resolvers
  gather_facts: false
  serial: 1
  tasks:
    - name: Query the local resolver
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../scripts/dns_probe.py
          --name {{ dns_probe_name }}
        executable: python3
      check_mode: false
      changed_when: false
      failed_when: false
      register: dns_query

    - name: Report DNS health
      ansible.builtin.debug:
        msg: >-
          DNS resolver: {{ 'OK' if dns_query.rc == 0 and dns_query.stdout_lines | length > 0 else 'FAILED' }}

    - name: Record DNS health
      ansible.builtin.set_fact:
        dns_healthy: "{{ dns_query.rc == 0 and dns_query.stdout_lines | length > 0 }}"

- name: Verify Raspberry Pi host services
  hosts: raspberry-pi
  gather_facts: false
  tasks:
    - name: Query CUPS scheduler
      ansible.builtin.command:
        argv:
          - lpstat
          - -r
      check_mode: false
      changed_when: false
      failed_when: false
      register: cups_status

    - name: Query Netdata API
      ansible.builtin.uri:
        url: "{{ netdata_url }}"
        method: GET
        return_content: false
        status_code: 200
        timeout: 3
      check_mode: false
      failed_when: false
      register: pi_netdata_status

    - name: Report Raspberry Pi service health
      ansible.builtin.debug:
        msg:
          CUPS: "{{ 'OK' if cups_status.rc == 0 else 'FAILED' }}"
          Netdata: "{{ 'OK' if pi_netdata_status.status | default(0) == 200 else 'FAILED' }}"

    - name: Record Raspberry Pi service health
      ansible.builtin.set_fact:
        pi_services_healthy: >-
          {{ cups_status.rc == 0 and pi_netdata_status.status | default(0) == 200 }}

- name: Verify Mac mini services
  hosts: mac-mini
  gather_facts: true
  tasks:
    - name: Query Mac workload endpoints
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: GET
        return_content: false
        status_code: "{{ item.status_codes }}"
        timeout: 3
      check_mode: false
      changed_when: false
      failed_when: false
      loop: "{{ mac_http_checks }}"
      loop_control:
        label: "{{ item.name }}"
      register: mac_http_results

    - name: Report Mac workload health
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }}:
          {{ 'OK' if item.status | default(0) in item.item.status_codes else 'FAILED' }}
      loop: "{{ mac_http_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Initialize failed Mac workload list
      ansible.builtin.set_fact:
        mac_failed_http_checks: []

    - name: Record failed Mac workload endpoints
      ansible.builtin.set_fact:
        mac_failed_http_checks: "{{ mac_failed_http_checks + [item.item.name] }}"
      loop: "{{ mac_http_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.status | default(0) not in item.item.status_codes

    - name: Record Mac workload health
      ansible.builtin.set_fact:
        mac_workloads_healthy: "{{ mac_failed_http_checks | length == 0 }}"

    - name: Inspect the isolated Colima K3s profile
      ansible.builtin.command:
        argv:
          - colima
          - status
          - "{{ colima_k3s_profile }}"
      check_mode: false
      changed_when: false
      failed_when: false
      register: mac_colima_k3s_status

    - name: Inspect the home K3s node
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ colima_k3s_context }}"
          - get
          - nodes
          - --selector=node-role.kubernetes.io/control-plane
          - --output=json
      check_mode: false
      changed_when: false
      failed_when: false
      register: mac_k3s_nodes

    - name: Parse the home K3s node response
      ansible.builtin.set_fact:
        mac_k3s_node_items: "{{ (mac_k3s_nodes.stdout | from_json)['items'] }}"
      when: mac_k3s_nodes.rc == 0

    - name: Initialize Mac K3s health
      ansible.builtin.set_fact:
        mac_k3s_healthy: false

    - name: Record Mac K3s health
      ansible.builtin.set_fact:
        mac_k3s_healthy: >-
          {{
            (mac_k3s_node_items | length) == 1
            and mac_k3s_node_items[0].metadata.labels['homelab.dev/location']
              | default('') == colima_k3s_node_labels['homelab.dev/location']
            and mac_k3s_node_items[0].metadata.labels['homelab.dev/capability']
              | default('') == colima_k3s_node_labels['homelab.dev/capability']
            and (
              mac_k3s_node_items[0].status.conditions
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list
              | length
            ) == 1
          }}
      when:
        - mac_colima_k3s_status.rc == 0
        - mac_k3s_nodes.rc == 0

    - name: Report Mac K3s health
      ansible.builtin.debug:
        msg: "Isolated K3s server: {{ 'OK' if mac_k3s_healthy else 'FAILED' }}"

    - name: Check whether Ente verification is configured
      ansible.builtin.set_fact:
        ente_verification_configured: >-
          {{
            ente_export_launchd_label | length > 0
            and ente_export_mount_path | length > 0
            and ente_export_success_marker | length > 0
          }}

    - name: Inspect the Ente launchd job
      ansible.builtin.command:
        argv:
          - launchctl
          - print
          - "gui/{{ ansible_facts.user_uid }}/{{ ente_export_launchd_label }}"
      check_mode: false
      changed_when: false
      failed_when: false
      no_log: true
      register: ente_launchd_status
      when: ente_verification_configured

    - name: Inspect mounted volumes
      ansible.builtin.command:
        argv:
          - /sbin/mount
      check_mode: false
      changed_when: false
      failed_when: false
      no_log: true
      register: mac_mounts
      when: ente_verification_configured

    - name: Inspect the latest successful Ente export marker
      ansible.builtin.stat:
        path: "{{ ente_export_success_marker }}"
      no_log: true
      register: ente_success_marker
      when: ente_verification_configured

    - name: Report Ente export health
      ansible.builtin.debug:
        msg: >-
          Ente export:
          {% if not ente_verification_configured %}
          NOT CONFIGURED, run discovery and add the three local values
          {% elif ente_launchd_status.rc != 0 %}
          FAILED, launchd job is not loaded
          {% elif (' on ' ~ ente_export_mount_path ~ ' ') not in mac_mounts.stdout %}
          FAILED, destination volume is not mounted
          {% elif not ente_success_marker.stat.exists %}
          FAILED, success marker does not exist
          {% elif (ansible_facts.date_time.epoch | int - ente_success_marker.stat.mtime | int) > ente_export_max_age_hours * 3600 %}
          FAILED, latest success marker is stale
          {% else %}
          OK
          {% endif %}

    - name: Record Ente export health
      ansible.builtin.set_fact:
        ente_export_healthy: >-
          {{
            ente_verification_configured
            and ente_launchd_status.rc == 0
            and (' on ' ~ ente_export_mount_path ~ ' ') in mac_mounts.stdout
            and ente_success_marker.stat.exists
            and (ansible_facts.date_time.epoch | int - ente_success_marker.stat.mtime | int)
              <= ente_export_max_age_hours * 3600
          }}

    - name: Inspect the T3 worktree cleanup job
      ansible.builtin.command:
        argv:
          - launchctl
          - print
          - "gui/{{ ansible_facts.user_uid }}/{{ t3_worktree_cleanup_launchd_label }}"
      check_mode: false
      changed_when: false
      failed_when: false
      register: t3_worktree_cleanup_status

    - name: Report T3 worktree cleanup health
      ansible.builtin.debug:
        msg: >-
          T3 worktree cleanup:
          {{ 'OK' if t3_worktree_cleanup_status.rc == 0 else 'FAILED, launchd job is not loaded' }}

    - name: Record T3 worktree cleanup health
      ansible.builtin.set_fact:
        t3_worktree_cleanup_healthy: "{{ t3_worktree_cleanup_status.rc == 0 }}"

- name: Verify Asus GPU path
  hosts: asus-desktop
  gather_facts: false
  tasks:
    - name: Check Docker daemon
      ansible.builtin.raw: docker info >/dev/null 2>&1
      check_mode: false
      changed_when: false
      failed_when: false
      register: asus_docker_status

    - name: Check NVIDIA driver
      ansible.builtin.raw: nvidia-smi >/dev/null 2>&1
      check_mode: false
      changed_when: false
      failed_when: false
      register: asus_gpu_status

    - name: Report Asus GPU health
      ansible.builtin.debug:
        msg:
          Docker: "{{ 'OK' if asus_docker_status.rc == 0 else 'FAILED' }}"
          NVIDIA: "{{ 'OK' if asus_gpu_status.rc == 0 else 'FAILED' }}"

    - name: Record Asus GPU health
      ansible.builtin.set_fact:
        asus_gpu_healthy: "{{ asus_docker_status.rc == 0 and asus_gpu_status.rc == 0 }}"

- name: Require healthy fleet services
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require every fleet health check to pass
      ansible.builtin.assert:
        that:
          - hostvars['mac-mini'].tailscale_healthy | default(false)
          - hostvars['raspberry-pi'].tailscale_healthy | default(false)
          - hostvars['asus-desktop'].tailscale_healthy | default(false)
          - hostvars['mac-mini'].dns_healthy | default(false)
          - hostvars['raspberry-pi'].dns_healthy | default(false)
          - hostvars['raspberry-pi'].pi_services_healthy | default(false)
          - hostvars['mac-mini'].mac_workloads_healthy | default(false)
          - hostvars['mac-mini'].mac_k3s_healthy | default(false)
          - hostvars['mac-mini'].ente_export_healthy | default(false)
          - hostvars['mac-mini'].t3_worktree_cleanup_healthy | default(false)
          - hostvars['asus-desktop'].asus_gpu_healthy | default(false)
        fail_msg: One or more fleet health checks reported FAILED above.
