# Tasks for managing homelab services. Run with the //homelab: prefix,
# e.g. `mise run //homelab:status`. Must be run on the hosting machine.

[tools]
python = "3.12.14"
"aqua:abiosoft/colima" = "0.10.3"
"aqua:lima-vm/lima" = "2.2.0"
"pipx:ansible-core" = "2.21.4"
"pipx:ansible-lint" = "26.8.0"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.1"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"github:fluxcd/flux-schema" = "0.13.0"

# ---------------------------------------------------------------------------
# Ansible migration bridge
# ---------------------------------------------------------------------------

[tasks.ansible-inventory]
description = "Show the Ansible fleet inventory without connecting to hosts"
dir = "ansible"
run = "ansible-inventory --graph"

[tasks.ansible-syntax]
description = "Validate the Ansible inventory and playbooks"
dir = "ansible"
run = '''
ansible-inventory --list >/dev/null
for playbook in playbooks/*.yml; do
  ansible-playbook --syntax-check "$playbook"
done
'''

[tasks.ansible-lint]
description = "Lint the Ansible playbooks and roles"
dir = "ansible"
run = "ansible-lint playbooks roles"

[tasks.ansible-test]
description = "Test standalone Ansible helper scripts"
dir = "ansible"
run = "python3 -m unittest discover -s scripts -p 'test_*.py'"

[tasks.ansible-facts]
description = "Gather host facts and report missing fleet prerequisites"
dir = "ansible"
run = "ansible-playbook playbooks/facts.yml"

[tasks.ansible-discover-pi]
description = "Inventory Raspberry Pi packages, storage, boot mounts, and services"
dir = "ansible"
run = "ansible-playbook playbooks/discover-pi.yml"

[tasks.ansible-verify]
description = "Run the read-only fleet health report"
dir = "ansible"
run = "ansible-playbook playbooks/verify.yml"

[tasks.ansible-check-mac]
description = "Preview Ansible-managed Mac host changes"
dir = "ansible"
run = "ansible-playbook playbooks/configure-mac.yml --check --diff"

[tasks.ansible-configure-mac]
description = "Apply Mac host and isolated K3s pilot configuration"
dir = "ansible"
run = "ansible-playbook playbooks/configure-mac.yml --diff"

[tasks.ansible-verify-ente-fail-closed]
description = "Prove the Ente wrapper rejects an absent volume and enforces its runtime limit"
dir = "ansible"
run = "ansible-playbook playbooks/verify-ente-fail-closed.yml"

[tasks.doppler-check]
description = "Verify access to the homelab production secret config without printing values"
run = "doppler secrets --project homelab --config prd --only-names >/dev/null"

[tasks.bootstrap]
description = "Install dependencies and deploy the Jellyfin stack"
run = "bash hosts/mac-mini/jellyfin/scripts/bootstrap.sh"

[tasks.provision]
description = "Complete the Jellyfin wizard and create media libraries"
run = "bash hosts/mac-mini/jellyfin/scripts/provision.sh"

[tasks.status]
description = "Show the state of the Jellyfin stack"
dir = "hosts/mac-mini/jellyfin"
run = "docker compose ps"

[tasks.up]
description = "Create and start the Jellyfin stack"
dir = "hosts/mac-mini/jellyfin"
run = "docker compose up -d"

[tasks.down]
description = "Stop the Jellyfin stack"
dir = "hosts/mac-mini/jellyfin"
run = "docker compose down"

[tasks.restart]
description = "Restart the Jellyfin container"
dir = "hosts/mac-mini/jellyfin"
run = "docker compose restart"

[tasks.logs]
description = "Follow the Jellyfin logs"
dir = "hosts/mac-mini/jellyfin"
run = "docker compose logs -f --tail=100"

[tasks.pull]
description = "Pull the configured image and recreate the container"
dir = "hosts/mac-mini/jellyfin"
run = "docker compose up -d --pull always"

[tasks.probe]
description = "Smoke-test media files: real container/codecs, client compatibility, optional preview clip"
run = "bash hosts/mac-mini/jellyfin/scripts/probe.sh"

[tasks.verify]
description = "Check the Jellyfin health endpoint"
run = 'curl -fsS "http://localhost:${JELLYFIN_PORT:-8096}/health" && echo "Jellyfin is healthy"'

# ---------------------------------------------------------------------------
# SilverBullet
# ---------------------------------------------------------------------------

[tasks.sb-bootstrap]
description = "Install dependencies and deploy the SilverBullet stack"
run = "bash hosts/mac-mini/silverbullet/scripts/bootstrap.sh"

[tasks.sb-status]
description = "Show the state of the SilverBullet stack"
dir = "hosts/mac-mini/silverbullet"
run = "docker compose ps"

[tasks.sb-up]
description = "Create and start the SilverBullet stack"
dir = "hosts/mac-mini/silverbullet"
run = "docker compose up -d"

[tasks.sb-down]
description = "Stop the SilverBullet stack"
dir = "hosts/mac-mini/silverbullet"
run = "docker compose down"

[tasks.sb-restart]
description = "Restart the SilverBullet container"
dir = "hosts/mac-mini/silverbullet"
run = "docker compose restart"

[tasks.sb-logs]
description = "Follow the SilverBullet logs"
dir = "hosts/mac-mini/silverbullet"
run = "docker compose logs -f --tail=100"

[tasks.sb-pull]
description = "Pull the configured image and recreate the container"
dir = "hosts/mac-mini/silverbullet"
run = "docker compose up -d --pull always"

[tasks.sb-verify]
description = "Check the SilverBullet health endpoint"
run = 'curl -sS -o /dev/null "http://localhost:${SB_PORT:-3001}/" && echo "SilverBullet is healthy"'

# ---------------------------------------------------------------------------
# Basic Memory (host-level tool, no container)
# ---------------------------------------------------------------------------

[tasks.bm-bootstrap]
description = "Install uv, Basic Memory CLI, and register the knowledge project"
run = "bash hosts/mac-mini/basic-memory/scripts/bootstrap.sh"

[tasks.bm-status]
description = "Show Basic Memory sync status"
run = "PATH=\"$HOME/.local/bin:$PATH\" bm status"

[tasks.bm-reset]
description = "Rebuild the Basic Memory index from Markdown files"
run = "PATH=\"$HOME/.local/bin:$PATH\" bm reset"

# ---------------------------------------------------------------------------
# asus-desktop (NixOS GPU worker, deployed from the Mac mini)
# ---------------------------------------------------------------------------

[tasks.asus-deploy]
description = "Deploy and verify the current pushed NixOS revision with Ansible"
dir = "."
run = "ansible/scripts/deploy_asus.sh"

# ---------------------------------------------------------------------------
# remote-development NixOS host and K3s workload
# ---------------------------------------------------------------------------

[tasks.nix-flake-check]
description = "Check every Nix flake output"
run = "bash scripts/nix-command flake check"

[tasks.remote-build]
description = "Build the remote-development NixOS system"
run = "bash scripts/nix-command build --no-link .#nixosConfigurations.remote-development.config.system.build.toplevel"

[tasks.remote-volume-prepare]
description = "Encrypt the empty Hetzner data volume and verify its Doppler recovery key"
run = "bash scripts/prepare-remote-development-volume"

[tasks.remote-install]
description = "Install remote-development from scratch with nixos-anywhere"
run = "bash scripts/install-remote-development"

[tasks.remote-tailscale-enrol]
description = "Enroll remote-development with a one-use tagged Tailscale key from Doppler"
run = "bash scripts/enrol-remote-development-tailscale"

[tasks.remote-rebuild]
description = "Build and switch the remote-development NixOS configuration over the tailnet"
run = "bash scripts/rebuild-remote-development"

[tasks.remote-health]
description = "Verify the remote host, encrypted volume, Tailscale, K3s, and t3-code"
run = "bash scripts/remote-development-health"

[tasks.remote-kubeconfig]
description = "Fetch the remote cluster kubeconfig over Tailscale into a gitignored file"
run = "bash scripts/fetch-remote-development-kubeconfig"

[tasks.t3-image-build]
description = "Build the pinned t3-code runtime image"
run = '''
mise_version=$(tr -d '\r\n' < ../.github/actions/setup-mise/mise-version)
docker build \
  --platform linux/amd64 \
  --build-arg "MISE_VERSION=$mise_version" \
  --pull=false \
  --tag ghcr.io/robbie-palmer/t3-code:0.0.38-agent-tools-12 \
  images/t3-code
'''

[tasks.t3-image-check]
description = "Check agent CLI versions and start the t3-code image as its runtime UID"
run = "bash scripts/check-t3-image"

[tasks.t3-image-push]
description = "Push the checked t3-code image to GHCR"
run = "docker push ghcr.io/robbie-palmer/t3-code:0.0.38-agent-tools-12"

[tasks.t3-image-load-remote]
description = "Load the checked image into remote-development K3s over SSH"
run = "bash scripts/load-remote-development-image"

[tasks.k3s-render-home]
description = "Render the home t3-code overlay"
run = "kubectl kustomize k3s/overlays/home"

[tasks.k3s-render-remote]
description = "Render the remote-development t3-code overlay"
run = "kubectl kustomize k3s/overlays/remote-development"

[tasks.k3s-test-remote]
description = "Test rendered workspace structure, isolation controls, and Kubernetes schemas"
depends = ["//:install"]
run = '''
pnpm exec tsc --project tsconfig.json
pnpm exec tsx --test tests/remote-workspace-manifests.test.ts
'''

[tasks.k3s-dry-run-home]
description = "Server-side dry run of the home overlay after an exact context check"
run = '''
export KUBECONFIG="${HOME_KUBECONFIG:-$HOME/.kube/config}"
bash scripts/apply-kustomize-overlay \
  k3s/overlays/home \
  "${HOME_KUBE_CONTEXT:-colima-homelab-k3s}" \
  home \
  dry-run
'''

[tasks.k3s-dry-run-remote]
description = "Server-side dry run of the remote overlay after an exact context check"
run = '''
export KUBECONFIG="${REMOTE_DEVELOPMENT_KUBECONFIG:-$PWD/.kube/remote-development.yaml}"
bash scripts/apply-kustomize-overlay \
  k3s/overlays/remote-development \
  "${REMOTE_DEVELOPMENT_KUBE_CONTEXT:-remote-development}" \
  cloud \
  dry-run
'''

[tasks.k3s-deploy-home]
description = "Apply the home overlay after an exact context check"
run = '''
export KUBECONFIG="${HOME_KUBECONFIG:-$HOME/.kube/config}"
bash scripts/apply-kustomize-overlay \
  k3s/overlays/home \
  "${HOME_KUBE_CONTEXT:-colima-homelab-k3s}" \
  home \
  apply
'''

[tasks.k3s-deploy-remote]
description = "Apply the remote overlay after an exact context check"
run = '''
export KUBECONFIG="${REMOTE_DEVELOPMENT_KUBECONFIG:-$PWD/.kube/remote-development.yaml}"
bash scripts/apply-kustomize-overlay \
  k3s/overlays/remote-development \
  "${REMOTE_DEVELOPMENT_KUBE_CONTEXT:-remote-development}" \
  cloud \
  apply
'''

[tasks.doppler-operator-install-remote]
description = "Install the pinned Doppler operator and inject config-scoped tokens"
run = '''
export KUBECONFIG="${REMOTE_DEVELOPMENT_KUBECONFIG:-$PWD/.kube/remote-development.yaml}"
bash scripts/install-doppler-operator
'''

# ---------------------------------------------------------------------------
# Coding-agent Codex provider accounts
# ---------------------------------------------------------------------------

[tasks.codex-add-provider]
description = "Register a new Codex provider instance in t3-code and start its login"
run = "node scripts/codex-add-provider.mjs"

# ---------------------------------------------------------------------------
# Media automation (Prowlarr + Sonarr + Radarr + qBittorrent)
# ---------------------------------------------------------------------------

[tasks.media-bootstrap]
description = "Install dependencies and deploy the media automation stack"
run = "bash hosts/mac-mini/media-automation/scripts/bootstrap.sh"

[tasks.media-provision]
description = "Wire Prowlarr, Sonarr, Radarr, and qBittorrent together via their APIs"
run = "bash hosts/mac-mini/media-automation/scripts/provision.sh"

[tasks.media-status]
description = "Show the state of the media automation stack"
dir = "hosts/mac-mini/media-automation"
run = "docker compose ps"

[tasks.media-up]
description = "Create and start the media automation stack"
dir = "hosts/mac-mini/media-automation"
run = "docker compose up -d"

[tasks.media-down]
description = "Stop the media automation stack"
dir = "hosts/mac-mini/media-automation"
run = "docker compose down"

[tasks.media-restart]
description = "Restart the media automation containers"
dir = "hosts/mac-mini/media-automation"
run = "docker compose restart"

[tasks.media-logs]
description = "Follow the media automation logs"
dir = "hosts/mac-mini/media-automation"
run = "docker compose logs -f --tail=100"

[tasks.media-pull]
description = "Pull the configured images and recreate the containers"
dir = "hosts/mac-mini/media-automation"
run = "docker compose up -d --pull always"

[tasks.media-verify]
description = "Check the health of all four media automation services"
run = '''
set -u
failures=0
for service in "Prowlarr:${PROWLARR_PORT:-9696}" "Sonarr:${SONARR_PORT:-8989}" "Radarr:${RADARR_PORT:-7878}"; do
  name="${service%%:*}"; port="${service##*:}"
  if curl -fsS "http://localhost:${port}/ping" >/dev/null 2>&1; then
    echo "${name} is healthy"
  else
    echo "${name}: FAILED health check"
    failures=$((failures + 1))
  fi
done
if curl -sS -o /dev/null "http://localhost:${QBITTORRENT_PORT:-8080}/api/v2/app/version" 2>/dev/null; then
  echo "qBittorrent is healthy"
else
  echo "qBittorrent: FAILED health check"
  failures=$((failures + 1))
fi
[ "$failures" -eq 0 ] || exit 1
'''
