[app]
    name = remote_development
    metrics = remote_development.*
    private charts = no
    gaps when not collected = yes
    history = 3600

[operator_quota_bytes]
    name = operator_quota_bytes
    title = Operator workspace byte quotas
    family = operator
    context = remote_development.workspace.quota_bytes
    units = bytes
    priority = 91000
    type = line
    dimension = remote_development.operator.durable_bytes_used durable_used last 1 1
    dimension = remote_development.operator.durable_bytes_limit durable_limit last 1 1
    dimension = remote_development.operator.cache_bytes_used cache_used last 1 1
    dimension = remote_development.operator.cache_bytes_limit cache_limit last 1 1

[operator_quota_inodes]
    name = operator_quota_inodes
    title = Operator workspace inode quotas
    family = operator
    context = remote_development.workspace.quota_inodes
    units = inodes
    priority = 91001
    type = line
    dimension = remote_development.operator.durable_inodes_used durable_used last 1 1
    dimension = remote_development.operator.durable_inodes_limit durable_limit last 1 1
    dimension = remote_development.operator.cache_inodes_used cache_used last 1 1
    dimension = remote_development.operator.cache_inodes_limit cache_limit last 1 1

[operator_filesystems]
    name = operator_filesystems
    title = Host filesystem use
    family = operator
    context = remote_development.workspace.filesystems
    units = percent
    priority = 91002
    type = line
    dimension = remote_development.operator.root_used_percent root_bytes last 1 1
    dimension = remote_development.operator.data_used_percent data_bytes last 1 1
    dimension = remote_development.operator.root_inode_used_percent root_inodes last 1 1
    dimension = remote_development.operator.data_inode_used_percent data_inodes last 1 1

[operator_backup]
    name = operator_backup
    title = Operator workspace backup age
    family = operator
    context = remote_development.workspace.backup
    units = seconds
    priority = 91003
    type = line
    dimension = remote_development.operator.backup_age_seconds age last 1 1

[operator_services]
    name = operator_services
    title = Remote development service health
    family = operator
    context = remote_development.workspace.services
    units = state
    priority = 91004
    type = line
    dimension = remote_development.operator.backup_fresh backup_fresh last 1 1
    dimension = remote_development.operator.k3s_up k3s last 1 1
    dimension = remote_development.operator.agent_coordinator_enabled agent_coordinator_enabled last 1 1
    dimension = remote_development.operator.agent_coordinator_up agent_coordinator last 1 1
    dimension = remote_development.operator.agent_coordinator_admission_open agent_admission last 1 1
    dimension = remote_development.operator.kube_state_metrics_up kube_state_metrics last 1 1

[operator_kubernetes_state]
    name = operator_kubernetes_state
    title = Operator workspace Kubernetes failure state
    family = operator
    context = remote_development.workspace.kubernetes_state
    units = containers
    priority = 91005
    type = line
    dimension = remote_development.operator.oom_killed oom_killed last 1 1
    dimension = remote_development.operator.evicted evicted last 1 1
    dimension = remote_development.operator.crash_loop crash_loop last 1 1

[operator_pressure]
    name = operator_pressure
    title = Host pressure stall time
    family = operator
    context = remote_development.workspace.pressure
    units = percent
    priority = 91006
    type = line
    dimension = remote_development.operator.cpu_pressure_percent cpu last 1 1
    dimension = remote_development.operator.memory_pressure_percent memory last 1 1
    dimension = remote_development.operator.io_pressure_percent io last 1 1

[operator_agent_coordinator]
    name = operator_agent_coordinator
    title = Work Graph agent coordinator ownership
    family = operator
    context = remote_development.workspace.agent_coordinator
    units = tickets
    priority = 91007
    type = line
    dimension = remote_development.operator.agent_coordinator_tracked tracked last 1 1
    dimension = remote_development.operator.agent_coordinator_needs_attention needs_attention last 1 1
