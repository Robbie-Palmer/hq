 alarm: remote_development_durable_byte_quota
    on: remote_development.operator_quota_bytes
  calc: $durable_used * 100 / $durable_limit
 units: %
 every: 1m
  warn: $this > 85
  crit: $this > 95
 delay: down 5m
  info: workspace=operator failure=quota component=durable-bytes
    to: remote-development

 alarm: remote_development_cache_byte_quota
    on: remote_development.operator_quota_bytes
  calc: $cache_used * 100 / $cache_limit
 units: %
 every: 1m
  warn: $this > 85
  crit: $this > 95
 delay: down 5m
  info: workspace=operator failure=quota component=cache-bytes
    to: remote-development

 alarm: remote_development_durable_inode_quota
    on: remote_development.operator_quota_inodes
  calc: $durable_used * 100 / $durable_limit
 units: %
 every: 1m
  warn: $this > 85
  crit: $this > 95
 delay: down 5m
  info: workspace=operator failure=quota component=durable-inodes
    to: remote-development

 alarm: remote_development_cache_inode_quota
    on: remote_development.operator_quota_inodes
  calc: $cache_used * 100 / $cache_limit
 units: %
 every: 1m
  warn: $this > 85
  crit: $this > 95
 delay: down 5m
  info: workspace=operator failure=quota component=cache-inodes
    to: remote-development

 alarm: remote_development_filesystem_headroom
    on: remote_development.operator_filesystems
lookup: max -1m unaligned of root_bytes data_bytes root_inodes data_inodes
 units: %
 every: 1m
  warn: $this > 80
  crit: $this > 90
 delay: down 5m
  info: workspace=operator failure=filesystem-headroom component=host
    to: remote-development

 alarm: remote_development_backup_stale
    on: remote_development.operator_services
  calc: $backup_fresh
 every: 1m
  crit: $this == 0
 delay: down 10m
  info: workspace=operator failure=stale-backup component=restic
    to: remote-development

 alarm: remote_development_k3s_down
    on: remote_development.operator_services
  calc: $k3s
 every: 1m
  crit: $this == 0
 delay: down 2m
  info: workspace=operator failure=service-down component=k3s
    to: remote-development

 alarm: remote_development_kube_state_metrics_down
    on: remote_development.operator_services
  calc: $kube_state_metrics
 every: 1m
  crit: $this == 0
 delay: down 2m
  info: workspace=operator failure=service-down component=kube-state-metrics
    to: remote-development

 alarm: remote_development_oom_killed
    on: remote_development.operator_kubernetes_state
  calc: $oom_killed
 every: 1m
  crit: $this > 0
  info: workspace=operator failure=oom-killed component=workspace-container
    to: remote-development

 alarm: remote_development_evicted
    on: remote_development.operator_kubernetes_state
  calc: $evicted
 every: 1m
  crit: $this > 0
  info: workspace=operator failure=evicted component=workspace-pod
    to: remote-development

 alarm: remote_development_crash_loop
    on: remote_development.operator_kubernetes_state
  calc: $crash_loop
 every: 1m
  crit: $this > 0
 delay: down 2m
  info: workspace=operator failure=crash-loop component=workspace-container
    to: remote-development

 alarm: remote_development_memory_pressure
    on: remote_development.operator_pressure
  calc: $memory
 units: %
 every: 1m
  warn: $this > 10
  crit: $this > 25
 delay: up 5m down 5m
  info: workspace=operator failure=memory-pressure component=host
    to: remote-development

 alarm: remote_development_kernel_oom
    on: mem.oom_kill
   lookup: sum -1m unaligned
    units: kills
    every: 1m
     crit: $this > 0
     info: workspace=operator failure=kernel-oom component=host-kernel
       to: remote-development
