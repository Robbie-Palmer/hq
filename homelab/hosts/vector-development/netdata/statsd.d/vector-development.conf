[app]
    name = vector_development
    metrics = vector_development.*
    private charts = no
    gaps when not collected = yes
    history = 3600

[gpu_services]
    name = gpu_services
    title = Vector GPU service health
    family = gpu
    context = vector_development.gpu.services
    units = state
    priority = 92000
    type = line
    dimension = vector_development.gpu.plugin_up plugin last 1 1
    dimension = vector_development.gpu.metrics_up metrics last 1 1

[gpu_capacity]
    name = gpu_capacity
    title = Vector allocatable GPU capacity
    family = gpu
    context = vector_development.gpu.capacity
    units = GPUs
    priority = 92001
    type = line
    dimension = vector_development.gpu.allocatable allocatable last 1 1

[gpu_temperature]
    name = gpu_temperature
    title = Vector GPU temperature
    family = gpu
    context = vector_development.gpu.temperature
    units = Celsius
    priority = 92002
    type = line
    dimension = vector_development.gpu.temperature_c temperature last 1 1

[gpu_memory]
    name = gpu_memory
    title = Vector GPU framebuffer use
    family = gpu
    context = vector_development.gpu.memory
    units = MiB
    priority = 92003
    type = stacked
    dimension = vector_development.gpu.fb_used_mib used last 1 1
    dimension = vector_development.gpu.fb_free_mib free last 1 1

[gpu_memory_percent]
    name = gpu_memory_percent
    title = Vector GPU framebuffer utilization
    family = gpu
    context = vector_development.gpu.memory_percent
    units = percent
    priority = 92004
    type = line
    dimension = vector_development.gpu.fb_used_percent used last 1 1

[gpu_faults]
    name = gpu_faults
    title = Vector GPU fault and throttle state
    family = gpu
    context = vector_development.gpu.faults
    units = state
    priority = 92005
    type = line
    dimension = vector_development.gpu.xid_code xid_code last 1 1
    dimension = vector_development.gpu.thermal_throttle thermal_throttle last 1 1
    dimension = vector_development.gpu.power_brake power_brake last 1 1
    dimension = vector_development.gpu.power_cap power_cap last 1 1
