 alarm: vector_gpu_device_plugin_down
    on: vector_development.gpu_services
  calc: $plugin
 every: 15s
  crit: $this == 0
 delay: up 30s down 30s
  info: host=vector-development failure=device-plugin-down component=nvidia-device-plugin
    to: vector-development

 alarm: vector_gpu_metrics_down
    on: vector_development.gpu_services
  calc: $metrics
 every: 15s
  crit: $this == 0
 delay: up 30s down 30s
  info: host=vector-development failure=metrics-down component=dcgm-exporter
    to: vector-development

 alarm: vector_gpu_not_allocatable
    on: vector_development.gpu_capacity
  calc: $allocatable
 every: 15s
  crit: $this < 1
 delay: up 30s down 30s
  info: host=vector-development failure=capacity-missing component=kubelet
    to: vector-development

 alarm: vector_gpu_xid_error
    on: vector_development.gpu_faults
  calc: $xid_code
 every: 15s
  crit: $this > 0
  info: host=vector-development failure=xid-error component=gpu
    to: vector-development

 alarm: vector_gpu_thermal_throttle
    on: vector_development.gpu_faults
  calc: $thermal_throttle
 every: 15s
  warn: $this > 0
 delay: up 1m down 2m
  info: host=vector-development failure=thermal-throttle component=gpu
    to: vector-development

 alarm: vector_gpu_power_brake
    on: vector_development.gpu_faults
  calc: $power_brake
 every: 15s
  crit: $this > 0
 delay: up 30s down 2m
  info: host=vector-development failure=hardware-power-brake component=gpu
    to: vector-development

 alarm: vector_gpu_temperature
    on: vector_development.gpu_temperature
  calc: $temperature
 units: Celsius
 every: 15s
  warn: $this >= 82
  crit: $this >= 87
 delay: up 1m down 2m
  info: host=vector-development failure=temperature-high component=gpu
    to: vector-development

 alarm: vector_gpu_framebuffer_pressure
    on: vector_development.gpu_memory_percent
  calc: $used
 units: percent
 every: 15s
  warn: $this >= 90
  crit: $this >= 97
 delay: up 1m down 1m
  info: host=vector-development failure=framebuffer-pressure component=gpu
    to: vector-development
