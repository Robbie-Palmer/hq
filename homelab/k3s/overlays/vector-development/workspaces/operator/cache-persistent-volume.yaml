apiVersion: v1
kind: PersistentVolume
metadata:
  name: t3-code-vector-development-cache
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 250Gi
  local:
    path: /srv/vector-development/t3-code-cache
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: homelab.dev/location
              operator: In
              values:
                - home
            - key: homelab.dev/capability
              operator: In
              values:
                - agent-workspace
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vector-development
  persistentVolumeReclaimPolicy: Retain
  storageClassName: t3-code-cache-local
  volumeMode: Filesystem
