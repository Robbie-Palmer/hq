apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: t3-code-posthog-read
spec:
  tokenSecret:
    name: doppler-posthog-read-token
  managedSecret:
    name: t3-code-posthog-read
    namespace: t3-code
  project: personal-site
  config: dev_agent_observability
  secrets:
    - POSTHOG_PROJECT_ID
    - POSTHOG_QUERY_HOST
    - POSTHOG_PERSONAL_API_KEY
  resyncSeconds: 300
