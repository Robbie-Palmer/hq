apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: t3-code-work-graph
spec:
  tokenSecret:
    name: doppler-work-graph-token
  managedSecret:
    name: t3-code-work-graph
    namespace: t3-code
  project: work-graph
  config: prd_work_graph
  secrets:
    - WORK_GRAPH_API_URL
    - WORK_GRAPH_CF_ACCESS_ALLOWED_ORIGINS
    - CF_ACCESS_CLIENT_ID
    - CF_ACCESS_CLIENT_SECRET
  processors:
    CF_ACCESS_CLIENT_ID:
      type: plain
      asName: WORK_GRAPH_CF_ACCESS_CLIENT_ID
    CF_ACCESS_CLIENT_SECRET:
      type: plain
      asName: WORK_GRAPH_CF_ACCESS_CLIENT_SECRET
  resyncSeconds: 300
