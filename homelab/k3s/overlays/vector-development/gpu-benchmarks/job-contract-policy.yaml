apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vector-gpu-benchmark-job-contract
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - jobs
        scope: Namespaced
  matchConditions:
    - name: gpu-benchmarks-namespace
      expression: request.namespace == 'gpu-benchmarks'
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        object.metadata.labels['app.kubernetes.io/name'] == 'gpu-benchmark' &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 't3-code' &&
        object.metadata.labels['gpu-benchmark.homelab.dev/mode'] in ['benchmark', 'profile', 'smoke'] &&
        'gpu-benchmark.homelab.dev/run-id' in object.metadata.labels &&
        object.metadata.labels['gpu-benchmark.homelab.dev/run-id'].matches('^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$') &&
        object.metadata.name == 'gpu-' + object.metadata.labels['gpu-benchmark.homelab.dev/run-id'] &&
        (!has(object.metadata.generateName) || object.metadata.generateName == '') &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0)
      message: Benchmark Jobs must carry the managed benchmark identity and a bounded run ID.
    - expression: >-
        has(object.spec.template.metadata.labels) &&
        object.spec.template.metadata.labels['app.kubernetes.io/name'] == 'gpu-benchmark' &&
        object.spec.template.metadata.labels['app.kubernetes.io/managed-by'] == 't3-code' &&
        object.spec.template.metadata.labels['gpu-benchmark.homelab.dev/mode'] == object.metadata.labels['gpu-benchmark.homelab.dev/mode'] &&
        object.spec.template.metadata.labels['gpu-benchmark.homelab.dev/run-id'] == object.metadata.labels['gpu-benchmark.homelab.dev/run-id']
      message: Benchmark pod labels must preserve the Job run identity for DCGM attribution.
    - expression: >-
        has(object.spec.parallelism) && object.spec.parallelism == 1 &&
        has(object.spec.completions) && object.spec.completions == 1 &&
        has(object.spec.backoffLimit) && object.spec.backoffLimit == 0 &&
        has(object.spec.activeDeadlineSeconds) &&
        object.spec.activeDeadlineSeconds > 0 && object.spec.activeDeadlineSeconds <= 1800 &&
        has(object.spec.ttlSecondsAfterFinished) &&
        object.spec.ttlSecondsAfterFinished > 0 && object.spec.ttlSecondsAfterFinished <= 3600 &&
        (!has(object.spec.suspend) || object.spec.suspend == false) &&
        (!has(object.spec.manualSelector) || object.spec.manualSelector == false)
      message: Benchmark Jobs are single-run, fail-fast, limited to 30 minutes, and expire within one hour.
