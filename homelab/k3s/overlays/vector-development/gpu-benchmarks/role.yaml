apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-benchmark-launcher
  namespace: gpu-benchmarks
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
