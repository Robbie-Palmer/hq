apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-exporter-metrics
  namespace: gpu-telemetry
data:
  counters.csv: |
    DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency in MHz.
    DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency in MHz.
    DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature in C.
    DCGM_FI_DEV_POWER_USAGE, gauge, Power draw in W.
    DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption in mJ.
    DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total PCIe retries.
    DCGM_FI_DEV_CLOCK_THROTTLE_REASONS, gauge, Bitmap of active clock throttle reasons.
    DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization in percent.
    DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization in percent.
    DCGM_FI_DEV_ENC_UTIL, gauge, Encoder utilization in percent.
    DCGM_FI_DEV_DEC_UTIL, gauge, Decoder utilization in percent.
    DCGM_FI_DEV_XID_ERRORS, gauge, Last XID error encountered.
    DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free in MiB.
    DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used in MiB.
    DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved in MiB.
    DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Uncorrectable remapped rows.
    DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, Correctable remapped rows.
    DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, Whether row remapping has failed.
    DCGM_FI_DRIVER_VERSION, label, Driver version.
