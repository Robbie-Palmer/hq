apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dcgm-exporter
  namespace: gpu-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - port: 9400
          protocol: TCP
  egress: []
