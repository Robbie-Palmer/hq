apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-code
  namespace: t3-code
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  template:
    spec:
      initContainers:
        - name: prepare-data-directories
        - name: prepare-docker-data
          image: docker:29.8.0-dind-rootless@sha256:e17fa54c2ffd511d8407c746eec77f7814e6f74fe20caf822dad1870599984c0
          command:
            - /bin/sh
            - -eu
            - -c
            - chown 1000:1000 /home/rootless/.local/share/docker
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: docker-data
              mountPath: /home/rootless/.local/share/docker
      nodeSelector:
        homelab.dev/capability: agent-workspace
        homelab.dev/location: cloud
        homelab.dev/power-profile: always-on
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: t3-code
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
            - name: OPENCODE_CONFIG_CONTENT
              value: |
                {
                  "$schema": "https://opencode.ai/config.json",
                  "provider": {
                    "openrouter": {
                      "models": {
                        "z-ai/glm-5.3-flash": {
                          "name": "GLM 5.3 Flash"
                        }
                      }
                    }
                  }
                }
            - name: CF_ACCESS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: t3-code-preview-access
                  key: CF_ACCESS_CLIENT_ID
                  optional: false
            - name: CF_ACCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: t3-code-preview-access
                  key: CF_ACCESS_CLIENT_SECRET
                  optional: false
            - name: CLOUDFLARE_PAGES_HOST
              valueFrom:
                secretKeyRef:
                  name: t3-code-preview-access
                  key: CLOUDFLARE_PAGES_HOST
                  optional: false
            - name: WORK_GRAPH_API_URL
              valueFrom:
                secretKeyRef:
                  name: t3-code-work-graph
                  key: WORK_GRAPH_API_URL
                  optional: false
            - name: WORK_GRAPH_CF_ACCESS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: t3-code-work-graph
                  key: WORK_GRAPH_CF_ACCESS_ALLOWED_ORIGINS
                  optional: false
            - name: WORK_GRAPH_CF_ACCESS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: t3-code-work-graph
                  key: WORK_GRAPH_CF_ACCESS_CLIENT_ID
                  optional: false
            - name: WORK_GRAPH_CF_ACCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: t3-code-work-graph
                  key: WORK_GRAPH_CF_ACCESS_CLIENT_SECRET
                  optional: false
          envFrom:
            - secretRef:
                name: t3-code-runtime
                optional: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
        - name: docker
          image: docker:29.8.0-dind-rootless@sha256:e17fa54c2ffd511d8407c746eec77f7814e6f74fe20caf822dad1870599984c0
          env:
            - name: DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS
              value: -p 127.0.0.1:2375:2375/tcp
          args:
            - dockerd
            - --host=tcp://0.0.0.0:2375
            - --tls=false
          startupProbe:
            exec:
              command:
                - docker
                - --host=tcp://127.0.0.1:2375
                - info
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - docker
                - --host=tcp://127.0.0.1:2375
                - info
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - docker
                - --host=tcp://127.0.0.1:2375
                - info
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            privileged: true # NOSONAR -- Rootless DinD requires a privileged outer container.
            readOnlyRootFilesystem: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: docker-data
              mountPath: /home/rootless/.local/share/docker
      volumes:
        - name: docker-data
          emptyDir:
            sizeLimit: 10Gi
