apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: t3-code
resources:
  - ../../../../base/t3-code
  - doppler-secret.yaml
  - preview-agent-doppler-secret.yaml
  - work-graph-secret.yaml
  - persistent-volume.yaml
patches:
  - path: namespace-patch.yaml
  - path: deployment-patch.yaml
  - path: persistent-volume-claim-patch.yaml
  - path: service-patch.yaml
labels:
  - pairs:
      homelab.dev/environment: remote-development
    includeSelectors: false
    includeTemplates: true
