apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ../../base/media
  - persistent-volumes.yaml
  - proton-vpn-secret.yaml
  - programmable-vpn-settings.yaml
configMapGenerator:
  - name: qbittorrent-vpn-scripts
    files:
      - prepare-config.sh=scripts/prepare-config.sh
      - remove-wireguard-policy-rules.sh=scripts/remove-wireguard-policy-rules.sh
      - set-forwarded-port.sh=scripts/set-forwarded-port.sh
      - clear-forwarded-port.sh=scripts/clear-forwarded-port.sh
      - check-tunnel-ready.sh=scripts/check-tunnel-ready.sh
patches:
  - path: qbittorrent-gluetun-patch.yaml
labels:
  - pairs:
      homelab.dev/environment: home
    includeSelectors: false
    includeTemplates: true
