apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ../../base/media
  - persistent-volumes.yaml
  - proton-vpn-secret.yaml
  - programmable-vpn-settings.yaml
  - qbittorrent-vpn-scripts.yaml
patches:
  - path: qbittorrent-gluetun-patch.yaml
labels:
  - pairs:
      homelab.dev/environment: home
    includeSelectors: false
    includeTemplates: true
