# Host-path persistent volumes on the single storage-media node. The config
# paths live under the macOS host through the VM's /srv/homelab-media mount so
# app state survives VM rebuilds; the media and downloads paths come from the
# 10 TB disk exposed at /srv/expansion (ADR 020).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-jellyfin-config
spec:
  storageClassName: ""
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [homelab-k3s]
  hostPath:
    path: /srv/homelab-media/jellyfin
    type: Directory
---
