---
# Shared by Sonarr, Radarr, and qBittorrent on the same node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads
  namespace: media
spec:
  volumeName: media-downloads
  storageClassName: ""
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Ti
---
# Read-write for Sonarr and Radarr imports; Jellyfin mounts the same volume
# read-only through its own claim-backed PV.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: media
spec:
  volumeName: media-library
  storageClassName: ""
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 8Ti
