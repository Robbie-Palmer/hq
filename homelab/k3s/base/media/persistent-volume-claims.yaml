---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recyclarr-config
  namespace: media
spec:
  volumeName: media-recyclarr-config
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
