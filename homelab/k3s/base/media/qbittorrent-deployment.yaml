apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  # The host VPN gate raises this to one only while the default route uses a
  # tunnel. A fresh apply therefore cannot start torrent traffic first.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        homelab.dev/storage-media: "true"
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.3-libtorrentv1
          imagePullPolicy: IfNotPresent
          # Host and container ports must match: WEBUI_PORT sets qBittorrent's
          # in-container listen port from the same variable.
          env:
            - name: TZ
              value: UTC
            - name: PUID
              value: "501"
            - name: PGID
              value: "20"
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          ports:
            - name: webui
              containerPort: 8080
              protocol: TCP
            - name: bittorrent
              containerPort: 6881
              protocol: TCP
            - name: bittorrent-udp
              containerPort: 6881
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: webui
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: webui
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
