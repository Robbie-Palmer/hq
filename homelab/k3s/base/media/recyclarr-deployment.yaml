# Syncs TRaSH Guides quality profiles and custom formats into Sonarr and
# Radarr. Runs in cron mode (default @daily); see ADR 016. The official image
# publishes no latest tag, so the major version is pinned.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recyclarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recyclarr
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        homelab.dev/storage-media: "true"
      containers:
        - name: recyclarr
          image: ghcr.io/recyclarr/recyclarr:8.7.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsUser: 501
            runAsGroup: 20
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: recyclarr-config
        - name: tmp
          emptyDir: {}
