[tasks.test]
description = "Run tests for recipe-parsing"
run = "pnpm test"

[tasks.check]
description = "Typecheck and test the recipe-parsing pipeline"
depends = ["//:install"]
run = "pnpm typecheck && pnpm test"

[tasks."test:coverage"]
description = "Run recipe-parsing pipeline tests with LCOV coverage"
depends = ["//:install"]
run = "pnpm test:coverage"

[tasks.dvc]
description = "Run a DVC command with credentials from Doppler (e.g. mise run //ml-pipelines/recipe-parsing:dvc -- status)"
run = "bash ../scripts/doppler-pipeline-env.sh ../scripts/dvc.sh"

[tasks.pull]
description = "Pull recipe-parsing data and cached stage outputs from R2"
run = "bash ../scripts/doppler-pipeline-env.sh ../scripts/dvc.sh pull"

[tasks.push]
description = "Push the recipe-parsing DVC cache to its R2 prefix"
run = "bash ../scripts/doppler-pipeline-env.sh ../scripts/dvc.sh push"

[tasks.repro]
description = "Reproduce the recipe-parsing pipeline (LLM stages need OPENROUTER_API_KEY, injected from Doppler)"
run = "bash ../scripts/doppler-pipeline-env.sh ../scripts/dvc.sh repro"

[tasks.metrics]
description = "Show recipe-parsing metrics, or diff them against a revision"
run = "bash ../scripts/doppler-pipeline-env.sh ../scripts/dvc.sh metrics"

[tasks."url-import:validate"]
description = "Validate URL-import corpus schemas, manifests, rights, hashes, and partitions"
depends = ["//:install"]
run = "pnpm exec tsx src/stages/validate-url-import-corpus.ts"

[tasks."url-import:replay"]
description = "Replay train and development URL-import fixtures without touching holdout"
depends = ["//:install"]
run = "pnpm exec tsx src/stages/replay-url-import-corpus.ts"

[tasks."url-import:replay-holdout"]
description = "Run the sealed URL-import holdout for a recorded final evaluation"
depends = ["//:install"]
run = "pnpm exec tsx src/stages/replay-url-import-corpus.ts --partition holdout --purpose final-evaluation --output outputs/url-import-corpus-holdout.json"

[tasks."url-import:repro"]
description = "Reproduce the local URL-import validation and replay DVC stages"
depends = ["//:install"]
run = "bash scripts/repro-url-import.sh"
