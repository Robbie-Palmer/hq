stages:
  validate_url_import_corpus:
    cmd: pnpm exec tsx src/stages/validate-url-import-corpus.ts
    deps:
      - data/url-import-corpus/synthetic/v1
      - src/stages/cli-arguments.ts
      - src/stages/validate-url-import-corpus.ts
      - src/url-import-corpus/corpus.ts
      - src/url-import-corpus/schema.ts
    metrics:
      - outputs/url-import-synthetic-corpus-validation.json

  replay_url_import_corpus:
    cmd: pnpm exec tsx src/stages/replay-url-import-corpus.ts
    deps:
      - data/url-import-corpus/synthetic/v1/manifests/train.json
      - data/url-import-corpus/synthetic/v1/manifests/development.json
      - data/url-import-corpus/synthetic/v1/snapshots/train
      - data/url-import-corpus/synthetic/v1/snapshots/development
      - src/stages/cli-arguments.ts
      - src/stages/replay-url-import-corpus.ts
      - src/url-import-corpus/corpus.ts
      - src/url-import-corpus/replay.ts
      - src/url-import-corpus/schema.ts
      - ../../packages/recipe-parsing/src
      - ../../packages/recipe-parsing/package.json
      - ../../pnpm-lock.yaml
    metrics:
      - outputs/url-import-synthetic-corpus-replay.json

  prepare:
    cmd: pnpm exec tsx src/stages/prepare.ts
    deps:
      - data/ground-truth.json
      - data/recipe-images
      - src/stages/prepare.ts
      - ../../packages/recipe-parsing/src/schemas/ground-truth.ts
      - src/lib/io.ts
    outs:
      - outputs/prepared.json
      - outputs/image-entries.json

  dataset_stats:
    cmd: pnpm exec tsx src/stages/dataset-stats.ts
    deps:
      - outputs/prepared.json
      - data/recipe-images
      - src/stages/dataset-stats.ts
      - ../../packages/recipe-parsing/src/schemas/ground-truth.ts
      - src/lib/io.ts
    metrics:
      - outputs/dataset-stats.json
    plots:
      - outputs/images-per-recipe-histogram.json:
          template: bar_horizontal_sorted
          x: recipe_count
          y: image_count
          title: Recipes by image count
          x_label: Recipes
          y_label: Images per recipe
      - outputs/cuisine-distribution.json:
          template: bar_horizontal_sorted
          x: count
          y: cuisine
          title: Cuisine distribution
          x_label: Recipes
          y_label: Cuisine
      - outputs/top-ingredients.json:
          template: bar_horizontal_sorted
          x: count
          y: ingredient
          title: Top ingredients
          x_label: Mentions
          y_label: Ingredient

  extract:
    cmd: pnpm exec tsx src/stages/extract.ts
    params:
      - extract
    deps:
      - outputs/image-entries.json
      - data/recipe-images
      - src/stages/extract.ts
      - ../../packages/recipe-parsing/src/lib/openrouter.ts
      - src/lib/stage-runner.ts
      - ../../packages/recipe-parsing/src/lib/attempts.ts
      - ../../packages/recipe-parsing/src/lib/parse-retry.ts
      - src/lib/images.ts
      - src/lib/env.ts
      - src/lib/image-key.ts
      - ../../packages/recipe-parsing/src/schemas/ground-truth.ts
      - ../../packages/recipe-parsing/src/schemas/stage-artifacts.ts
      - ../../packages/recipe-parsing/src/schemas/parse-failures.ts
      - src/lib/io.ts
    outs:
      - outputs/extraction-predictions.json
      - outputs/extraction-failures.json

  normalize:
    cmd: pnpm exec tsx src/stages/normalize.ts
    params:
      - normalize
    deps:
      - outputs/extraction-predictions.json
      - src/stages/normalize.ts
      - ../../packages/recipe-parsing/src/lib/cooklang.ts
      - ../../packages/recipe-parsing/src/lib/recipe-postprocess.ts
      - ../../packages/recipe-parsing/src/lib/cuisine-normalization.ts
      - ../../packages/recipe-parsing/src/lib/ingredient-normalization-rules.ts
      - src/lib/stage-runner.ts
      - ../../packages/recipe-parsing/src/lib/attempts.ts
      - ../../packages/recipe-parsing/src/lib/parse-retry.ts
      - ../../packages/recipe-parsing/src/lib/openrouter.ts
      - src/lib/env.ts
      - src/lib/image-key.ts
      - ../../packages/recipe-parsing/src/schemas/ground-truth.ts
      - ../../packages/recipe-parsing/src/schemas/stage-artifacts.ts
      - ../../packages/recipe-parsing/src/schemas/parse-failures.ts
      - src/lib/io.ts
    outs:
      - outputs/predictions.json
      - outputs/cooklang-recipes.json
      - outputs/normalize-failures.json

  evaluate_extraction:
    cmd: pnpm exec tsx src/stages/evaluate-extraction.ts
    deps:
      - outputs/prepared.json
      - outputs/extraction-predictions.json
      - src/stages/evaluate-extraction.ts
      - src/evaluation/metrics.ts
      - src/lib/image-key.ts
      - ../../packages/recipe-parsing/src/lib/cooklang.ts
      - src/lib/extraction-text.ts
      - ../../packages/recipe-parsing/src/schemas/ground-truth.ts
      - ../../packages/recipe-parsing/src/schemas/stage-artifacts.ts
      - src/lib/io.ts
    outs:
      - outputs/extraction-metrics.json
      - outputs/extraction-per-image-scores.json

  evaluate_normalization:
    cmd: pnpm exec tsx src/stages/evaluate-normalization.ts
    deps:
      - outputs/prepared.json
      - outputs/predictions.json
      - src/stages/evaluate-normalization.ts
      - src/evaluation/metrics.ts
      - src/lib/image-key.ts
      - ../../packages/recipe-parsing/src/schemas/ground-truth.ts
      - src/lib/io.ts
    outs:
      - outputs/normalization-metrics.json
      - outputs/normalization-per-image-scores.json

  canonicalize:
    cmd: pnpm exec tsx src/stages/canonicalize.ts
    params:
      - canonicalize
    deps:
      - outputs/predictions.json
      - ../../packages/recipe-parsing/src/data/canonical-ingredients.json
      - ../../packages/recipe-parsing/src/data/canonical-equipment.json
      - ../../packages/recipe-parsing/src/lib/canonical-ingredients-data.ts
      - ../../packages/recipe-parsing/src/lib/canonical-equipment-data.ts
      - src/stages/canonicalize.ts
      - src/lib/canonicalization.ts
      - ../../packages/recipe-parsing/src/lib/slug-matching.ts
      - ../../packages/recipe-parsing/src/lib/ingredient-canonicalization.ts
      - ../../packages/recipe-parsing/src/lib/disambiguation.ts
      - ../../packages/recipe-parsing/src/lib/ingredient-normalization-rules.ts
      - ../../packages/recipe-parsing/src/lib/cuisine-normalization.ts
      - ../../packages/recipe-parsing/src/lib/equipment-canonicalization.ts
      - ../../packages/recipe-parsing/src/lib/openrouter.ts
      - src/lib/stage-runner.ts
      - ../../packages/recipe-parsing/src/lib/attempts.ts
      - src/lib/env.ts
      - src/lib/io.ts
      - ../../packages/recipe-parsing/src/schemas/ground-truth.ts
      - ../../packages/recipe-parsing/src/schemas/canonical-ingredients.ts
      - ../../packages/recipe-parsing/src/schemas/canonical-equipment.ts
    outs:
      - outputs/predictions-canonicalized.json
      - outputs/canonicalization-decisions.json

  evaluate:
    cmd: pnpm exec tsx src/stages/evaluate.ts
    deps:
      - outputs/prepared.json
      - outputs/predictions-canonicalized.json
      - src/stages/evaluate.ts
      - src/evaluation/metrics.ts
      - src/lib/image-key.ts
      - src/lib/io.ts
    metrics:
      - outputs/metrics.json
    plots:
      - outputs/per-entry-score-plot.json:
          template: bar_horizontal_sorted
          x: overall_score
          y: recipe_title
          title: Overall score by entry
          x_label: Overall score
          y_label: Entry
