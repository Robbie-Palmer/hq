[tools]
python = "3.12"

[env]
PYTHONDONTWRITEBYTECODE = "1"
UV_PYTHON = "3.12"

[tasks.sync]
description = "Install the locked slide-quality benchmark environment"
run = "uv sync --locked"

[tasks.lock]
description = "Update the slide-quality benchmark lockfile"
run = "uv lock"

[tasks.format]
description = "Format the slide-quality public-pilot code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint the slide-quality public-pilot code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check the slide-quality public-pilot code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks."test:coverage"]
description = "Test the slide-quality public-pilot code with coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml:coverage.xml"

[tasks.dvc]
description = "Run a DVC command in the slide-quality benchmark"
run = "bash ../scripts/dvc.sh"

[tasks.repro]
description = "Reproduce the deterministic slide-quality benchmark"
depends = ["sync"]
run = "bash ../scripts/dvc.sh repro write_benchmark_index"

[tasks.verify]
description = "Verify slide-quality contracts, leakage boundaries, and scorecards"
depends = ["sync", "repro"]
run = "uv run --locked pathologize-benchmark verify"

[tasks."pilot:run"]
description = "Run the bounded public slide-quality pilot"
depends = ["sync"]
run = "uv run --locked pathologize-slide-quality-pilot run"

[tasks."pilot:build-registry"]
description = "Build pinned registry and corpus manifests for the public pilot"
depends = ["sync"]
run = "uv run --locked python scripts/build_public_pilot_registry.py build"

[tasks."pilot:repro"]
description = "Reproduce the bounded public slide-quality pilot through DVC"
depends = ["sync"]
run = "bash ../scripts/dvc.sh repro run_public_pilot"

[tasks."pilot:verify"]
description = "Verify the committed public-pilot evidence and stop gates"
depends = ["sync"]
run = "uv run --locked pathologize-slide-quality-pilot verify"

[tasks.check]
description = "Check the slide-quality benchmark"
depends = ["lint", "typecheck", "test:coverage", "verify", "pilot:verify"]
