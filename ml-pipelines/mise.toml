[tools]
# DVC is not on the mise registry, and Homebrew's Python is externally managed,
# so uv provides it as an isolated tool.
uv = "0.12.22"

[env]
_.file = ".env"

[tasks.dvc]
description = "Run DVC in the current pipeline with credentials from Doppler (e.g. mise run //ml-pipelines:dvc -- status)"
dir = "{{cwd}}"
run = "bash {{config_root}}/scripts/doppler-pipeline-env.sh {{config_root}}/scripts/dvc.sh"

[tasks.dvc-lock]
description = "Update the locked DVC tool environment"
dir = "{{config_root}}/dvc-tool"
run = "uv lock"

[tasks."dvc-cache:status"]
description = "Report shared DVC cache use and participating active-worktree projects"
dir = "{{cwd}}"
run = "bash {{config_root}}/scripts/dvc-shared-cache.sh status"

[tasks."dvc-cache:prune"]
description = "Preview shared DVC cache pruning; pass --apply to delete unreferenced objects"
dir = "{{cwd}}"
run = "bash {{config_root}}/scripts/dvc-shared-cache.sh prune"

[tasks."dvc-cache:test"]
description = "Test shared DVC cache retention, pruning, locking, and cleanup"
dir = "{{config_root}}"
run = "bash scripts/dvc-shared-cache.test.sh"
