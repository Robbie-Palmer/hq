[tools]
python = "3.12"

[env]
PYTHONDONTWRITEBYTECODE = "1"

[tasks.sync]
description = "Install the locked Pathologize benchmark contract environment"
run = "uv sync --locked"

[tasks.lock]
description = "Update the Pathologize benchmark contract lockfile"
run = "uv lock"

[tasks.format]
description = "Format Pathologize benchmark contract Python code"
depends = ["sync"]
run = "uv run --locked ruff format ."

[tasks.lint]
description = "Lint Pathologize benchmark contract Python code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check Pathologize benchmark contract Python code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run Pathologize benchmark contract tests"
depends = ["sync"]
run = "uv run --locked pytest --no-cov"

[tasks."test:coverage"]
description = "Run Pathologize benchmark contract tests with Cobertura coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml:coverage.xml"

[tasks.schemas]
description = "Write Pathologize benchmark JSON Schemas"
depends = ["sync"]
run = "uv run --locked pathologize-benchmark schemas"

[tasks."schemas:check"]
description = "Check committed Pathologize benchmark schemas for drift"
depends = ["sync"]
run = "uv run --locked pathologize-benchmark schemas --check"

[tasks.check]
description = "Run all Pathologize benchmark contract checks"
depends = ["lint", "typecheck", "test:coverage", "schemas:check"]
