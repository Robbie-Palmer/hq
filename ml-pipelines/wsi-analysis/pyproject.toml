[project]
name = "wsi-analysis"
version = "0.1.0"
description = "Reproducible computational-pathology dataset tooling"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fire>=0.7.1",
    "openslide-bin>=4.0.0.11",
    "openslide-python>=1.4.3",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
wsi-analysis = "wsi_analysis.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cases>=3.10.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "ty>=0.0.75",
]

[tool.uv.sources]
# Remove when https://github.com/smarie/python-pytest-cases/pull/386 is released.
pytest-cases = { git = "https://github.com/smarie/python-pytest-cases.git", rev = "37c72c1350899d45bc80e92b4b4168b5f7a7af7c" }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=wsi_analysis --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["data"]

[tool.ty.rules]
all = "error"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
dynamic-function-decorator-return = "ignore"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "C90", "E", "F", "I", "N", "PERF", "PTH", "RUF", "S", "SIM", "T20", "TRY", "UP"]
ignore = [
    "T201", # stdout is the CLI's interface.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
