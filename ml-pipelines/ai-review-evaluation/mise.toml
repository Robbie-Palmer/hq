[tasks.extract]
description = "Extract a redacted, traceable Pull Request corpus from the cached AI review export"
run = "pnpm exec tsx src/extract-corpus.ts --input \"${AI_REVIEW_EVALUATION_EXPORT:-$HOME/.cache/ai-review/r2-export}\" --output data/corpus --params params.yaml"

[tasks."stage:extract"]
description = "Run the DVC dataset extraction stage"
run = "bash scripts/extract.sh"

[tasks."stage:freeze"]
description = "Run the DVC cohort freeze stage"
run = "bash scripts/freeze.sh"

[tasks."stage:replay"]
description = "Run the DVC controlled replay stage"
run = "bash scripts/replay.sh"

[tasks."stage:match"]
description = "Run the DVC finding matching stage"
run = "bash scripts/match.sh"

[tasks."stage:evaluate"]
description = "Run the DVC DuckDB evaluation stage"
run = "bash scripts/evaluate.sh"

[tasks.repro]
description = "Reproduce the AI reviewer corpus, replay plans or runs, and DuckDB evaluation"
run = "bash ../scripts/doppler-pipeline-env ../scripts/dvc repro"

[tasks.pull]
description = "Pull the versioned AI reviewer evaluation corpus and outputs from R2"
run = "bash ../scripts/doppler-pipeline-env ../scripts/dvc pull"

[tasks.push]
description = "Push the AI reviewer evaluation DVC cache to its R2 prefix"
run = "bash ../scripts/doppler-pipeline-env ../scripts/dvc push"

[tasks.dvc]
description = "Run a DVC command in the AI reviewer evaluation project"
run = "bash ../scripts/doppler-pipeline-env ../scripts/dvc"

[tasks.check]
description = "Check the AI reviewer evaluation pipeline and deterministic fixtures"
depends = ["//ai-review:install", "//packages/ai-review-domain:check"]
run = "pnpm exec tsc --noEmit && pnpm exec tsx --test tests/*.test.ts"

[tasks."test:coverage"]
description = "Run AI reviewer evaluation tests with LCOV coverage"
depends = ["//ai-review:install"]
run = "pnpm test:coverage"
