extends:
  - "../../api-governance/spectral.yaml"

functionsDir: "../../api-governance/spectral-functions"
functions:
  - noVerbPaths
  - pluralCollections

rules:
  # Tailnet ACLs and the private-address bind are this QA service's access control.
  # It has no public ingress and must not advertise an unenforced application scheme.
  owasp:api2:2023-read-restricted: off
  owasp:api2:2023-write-restricted: off

  paths-no-verbs:
    description: Annotation Workbench paths model resources rather than commands.
    severity: error
    given: "$.paths[*]~"
    then:
      function: noVerbPaths
      functionOptions:
        allowedSegments: []

  collections-are-plural:
    description: Annotation Workbench collection paths use plural nouns.
    severity: error
    given: "$.paths[*]~"
    then:
      function: pluralCollections
      functionOptions:
        singletons:
          - health
          - session
