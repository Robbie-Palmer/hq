[tasks.download]
description = "Download all catalogued recipe source datasets"
run = "bash scripts/download.sh"

[tasks.prepare]
description = "Normalize downloaded recipe datasets into one JSONL corpus"
run = "node src/stages/prepare.mjs"

[tasks.stats]
description = "Compute corpus quality and source metrics"
run = "node src/stages/stats.mjs"

[tasks."adapt-product"]
description = "Adapt extracted recipes to the current product recipe domain"
run = "pnpm exec tsx src/stages/adapt-product.mjs"

[tasks."canonicalize-product"]
description = "Map adapted ingredients and equipment to the product registries"
run = "pnpm exec tsx src/stages/canonicalize-product.mjs"

[tasks.repro]
description = "Reproduce the complete recipe dataset pipeline"
run = "bash ../scripts/doppler-pipeline-env ../scripts/dvc repro"

[tasks.pull]
description = "Pull recipe dataset data from R2"
run = "bash ../scripts/doppler-pipeline-env ../scripts/dvc pull"

[tasks.push]
description = "Push the recipe dataset DVC cache to its R2 prefix"
run = "bash scripts/push.sh"

[tasks.check]
description = "Check recipe dataset pipeline scripts"
depends = ["test"]
run = "bash -n scripts/download.sh scripts/push.sh && node --check src/lib/extracted-recipe.mjs && node --check src/lib/wprm.mjs && node --check src/stages/prepare.mjs && node --check src/stages/adapt-product.mjs && node --check src/stages/canonicalize-product.mjs && node --check src/stages/stats.mjs"

[tasks.test]
description = "Test the recipe dataset pipeline and its dependency contracts"
depends = ["//:install"]
run = "node --test tests/*.test.mjs"

[tasks."test:coverage"]
description = "Test recipe dataset parsing helpers with line and function coverage"
depends = ["//:install"]
run = "pnpm exec c8 --all --include='src/lib/*.mjs' --reporter=lcov --reporter=text --check-coverage --lines=80 --functions=80 node --test tests/*.test.mjs"
