stages:
  extract_dataset:
    cmd: bash scripts/extract.sh
    deps:
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/suggestions.ts
      - ../../pnpm-lock.yaml
      - corpus-manifest.json
      - package.json
      - scripts/extract.sh
      - src/files.ts
      - src/git-revisions.ts
      - src/schemas.ts
      - src/extract-dataset.ts
    outs:
      - data/corpus

  freeze_cohort:
    cmd: bash scripts/freeze.sh
    params:
      - cohort
    deps:
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/suggestions.ts
      - ../../pnpm-lock.yaml
      - data/corpus/manifest.json
      - package.json
      - scripts/freeze.sh
      - src/files.ts
      - src/schemas.ts
      - src/freeze-cohort.ts
    outs:
      - outputs/frozen/cohort.json

  prepare_gector_model:
    cmd: bash scripts/prepare-gector-model.sh
    deps:
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../pnpm-lock.yaml
      - model-manifest.json
      - package.json
      - scripts/prepare-gector-model.sh
      - src/files.ts
      - src/prepare-gector-model.ts
    outs:
      - data/models/gector-2024:
          persist: true

  prepare_punctuation_model:
    cmd: bash scripts/prepare-punctuation-model.sh
    deps:
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/suggestions.ts
      - ../../pnpm-lock.yaml
      - package.json
      - punctuation-model-manifest.json
      - scripts/prepare-punctuation-model.sh
      - src/files.ts
      - src/prepare-gector-model.ts
      - src/prepare-punctuation-model.ts
    outs:
      - data/models/punctuation-restoration-small:
          persist: true

  build_current_content_corpus:
