      - model-manifest.json
      - package.json
      - pyproject.toml
      - python/gector_runtime.py
      - scripts/run-current-content-gector.sh
      - src/files.ts
      - src/match-edits.ts
      - src/run-gector.ts
      - src/schemas.ts
      - uv.lock
    outs:
      - outputs/current-content/calibration/baseline

