    deps:
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../packages/writing-editor-domain/src/suggestions.ts
      - ../../pnpm-lock.yaml
      - ../../ui/content
      - current-content-params-strict.json
      - package.json
      - scripts/build-current-content-corpus.sh
      - src/build-current-content-corpus.ts
      - src/files.ts
      - src/schemas.ts
    outs:
      - data/current-content

  calibrate_current_content_gector_baseline:
