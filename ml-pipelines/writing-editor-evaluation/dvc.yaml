stages:
  extract_dataset:
    cmd: bash scripts/extract.sh
    deps:
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/suggestions.ts
      - ../../pnpm-lock.yaml
      - corpus-manifest.json
      - package.json
      - scripts/extract.sh
      - src/files.ts
      - src/git-revisions.ts
      - src/schemas.ts
      - src/extract-dataset.ts
    outs:
      - data/corpus

  freeze_cohort:
    cmd: bash scripts/freeze.sh
    params:
      - cohort
    deps:
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/suggestions.ts
      - ../../pnpm-lock.yaml
      - data/corpus/manifest.json
      - package.json
      - scripts/freeze.sh
      - src/files.ts
      - src/schemas.ts
      - src/freeze-cohort.ts
    outs:
      - outputs/frozen/cohort.json
      - outputs/frozen/readiness.json
      - outputs/frozen/readiness.md

  prepare_gector_model:
    cmd: bash scripts/prepare-gector-model.sh
    deps:
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../pnpm-lock.yaml
      - model-manifest.json
      - package.json
      - scripts/prepare-gector-model.sh
      - src/files.ts
      - src/prepare-gector-model.ts
    outs:
      - data/models/gector-2024:
          persist: true

  run_gector:
    cmd: bash scripts/run-gector.sh
    params:
      - producers.gector
      - matching.characterDiff.maxEditLength
    deps:
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../packages/writing-editor-domain/src/proposals.ts
      - ../../packages/writing-editor-domain/src/suggestions.ts
      - ../../pnpm-lock.yaml
      - data/corpus
      - data/models/gector-2024
      - model-manifest.json
      - package.json
      - pyproject.toml
      - python/gector_runtime.py
      - scripts/run-gector.sh
      - src/files.ts
      - src/match-edits.ts
      - src/run-gector.ts
      - src/schemas.ts
      - uv.lock
      - outputs/frozen/cohort.json
    outs:
      - outputs/producers/gector

  run_vale:
    cmd: bash scripts/run-vale.sh
    params:
      - producers.vale
    deps:
      - ../../.vale.ini
      - ../../.vale/styles/Unslop
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../packages/writing-editor-domain/src/findings.ts
      - ../../packages/writing-editor-domain/src/suggestions.ts
      - ../../pnpm-lock.yaml
      - data/corpus
      - outputs/frozen/cohort.json
      - package.json
      - scripts/run-vale.sh
      - src/files.ts
      - src/run-vale.ts
      - src/schemas.ts
    outs:
      - outputs/producers/vale.json

  match_edits:
    cmd: bash scripts/match-edits.sh
    params:
      - matching.characterDiff
    deps:
      - ../../packages/writing-editor-domain/package.json
      - ../../packages/writing-editor-domain/src/canonical-json.ts
      - ../../packages/writing-editor-domain/src/findings.ts
      - ../../packages/writing-editor-domain/src/suggestions.ts
      - ../../pnpm-lock.yaml
      - data/corpus
      - outputs/frozen/cohort.json
      - outputs/producers/vale.json
      - package.json
      - scripts/match-edits.sh
      - src/files.ts
      - src/match-edits.ts
      - src/schemas.ts
    outs:
      - outputs/matched/vale.json
