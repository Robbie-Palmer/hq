[tasks.install]
description = "Install writing editor evaluation dependencies"
depends = ["//:install"]

[tasks.extract]
description = "Extract the writing corpus from pinned Git revisions"
depends = ["install"]
run = "pnpm exec tsx src/extract-dataset.ts --manifest corpus-manifest.json --repository ../.. --output data/corpus"

[tasks.freeze]
description = "Freeze the writing evaluation cohort and readiness report"
depends = ["install"]
run = "pnpm exec tsx src/freeze-cohort.ts --dataset data/corpus/manifest.json --params params.yaml --output outputs/frozen"

[tasks."run:vale"]
description = "Run Vale against the frozen writing cohort"
depends = ["install"]
run = "bash scripts/run-vale.sh"

[tools]
python = "3.12.12"

[env]
CUBLAS_WORKSPACE_CONFIG = ":4096:8"

[tasks."runtime:sync"]
description = "Install the locked CUDA GECToR runtime"
run = "uv sync --locked --no-dev --no-build"

[tasks."runtime:lock"]
description = "Resolve the CUDA GECToR runtime lockfile"
run = "uv lock"

[tasks."runtime:check"]
description = "Lint and test the GECToR runtime"
depends = ["runtime:sync"]
run = ["uv run --locked ruff check python python-tests", "uv run --locked pytest"]

[tasks."runtime:smoke"]
description = "Run the locked GECToR model against a one-sentence fixture"
depends = ["runtime:sync"]
run = ".venv/bin/python python/gector_runtime.py --mode runtime-smoke"

[tasks."run:gector:smoke"]
description = "Run GECToR against one frozen ADR"
depends = ["install", "runtime:sync"]
run = "bash scripts/smoke-gector.sh"

[tasks."run:gector"]
description = "Run the DVC GECToR stage over the frozen cohort"
depends = ["install", "runtime:sync"]
run = "bash ../scripts/doppler-pipeline-env uv tool run --from 'dvc[s3]==3.67.1' dvc repro run_gector"

[tasks."model:prepare"]
description = "Download and verify the pinned GECToR-2024 checkpoint"
depends = ["install"]
run = "bash scripts/prepare-gector-model.sh"

[tasks."model:publish"]
description = "Prepare and push the pinned GECToR-2024 checkpoint to DVC"
depends = ["install"]
run = "bash scripts/publish-gector-model.sh"

[tasks."match:edits"]
description = "Align Vale findings with observed published edits"
depends = ["install"]
run = "bash scripts/match-edits.sh"

[tasks.repro]
description = "Reproduce the local writing evaluation stages through DVC"
depends = ["install"]
run = "bash ../scripts/doppler-pipeline-env uv tool run --from 'dvc[s3]==3.67.1' dvc repro"

[tasks.pull]
description = "Pull the writing evaluation corpus and outputs from R2"
run = "bash ../scripts/doppler-pipeline-env uv tool run --from 'dvc[s3]==3.67.1' dvc pull"

[tasks.push]
description = "Push the writing evaluation cache to its R2 prefix"
run = "bash ../scripts/doppler-pipeline-env uv tool run --from 'dvc[s3]==3.67.1' dvc push"

[tasks.dvc]
description = "Run a DVC command in the writing evaluation project"
run = "bash ../scripts/doppler-pipeline-env uv tool run --from 'dvc[s3]==3.67.1' dvc"

[tasks.typecheck]
description = "Typecheck the writing editor evaluation pipeline"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Test the writing editor evaluation pipeline"
depends = ["install"]
run = "pnpm test"

[tasks."test:coverage"]
description = "Test the writing editor evaluation pipeline with LCOV coverage"
depends = ["install"]
run = "pnpm test:coverage"

[tasks.check]
description = "Check the writing editor evaluation pipeline"
depends = ["typecheck", "test"]
