[project]
name = "financial-document-idp"
version = "0.1.0"
description = "Deterministic financial-document extraction evaluation pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fire>=0.7.1,<0.8",
    "pydantic>=2.12.5,<3",
]

[project.scripts]
financial-document-idp = "financial_document_idp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "ty>=0.0.75",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=financial_document_idp --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "ignore"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "C90", "E", "F", "I", "N", "PERF", "PTH", "RUF", "S", "SIM", "T20", "TRY", "UP"]
ignore = [
    "ANN401", # JSON serialization and artifact traversal operate on heterogeneous values.
    "T201",   # stdout is the CLI verification result.
    "TRY003", # Validation errors need the failed contract in their Pydantic message.
    "TRY301", # Safety checks stay next to the file read they guard.
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
