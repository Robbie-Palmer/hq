stages:
  pin_data_artifacts:
    cmd: uv run --locked data-artifacts fingerprint data_artifacts
    deps:
      - ../../packages/data-artifacts/src/data_artifacts/__init__.py
      - ../../packages/data-artifacts/src/data_artifacts/cli.py
      - ../../packages/data-artifacts/src/data_artifacts/files.py
      - ../../packages/data-artifacts/src/data_artifacts/schemas.py
    outs:
      - outputs/data-artifacts-source.sha256

  pin_ml_evaluation:
    cmd: uv run --locked data-artifacts fingerprint ml_evaluation,data_artifacts
    deps:
      - outputs/data-artifacts-source.sha256
      - ../../packages/ml-evaluation/src/ml_evaluation/__init__.py
      - ../../packages/ml-evaluation/src/ml_evaluation/adapters.py
      - ../../packages/ml-evaluation/src/ml_evaluation/contracts.py
      - ../../packages/ml-evaluation/src/ml_evaluation/gates.py
    outs:
      - outputs/ml-evaluation-source.sha256

  generate_synthetic_fixtures:
    cmd: uv run --locked pathologize-benchmark generate-fixtures
    deps:
      - fixtures/spec.json
      - pyproject.toml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
      - uv.lock
    outs:
      - data/synthetic

  validate_contracts:
    cmd: uv run --locked pathologize-benchmark validate-contracts
    deps:
      - data/synthetic/manifest.json
      - experiments/tiling-magnification.json
      - params.yaml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    params:
      - benchmark_id
      - workstream
      - experiments
    outs:
      - outputs/contracts/validation.json

  run_baseline:
    cmd: uv run --locked pathologize-benchmark run-adapters
    deps:
      - data/synthetic
      - experiments/tiling-magnification.json
      - outputs/contracts/validation.json
      - pyproject.toml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
      - uv.lock
    outs:
      - outputs/runs

  prepare_mpp_experiment_inputs:
    cmd: uv run --locked pathologize-tiling-experiment prepare
    deps:
      - ../pathologize-data-registry/data/raw/cptac-coad-idc/v23/b117aabf-c225-432e-95af-8ee9247a1ad6
      - ../pathologize-data-registry/manifests/assets/cptac-coad-idc-v23-smallest-series.json
      - ../pathologize-data-registry/records/slides/cptac-coad-idc-09co003-0b1ee2c0.json
      - experiments/mpp-perturbation.json
      - ../../packages/pathologize-tiler/src/pathologize_tiler/__init__.py
      - ../../packages/pathologize-tiler/src/pathologize_tiler/tiling.py
      - pyproject.toml
      - src/pathologize_tiling_benchmark
      - uv.lock
    outs:
      - data/mpp-experiment

  run_mpp_perturbation_experiment:
    cmd: uv run --locked pathologize-tiling-experiment run
    deps:
      - ../pathologize-data-registry/data/raw/cptac-coad-idc/v23/b117aabf-c225-432e-95af-8ee9247a1ad6
      - ../pathologize-data-registry/manifests/assets/cptac-coad-idc-v23-smallest-series.json
      - ../pathologize-data-registry/records/slides/cptac-coad-idc-09co003-0b1ee2c0.json
      - data/mpp-experiment
      - experiments/mpp-perturbation.json
      - ../../packages/pathologize-tiler/src/pathologize_tiler/__init__.py
      - ../../packages/pathologize-tiler/src/pathologize_tiler/tiling.py
      - pyproject.toml
      - src/pathologize_tiling_benchmark
      - uv.lock
    outs:
      - outputs/perturbations/mpp-experiment.json
      - outputs/perturbations/tiles

  verify_mpp_perturbation_experiment:
    cmd: uv run --locked pathologize-tiling-experiment verify --write-report
    deps:
      - ../pathologize-data-registry/data/raw/cptac-coad-idc/v23/b117aabf-c225-432e-95af-8ee9247a1ad6
      - ../pathologize-data-registry/manifests/assets/cptac-coad-idc-v23-smallest-series.json
      - ../pathologize-data-registry/records/slides/cptac-coad-idc-09co003-0b1ee2c0.json
      - data/mpp-experiment
      - experiments/mpp-perturbation.json
      - outputs/perturbations/mpp-experiment.json
      - outputs/perturbations/tiles
      - ../../packages/pathologize-tiler/src/pathologize_tiler/__init__.py
      - ../../packages/pathologize-tiler/src/pathologize_tiler/tiling.py
      - src/pathologize_tiling_benchmark
    outs:
      - outputs/perturbations/verification.json

  evaluate_tiling_magnification:
    cmd: uv run --locked pathologize-benchmark eval-only
    deps:
      - data/synthetic
      - experiments/tiling-magnification.json
      - outputs/runs/tiling-magnification-contract-v1/deterministic-color-v1/failures.json
      - outputs/runs/tiling-magnification-contract-v1/deterministic-color-v1/predictions.jsonl
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    outs:
      - outputs/evaluations/tiling-magnification-contract-v1/deterministic-color-v1.json
    metrics:
      - outputs/evaluations/tiling-magnification-contract-v1/metrics.json

  compare_tiling_magnification:
    cmd: uv run --locked pathologize-benchmark compare-only
    deps:
      - experiments/tiling-magnification.json
      - outputs/evaluations/tiling-magnification-contract-v1/deterministic-color-v1.json
      - outputs/runs/tiling-magnification-contract-v1/deterministic-color-v1/run-record.json
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    outs:
      - outputs/scorecards/tiling-magnification-contract-v1.json

  write_benchmark_index:
    cmd: uv run --locked pathologize-benchmark aggregate
    deps:
      - experiments/tiling-magnification.json
      - outputs/scorecards/tiling-magnification-contract-v1.json
      - params.yaml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    outs:
      - outputs/benchmark/index.json
