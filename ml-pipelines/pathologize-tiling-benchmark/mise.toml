[tools]
python = "3.12"

[env]
PYTHONDONTWRITEBYTECODE = "1"
UV_PYTHON = "3.12"

[tasks.sync]
description = "Install the locked tiling benchmark environment"
run = "uv sync --locked"

[tasks.lock]
description = "Update the tiling benchmark lockfile"
run = "uv lock"

[tasks.format]
description = "Format the tiling perturbation experiment"
run = "uv run --locked ruff format src tests"

[tasks.lint]
description = "Lint the tiling perturbation experiment"
depends = ["sync"]
run = "uv run --locked ruff format --check src tests && uv run --locked ruff check src tests"

[tasks.typecheck]
description = "Type-check the tiling perturbation experiment"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Test the tiling perturbation experiment"
depends = ["sync", "//ml-pipelines/pathologize-data-registry:acquire"]
run = "uv run --locked pytest"

[tasks."test:coverage"]
description = "Test the tiling perturbation experiment with coverage"
depends = ["sync", "//ml-pipelines/pathologize-data-registry:acquire"]
run = "uv run --locked pytest --cov-report=term-missing --cov-report=xml:coverage.xml"

[tasks.dvc]
description = "Run a DVC command in the tiling benchmark"
run = "bash ../scripts/dvc.sh"

[tasks.repro]
description = "Reproduce the public-data tiling experiment"
depends = ["sync", "//ml-pipelines/pathologize-data-registry:acquire"]
run = "bash ../scripts/dvc.sh repro"

[tasks.verify]
description = "Verify tiling contracts, leakage boundaries, and scorecards"
depends = ["sync", "repro"]
run = "uv run --locked pathologize-benchmark verify && uv run --locked pathologize-tiling-experiment verify"

[tasks.check]
description = "Check the tiling benchmark"
depends = ["lint", "typecheck", "test:coverage", "verify"]

[tasks."model-loader:sync"]
description = "Install the locked CUDA model-loader benchmark environment"
run = "uv sync --locked --extra cuda --extra model"

[tasks."model-loader:run"]
description = "Run the CUDA model-loader benchmark against the public DICOM fixture"
depends = ["model-loader:sync", "//ml-pipelines/pathologize-data-registry:acquire"]
run = "bash scripts/run-model-loader-benchmark.sh"
