[project]
name = "pathologize-tiling-benchmark"
version = "0.1.0"
description = "Public-data tiling and physical-scale experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fire>=0.7.1,<0.8",
    "numpy>=2.3.5,<3",
    "openslide-python>=1.4.3",
    "pathologize-benchmark-contracts",
    "pathologize-tiler",
    "pydantic>=2.12.5,<3",
]

[project.scripts]
pathologize-tiling-experiment = "pathologize_tiling_benchmark.cli:main"
pathologize-gpu-decode-benchmark = "pathologize_tiling_benchmark.gpu_cli:main"
pathologize-fixture-matrix = "pathologize_tiling_benchmark.fixture_matrix:main"

[project.optional-dependencies]
cuda = [
    "nvidia-nvimgcodec-cu12[nvjpeg,nvjpeg2k]>=0.10.0.9,<0.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "ty>=0.0.75",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
data-artifacts = { path = "../../packages/data-artifacts", editable = true }
ml-evaluation = { path = "../../packages/ml-evaluation", editable = true }
pathologize-benchmark-contracts = { path = "../pathologize-benchmark-contracts", editable = true }
pathologize-tiler = { path = "../../packages/pathologize-tiler", editable = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=pathologize_tiling_benchmark --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
# The CUDA runtime path is exercised in the digest-pinned Vector Job. CPU CI
# covers its validation, coordinate planning, summaries, and CLI boundary.
omit = ["src/pathologize_tiling_benchmark/gpu_benchmark.py"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["data", "outputs"]

[tool.ty.rules]
all = "error"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "ignore"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "C90", "E", "F", "I", "N", "PERF", "PTH", "RUF", "S", "SIM", "T20", "TRY", "UP"]
ignore = [
    "T201",   # stdout is the CLI interface.
    "TRY003", # Experiment failures name the violated case contract.
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/pathologize_tiling_benchmark/gpu_benchmark.py" = [
    "ANN401", # CuPy and nvImageCodec expose dynamic CUDA array types.
]
