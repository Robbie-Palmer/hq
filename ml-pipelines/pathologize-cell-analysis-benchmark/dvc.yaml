stages:
  pin_data_artifacts:
    cmd: uv run --locked data-artifacts fingerprint data_artifacts
    deps:
      - ../../packages/data-artifacts/src/data_artifacts/__init__.py
      - ../../packages/data-artifacts/src/data_artifacts/cli.py
      - ../../packages/data-artifacts/src/data_artifacts/files.py
      - ../../packages/data-artifacts/src/data_artifacts/schemas.py
    outs:
      - outputs/data-artifacts-source.sha256

  pin_ml_evaluation:
    cmd: uv run --locked data-artifacts fingerprint ml_evaluation,data_artifacts
    deps:
      - outputs/data-artifacts-source.sha256
      - ../../packages/ml-evaluation/src/ml_evaluation/__init__.py
      - ../../packages/ml-evaluation/src/ml_evaluation/adapters.py
      - ../../packages/ml-evaluation/src/ml_evaluation/contracts.py
      - ../../packages/ml-evaluation/src/ml_evaluation/gates.py
    outs:
      - outputs/ml-evaluation-source.sha256

  generate_synthetic_fixtures:
    cmd: uv run --locked pathologize-benchmark generate-fixtures
    deps:
      - fixtures/spec.json
      - pyproject.toml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
      - uv.lock
    outs:
      - data/synthetic

  validate_contracts:
    cmd: uv run --locked pathologize-benchmark validate-contracts
    deps:
      - data/synthetic/manifest.json
      - experiments/cell-analysis.json
      - params.yaml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    params:
      - benchmark_id
      - workstream
      - experiments
    outs:
      - outputs/contracts/validation.json

  run_baseline:
    cmd: uv run --locked pathologize-benchmark run-adapters
    deps:
      - data/synthetic
      - experiments/cell-analysis.json
      - outputs/contracts/validation.json
      - pyproject.toml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
      - uv.lock
    outs:
      - outputs/runs

  evaluate_cell_analysis:
    cmd: uv run --locked pathologize-benchmark eval-only
    deps:
      - data/synthetic
      - experiments/cell-analysis.json
      - outputs/runs/cell-analysis-contract-v1/deterministic-color-v1/failures.json
      - outputs/runs/cell-analysis-contract-v1/deterministic-color-v1/predictions.jsonl
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    outs:
      - outputs/evaluations/cell-analysis-contract-v1/deterministic-color-v1.json
    metrics:
      - outputs/evaluations/cell-analysis-contract-v1/metrics.json

  compare_cell_analysis:
    cmd: uv run --locked pathologize-benchmark compare-only
    deps:
      - experiments/cell-analysis.json
      - outputs/evaluations/cell-analysis-contract-v1/deterministic-color-v1.json
      - outputs/runs/cell-analysis-contract-v1/deterministic-color-v1/run-record.json
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    outs:
      - outputs/scorecards/cell-analysis-contract-v1.json

  write_benchmark_index:
    cmd: uv run --locked pathologize-benchmark aggregate
    deps:
      - experiments/cell-analysis.json
      - outputs/scorecards/cell-analysis-contract-v1.json
      - params.yaml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    outs:
      - outputs/benchmark/index.json

  prepare_nucls_public_data:
    cmd: uv run --locked pathologize-cell-analysis acquire
    deps:
      - sources/nucls-corrected-single-rater.json
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/data.py
      - outputs/data-artifacts-source.sha256
      - pyproject.toml
      - uv.lock
    outs:
      - data/nucls-corrected-single-rater

  evaluate_nucls_public_baseline:
    cmd: uv run --locked pathologize-cell-analysis run
    deps:
      - data/nucls-corrected-single-rater
      - experiments/nucls-public-baseline.json
      - sources/nucls-corrected-single-rater.json
      - src/pathologize_cell_analysis/classification.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/data.py
      - src/pathologize_cell_analysis/evaluation.py
      - src/pathologize_cell_analysis/experiment.py
      - src/pathologize_cell_analysis/instance_segmentation.py
      - src/pathologize_cell_analysis/localization.py
      - src/pathologize_cell_analysis/methods.py
      - outputs/data-artifacts-source.sha256
      - pyproject.toml
      - uv.lock
    outs:
      - outputs/public/nucls-public-baseline-v1

  prepare_ultralytics_artifacts:
    cmd: uv run --locked pathologize-cell-analysis acquire-ultralytics
    deps:
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/ultralytics_config.py
      - src/pathologize_cell_analysis/ultralytics_conversion.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-ultralytics.yaml:
          - package
          - models
          - weights_directory
    outs:
      - models/ultralytics/8.4.0

  prepare_nucls_ultralytics_layout:
    cmd: uv run --locked pathologize-cell-analysis prepare-ultralytics
    deps:
      - data/nucls-corrected-single-rater
      - sources/nucls-corrected-single-rater.json
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/labels.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/data.py
      - src/pathologize_cell_analysis/ultralytics_config.py
      - src/pathologize_cell_analysis/ultralytics_conversion.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-ultralytics.yaml:
          - data_directory
          - layout_directory
          - test_fold
          - validation_fold
          - maximum_border_clip_pixels
          - ontology_labels
    outs:
      - data/derived/nucls-ultralytics-yolo26n-v1

  train_nucls_ultralytics:
    cmd: uv run --locked pathologize-cell-analysis train-ultralytics
    deps:
      - data/derived/nucls-ultralytics-yolo26n-v1
      - models/ultralytics/8.4.0
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/checkpoints.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/ultralytics_config.py
      - src/pathologize_cell_analysis/ultralytics_training.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-ultralytics.yaml:
          - experiment_id
          - layout_directory
          - weights_directory
          - output_directory
          - package
          - models
          - training
          - seeds
          - limits
          - prior_failed_gpu_seconds_upper_bound
          - stop_rules
    outs:
      - outputs/public/nucls-ultralytics-yolo26n-v1/training

  predict_nucls_ultralytics:
    cmd: uv run --locked pathologize-cell-analysis predict-ultralytics
    deps:
      - data/derived/nucls-ultralytics-yolo26n-v1
      - outputs/public/nucls-ultralytics-yolo26n-v1/training
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/results.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/ultralytics_config.py
      - src/pathologize_cell_analysis/ultralytics_prediction.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-ultralytics.yaml:
          - data_directory
          - layout_directory
          - output_directory
          - test_fold
          - validation_fold
          - ontology_labels
          - training.device
          - training.image_size
          - inference
          - limits
    outs:
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/detect/predictions.jsonl
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/segment/predictions.jsonl
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/inference.json
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/rejections.json

  evaluate_nucls_ultralytics:
    cmd: uv run --locked pathologize-cell-analysis evaluate-ultralytics
    deps:
      - data/nucls-corrected-single-rater
      - data/derived/nucls-ultralytics-yolo26n-v1/manifest.json
      - outputs/public/nucls-ultralytics-yolo26n-v1/training
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/detect/predictions.jsonl
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/segment/predictions.jsonl
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/inference.json
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/rejections.json
      - reports/nucls-public-baseline.json
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/checkpoints.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/data.py
      - src/pathologize_cell_analysis/instance_segmentation.py
      - src/pathologize_cell_analysis/localization.py
      - src/pathologize_cell_analysis/methods.py
      - src/pathologize_cell_analysis/ultralytics_config.py
      - src/pathologize_cell_analysis/ultralytics_evaluation.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-ultralytics.yaml:
          - data_directory
          - layout_directory
          - output_directory
          - transparent_baseline_report
          - test_fold
          - validation_fold
          - localization_tolerance_pixels
          - ontology_labels
          - training.epochs
          - limits
    outs:
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/evidence.json

  report_nucls_ultralytics:
    cmd: uv run --locked pathologize-cell-analysis report-ultralytics
    deps:
      - outputs/public/nucls-ultralytics-yolo26n-v1/evaluation/evidence.json
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/ultralytics_config.py
      - src/pathologize_cell_analysis/ultralytics_reporting.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-ultralytics.yaml:
          - package
          - models
    metrics:
      - reports/nucls-ultralytics-baseline.json
