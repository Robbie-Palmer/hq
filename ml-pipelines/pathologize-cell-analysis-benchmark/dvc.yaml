stages:
  pin_data_artifacts:
    cmd: uv run --locked data-artifacts fingerprint data_artifacts
    deps:
      - ../../packages/data-artifacts/src/data_artifacts/__init__.py
      - ../../packages/data-artifacts/src/data_artifacts/cli.py
      - ../../packages/data-artifacts/src/data_artifacts/files.py
      - ../../packages/data-artifacts/src/data_artifacts/schemas.py
    outs:
      - outputs/data-artifacts-source.sha256

  pin_ml_evaluation:
    cmd: uv run --locked data-artifacts fingerprint ml_evaluation,data_artifacts
    deps:
      - outputs/data-artifacts-source.sha256
      - ../../packages/ml-evaluation/src/ml_evaluation/__init__.py
      - ../../packages/ml-evaluation/src/ml_evaluation/adapters.py
      - ../../packages/ml-evaluation/src/ml_evaluation/contracts.py
      - ../../packages/ml-evaluation/src/ml_evaluation/gates.py
    outs:
      - outputs/ml-evaluation-source.sha256

  generate_synthetic_fixtures:
    cmd: uv run --locked pathologize-benchmark generate-fixtures
    deps:
      - fixtures/spec.json
      - pyproject.toml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
      - uv.lock
    outs:
      - data/synthetic

  validate_contracts:
    cmd: uv run --locked pathologize-benchmark validate-contracts
    deps:
      - data/synthetic/manifest.json
      - experiments/cell-analysis.json
      - params.yaml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    params:
      - benchmark_id
      - workstream
      - experiments
    outs:
      - outputs/contracts/validation.json

  run_baseline:
    cmd: uv run --locked pathologize-benchmark run-adapters
    deps:
      - data/synthetic
      - experiments/cell-analysis.json
      - outputs/contracts/validation.json
      - pyproject.toml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
      - uv.lock
    outs:
      - outputs/runs

  evaluate_cell_analysis:
    cmd: uv run --locked pathologize-benchmark eval-only
    deps:
      - data/synthetic
      - experiments/cell-analysis.json
      - outputs/runs/cell-analysis-contract-v1/deterministic-color-v1/failures.json
      - outputs/runs/cell-analysis-contract-v1/deterministic-color-v1/predictions.jsonl
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    outs:
      - outputs/evaluations/cell-analysis-contract-v1/deterministic-color-v1.json
    metrics:
      - outputs/evaluations/cell-analysis-contract-v1/metrics.json

  compare_cell_analysis:
    cmd: uv run --locked pathologize-benchmark compare-only
    deps:
      - experiments/cell-analysis.json
      - outputs/evaluations/cell-analysis-contract-v1/deterministic-color-v1.json
      - outputs/runs/cell-analysis-contract-v1/deterministic-color-v1/run-record.json
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    outs:
      - outputs/scorecards/cell-analysis-contract-v1.json

  write_benchmark_index:
    cmd: uv run --locked pathologize-benchmark aggregate
    deps:
      - experiments/cell-analysis.json
      - outputs/scorecards/cell-analysis-contract-v1.json
      - params.yaml
      - ../pathologize-benchmark-contracts/src
      - outputs/ml-evaluation-source.sha256
    outs:
      - outputs/benchmark/index.json

  evaluate_nucls_public_baseline:
    cmd: uv run --locked pathologize-cell-analysis run
    deps:
      - ../../data-products/nucls/corrected-single-rater/data/native
      - ../../data-products/nucls/corrected-single-rater/dvc.lock
      - ../../data-products/nucls/corrected-single-rater/manifest.json
      - ../../data-products/pathologize/nucleus-analysis/dvc.lock
      - ../../data-products/pathologize/nucleus-analysis/outputs/cohort.json
      - ../../data-products/pathologize/nucleus-analysis/outputs/metrics.json
      - ../../data-products/pathologize/nucleus-analysis/src/nucleus_analysis_dataset/__init__.py
      - ../../data-products/pathologize/nucleus-analysis/src/nucleus_analysis_dataset/models.py
      - ../../data-products/pathologize/nucleus-analysis/src/nucleus_analysis_dataset/product.py
      - src/pathologize_cell_analysis/classification.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/data.py
      - src/pathologize_cell_analysis/evaluation.py
      - src/pathologize_cell_analysis/experiment.py
      - src/pathologize_cell_analysis/instance_segmentation.py
      - src/pathologize_cell_analysis/localization.py
      - src/pathologize_cell_analysis/methods.py
      - outputs/data-artifacts-source.sha256
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-public.yaml:
          - random_seed
          - localization_tolerance_pixels
          - minimum_nucleus_pixels
          - watershed_minimum_distance_pixels
          - classification_minimum_gain
          - per_run_wall_seconds
          - aggregate_accelerator_seconds
          - accelerator
    outs:
      - outputs/public-baseline

  report_nucls_public_baseline:
    cmd: uv run --locked pathologize-cell-analysis report
    deps:
      - outputs/public-baseline/evidence.json
      - params/nucls-public.yaml
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/experiment.py
      - pyproject.toml
      - uv.lock
    metrics:
      - reports/nucls-public-baseline.json

  prepare_learned_artifacts:
    cmd: uv run --locked pathologize-cell-analysis learned acquire-artifacts
    deps:
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/downloads.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/learned_baseline/config.py
      - src/pathologize_cell_analysis/learned_baseline/conversion.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-learned.yaml:
          - package
          - models
    outs:
      - models/ultralytics/8.4.0

  prepare_nucls_learned_layout:
    cmd: uv run --locked pathologize-cell-analysis learned prepare
    deps:
      - ../../data-products/nucls/corrected-single-rater/data/native
      - ../../data-products/nucls/corrected-single-rater/dvc.lock
      - ../../data-products/nucls/corrected-single-rater/manifest.json
      - ../../data-products/pathologize/nucleus-analysis/dvc.lock
      - ../../data-products/pathologize/nucleus-analysis/ontologies/source-preserving.json
      - ../../data-products/pathologize/nucleus-analysis/outputs/cohort.json
      - ../../data-products/pathologize/nucleus-analysis/outputs/records.jsonl
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/labels.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/data.py
      - src/pathologize_cell_analysis/learned_baseline/config.py
      - src/pathologize_cell_analysis/learned_baseline/conversion.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-learned.yaml:
          - maximum_border_clip_pixels
    outs:
      - data/derived/learned-layout

  train_nucls_learned:
    cmd: uv run --locked pathologize-cell-analysis learned train
    deps:
      - data/derived/learned-layout
      - models/ultralytics/8.4.0
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/checkpoints.py
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/recovery.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/learned_baseline/config.py
      - src/pathologize_cell_analysis/learned_baseline/task_training.py
      - src/pathologize_cell_analysis/learned_baseline/training.py
      - src/pathologize_cell_analysis/learned_baseline/training_policy.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-learned.yaml:
          - package
          - models
          - training
          - seeds
          - limits
          - prior_failed_gpu_seconds_upper_bound
          - stop_rules
    outs:
      - outputs/learned-baseline/training

  predict_nucls_learned:
    cmd: uv run --locked pathologize-cell-analysis learned predict
    deps:
      - ../../data-products/pathologize/nucleus-analysis/dvc.lock
      - ../../data-products/pathologize/nucleus-analysis/ontologies/source-preserving.json
      - ../../data-products/pathologize/nucleus-analysis/outputs/cohort.json
      - data/derived/learned-layout
      - outputs/learned-baseline/training
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/results.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/learned_baseline/config.py
      - src/pathologize_cell_analysis/learned_baseline/prediction.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-learned.yaml:
          - training.device
          - training.image_size
          - inference
          - limits
    outs:
      - outputs/learned-baseline/evaluation/detect/predictions.jsonl
      - outputs/learned-baseline/evaluation/segment/predictions.jsonl
      - outputs/learned-baseline/evaluation/inference.json
      - outputs/learned-baseline/evaluation/rejections.json

  evaluate_nucls_learned:
    cmd: uv run --locked pathologize-cell-analysis learned evaluate
    deps:
      - ../../data-products/nucls/corrected-single-rater/data/native
      - ../../data-products/pathologize/nucleus-analysis/dvc.lock
      - ../../data-products/pathologize/nucleus-analysis/ontologies/source-preserving.json
      - ../../data-products/pathologize/nucleus-analysis/outputs/cohort.json
      - data/derived/learned-layout/manifest.json
      - outputs/learned-baseline/training
      - outputs/learned-baseline/evaluation/detect/predictions.jsonl
      - outputs/learned-baseline/evaluation/segment/predictions.jsonl
      - outputs/learned-baseline/evaluation/inference.json
      - outputs/learned-baseline/evaluation/rejections.json
      - reports/nucls-public-baseline.json
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/checkpoints.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/data.py
      - src/pathologize_cell_analysis/instance_segmentation.py
      - src/pathologize_cell_analysis/localization.py
      - src/pathologize_cell_analysis/methods.py
      - src/pathologize_cell_analysis/learned_baseline/config.py
      - src/pathologize_cell_analysis/learned_baseline/evaluation.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-learned.yaml:
          - localization_tolerance_pixels
          - training.epochs
          - limits
    outs:
      - outputs/learned-baseline/evaluation/evidence.json

  report_nucls_learned:
    cmd: uv run --locked pathologize-cell-analysis learned report
    deps:
      - outputs/learned-baseline/evaluation/evidence.json
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/learned_baseline/config.py
      - src/pathologize_cell_analysis/learned_baseline/reporting.py
      - pyproject.toml
      - uv.lock
    params:
      - params/nucls-learned.yaml:
          - package
          - models
    metrics:
      - reports/nucls-learned-baseline.json

  train_nucls_double_descent_seed_20261107:
    cmd: uv run --locked pathologize-cell-analysis double-descent train --seed 20261107
    deps:
      - data/derived/learned-layout
      - models/ultralytics/8.4.0
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/checkpoints.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/double_descent
      - src/pathologize_cell_analysis/learned_baseline/config.py
      - params/nucls-learned.yaml
      - pyproject.toml
      - uv.lock
    params: &nucls_double_descent_params
      - params/nucls-double-descent.yaml:
          - schema_version
          - experiment_id
          - localization_tolerance_pixels
          - maximum_border_clip_pixels
          - package
          - model
          - training
          - inference
          - seeds
          - checkpoint_cadence_epochs
          - analysis
          - safety
          - limits
          - baseline
          - stop_rules
    outs:
      - outputs/nucls-double-descent/training/20261107:
          persist: true

  train_nucls_double_descent_seed_20261109:
    cmd: uv run --locked pathologize-cell-analysis double-descent train --seed 20261109
    deps:
      - data/derived/learned-layout
      - models/ultralytics/8.4.0
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/checkpoints.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/double_descent
      - src/pathologize_cell_analysis/learned_baseline/config.py
      - params/nucls-learned.yaml
      - pyproject.toml
      - uv.lock
    params: *nucls_double_descent_params
    outs:
      - outputs/nucls-double-descent/training/20261109:
          persist: true

  train_nucls_double_descent_seed_20261111:
    cmd: uv run --locked pathologize-cell-analysis double-descent train --seed 20261111
    deps:
      - data/derived/learned-layout
      - models/ultralytics/8.4.0
      - ../../packages/ultralytics-extensions/src/ultralytics_extensions/checkpoints.py
      - src/pathologize_cell_analysis/cli.py
      - src/pathologize_cell_analysis/contracts.py
      - src/pathologize_cell_analysis/double_descent
      - src/pathologize_cell_analysis/learned_baseline/config.py
      - params/nucls-learned.yaml
      - pyproject.toml
      - uv.lock
    params: *nucls_double_descent_params
    outs:
      - outputs/nucls-double-descent/training/20261111:
          persist: true

  evaluate_nucls_double_descent_seed_20261107:
    cmd: uv run --locked pathologize-cell-analysis double-descent curve --seed 20261107
    deps:
      - ../../data-products/nucls/corrected-single-rater/data/native
      - ../../data-products/pathologize/nucleus-analysis/outputs/cohort.json
      - data/derived/learned-layout
      - outputs/nucls-double-descent/training/20261107
      - src/pathologize_cell_analysis/double_descent
      - src/pathologize_cell_analysis/learned_baseline/evaluation.py
      - src/pathologize_cell_analysis/learned_baseline/prediction.py
      - pyproject.toml
      - uv.lock
    params: *nucls_double_descent_params
    outs:
      - outputs/nucls-double-descent/curves/20261107:
          persist: true

  evaluate_nucls_double_descent_seed_20261109:
    cmd: uv run --locked pathologize-cell-analysis double-descent curve --seed 20261109
    deps:
      - ../../data-products/nucls/corrected-single-rater/data/native
      - ../../data-products/pathologize/nucleus-analysis/outputs/cohort.json
      - data/derived/learned-layout
      - outputs/nucls-double-descent/training/20261109
      - src/pathologize_cell_analysis/double_descent
      - src/pathologize_cell_analysis/learned_baseline/evaluation.py
      - src/pathologize_cell_analysis/learned_baseline/prediction.py
      - pyproject.toml
      - uv.lock
    params: *nucls_double_descent_params
    outs:
      - outputs/nucls-double-descent/curves/20261109:
          persist: true

  evaluate_nucls_double_descent_seed_20261111:
    cmd: uv run --locked pathologize-cell-analysis double-descent curve --seed 20261111
    deps:
      - ../../data-products/nucls/corrected-single-rater/data/native
      - ../../data-products/pathologize/nucleus-analysis/outputs/cohort.json
      - data/derived/learned-layout
      - outputs/nucls-double-descent/training/20261111
      - src/pathologize_cell_analysis/double_descent
      - src/pathologize_cell_analysis/learned_baseline/evaluation.py
      - src/pathologize_cell_analysis/learned_baseline/prediction.py
      - pyproject.toml
      - uv.lock
    params: *nucls_double_descent_params
    outs:
      - outputs/nucls-double-descent/curves/20261111:
          persist: true

  analyze_nucls_double_descent:
    cmd: uv run --locked pathologize-cell-analysis double-descent analyze
    deps:
      - outputs/nucls-double-descent/curves/20261107
      - outputs/nucls-double-descent/curves/20261109
      - outputs/nucls-double-descent/curves/20261111
      - src/pathologize_cell_analysis/double_descent/analysis.py
      - src/pathologize_cell_analysis/double_descent/config.py
      - pyproject.toml
      - uv.lock
    params: *nucls_double_descent_params
    outs:
      - outputs/nucls-double-descent/analysis/evidence.json
    plots:
      - outputs/nucls-double-descent/analysis/curves.csv:
          x: epoch

  evaluate_nucls_double_descent_test:
    cmd: uv run --locked pathologize-cell-analysis double-descent test
    deps:
      - ../../data-products/nucls/corrected-single-rater/data/native
      - ../../data-products/pathologize/nucleus-analysis/outputs/cohort.json
      - data/derived/learned-layout
      - outputs/nucls-double-descent/analysis/evidence.json
      - outputs/nucls-double-descent/training/20261107
      - outputs/nucls-double-descent/training/20261109
      - outputs/nucls-double-descent/training/20261111
      - src/pathologize_cell_analysis/double_descent
      - src/pathologize_cell_analysis/learned_baseline/evaluation.py
      - src/pathologize_cell_analysis/learned_baseline/prediction.py
      - pyproject.toml
      - uv.lock
    params: *nucls_double_descent_params
    outs:
      - outputs/nucls-double-descent/test/evidence.json

  report_nucls_double_descent:
    cmd: uv run --locked pathologize-cell-analysis double-descent report
    deps:
      - outputs/nucls-double-descent/analysis/evidence.json
      - outputs/nucls-double-descent/test/evidence.json
      - outputs/nucls-double-descent/training/20261107/run.json
      - outputs/nucls-double-descent/training/20261109/run.json
      - outputs/nucls-double-descent/training/20261111/run.json
      - src/pathologize_cell_analysis/double_descent/reporting.py
      - pyproject.toml
      - uv.lock
    params: *nucls_double_descent_params
    metrics:
      - reports/nucls-double-descent.json:
          cache: false
    outs:
      - reports/nucls-double-descent.md:
          cache: false
