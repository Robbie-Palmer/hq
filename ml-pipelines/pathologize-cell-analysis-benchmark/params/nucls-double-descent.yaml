stop_rules:
  - Stop before training if frozen splits, conversion semantics, or model pins differ from the merged baseline.
  - Stop before training if another NuCLS GPU process is active or free disk is below 10 GiB.
  - Stop immediately on a non-finite training loss or validation metric.
  - Stop a seed after three epochs with training loss above four times its prior finite minimum.
  - Stop a seed after twelve epochs with validation loss above 1.5 times its best while mAP50-95 stays below its best.
  - Stop on loss of deterministic resume, repeated infrastructure failure, peak VRAM above 12 GiB, or exhausted time or GPU caps.
