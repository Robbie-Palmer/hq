[tools]
python = "3.12"

[env]
PYTHONDONTWRITEBYTECODE = "1"
UV_PYTHON = "3.12"

[tasks.sync]
description = "Install the locked cell-analysis benchmark environment"
run = "uv sync --locked"

[tasks.lock]
description = "Update the cell-analysis benchmark lockfile"
run = "uv lock"

[tasks.dvc]
description = "Run a DVC command in the cell-analysis benchmark"
run = "bash ../scripts/dvc.sh"

[tasks.repro]
description = "Reproduce the deterministic synthetic contract benchmark"
depends = ["sync"]
run = "bash ../scripts/dvc.sh repro write_benchmark_index"

[tasks.verify]
description = "Verify cell-analysis contracts, leakage boundaries, and scorecards"
depends = ["sync", "repro"]
run = "uv run --locked pathologize-benchmark verify"

[tasks.check]
description = "Check the cell-analysis benchmark"
depends = ["lint", "typecheck", "test:coverage", "verify"]

[tasks.format]
description = "Format cell-analysis benchmark Python code"
depends = ["sync"]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks.lint]
description = "Lint cell-analysis benchmark Python code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check cell-analysis benchmark Python code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run cell-analysis benchmark tests"
depends = ["sync"]
run = "uv run --locked pytest --no-cov"

[tasks."test:coverage"]
description = "Run cell-analysis benchmark tests with Cobertura coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml:coverage.xml"

[tasks."public:repro"]
description = "Acquire and run the bounded NuCLS public baseline through DVC"
depends = ["sync"]
run = "bash ../scripts/dvc.sh repro evaluate_nucls_public_baseline"

[tasks."public:report"]
description = "Write the tracked NuCLS public-baseline evidence report"
depends = ["sync"]
run = "uv run --locked pathologize-cell-analysis report"

[tasks."ultralytics:prepare"]
description = "Acquire pinned Ultralytics assets and build the derived NuCLS layouts"
depends = ["sync"]
run = "bash ../scripts/dvc.sh repro prepare_ultralytics_artifacts prepare_nucls_ultralytics_layout"

[tasks."ultralytics:repro"]
description = "Train and evaluate the predeclared NuCLS Ultralytics baseline"
depends = ["sync"]
run = "bash ../scripts/dvc.sh repro evaluate_nucls_ultralytics"

[tasks."ultralytics:train"]
description = "Train or exactly resume the predeclared NuCLS Ultralytics baseline"
depends = ["sync"]
run = "uv run --locked pathologize-cell-analysis train-ultralytics"

[tasks."ultralytics:evaluate"]
description = "Evaluate the trained NuCLS Ultralytics baseline on the frozen test fold"
depends = ["sync"]
run = "uv run --locked pathologize-cell-analysis evaluate-ultralytics"

[tasks."ultralytics:report"]
description = "Write the tracked NuCLS Ultralytics evidence report"
depends = ["sync"]
run = "uv run --locked pathologize-cell-analysis report-ultralytics"
