[tools]
python = "3.12"

[env]
PYTHONDONTWRITEBYTECODE = "1"
UV_PYTHON = "3.12"

[tasks.sync]
description = "Install the locked cell-analysis benchmark environment"
run = "uv sync --locked"

[tasks.lock]
description = "Update the cell-analysis benchmark lockfile"
run = "uv lock"

[tasks.dvc]
description = "Run a DVC command in the cell-analysis benchmark"
run = "bash ../scripts/dvc.sh"

[tasks.repro]
description = "Reproduce the deterministic cell-analysis benchmark"
depends = ["sync"]
run = "bash ../scripts/dvc.sh repro"

[tasks.verify]
description = "Verify cell-analysis contracts, leakage boundaries, and scorecards"
depends = ["sync", "repro"]
run = "uv run --locked pathologize-benchmark verify"

[tasks.check]
description = "Check the cell-analysis benchmark"
depends = ["verify"]
