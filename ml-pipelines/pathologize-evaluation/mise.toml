[tools]
python = "3.12"

[tasks.sync]
description = "Install the locked Pathologize evaluation environment"
run = "uv sync --locked"

[tasks.lock]
description = "Update the Pathologize evaluation lockfile"
run = "uv lock"

[tasks.format]
description = "Format Pathologize evaluation Python code"
depends = ["sync"]
run = "uv run --locked ruff format ."

[tasks.lint]
description = "Lint Pathologize evaluation Python code"
depends = ["sync"]
run = "uv run --locked ruff check ."

[tasks.typecheck]
description = "Type-check Pathologize evaluation Python code"
depends = ["sync"]
run = "uv run --locked ty check"

[tasks.test]
description = "Run Pathologize evaluation tests"
depends = ["sync"]
run = "uv run --locked pytest --no-cov"

[tasks."test:coverage"]
description = "Run Pathologize evaluation tests with Cobertura coverage"
depends = ["sync"]
run = "uv run --locked pytest --cov-report=xml:coverage.xml"

[tasks.schemas]
description = "Write Pathologize benchmark JSON Schemas"
depends = ["sync"]
run = "uv run --locked pathologize-evaluation schemas"

[tasks."schemas:check"]
description = "Check committed Pathologize benchmark schemas for drift"
depends = ["sync"]
run = "uv run --locked pathologize-evaluation schemas --check"

[tasks.dvc]
description = "Run a DVC command in the Pathologize evaluation project"
run = "bash ../scripts/dvc.sh"

[tasks.repro]
description = "Reproduce the deterministic synthetic Pathologize benchmark"
run = "bash ../scripts/dvc.sh repro"

[tasks.verify]
description = "Verify benchmark contracts, leakage boundaries, and scorecards"
depends = ["sync", "repro"]
run = "uv run --locked pathologize-evaluation verify"

[tasks.check]
description = "Run all Pathologize evaluation checks"
depends = ["lint", "typecheck", "test:coverage", "schemas:check", "verify"]
