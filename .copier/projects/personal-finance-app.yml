  nix:
    enabled: false
  opentelemetry:
    cardinality:
      forbidden_metric_attributes:
        - user.id
        - session.id
        - trace_id
        - span_id
        - request.id
        - url.full
        - db.query.text
        - messaging.message.id
        - gen_ai.conversation.id
        - cicd.pipeline.run.id
        - me.robbiepalmer.workspace.id
      max_attribute_count_per_record: 128
      max_attribute_value_length: 4096
      max_metric_series_per_instrument: 2000
      max_span_name_templates_per_service: 100
      metric_attribute_value_classes:
        bounded: 200
        low: 20
    data_policy:
      enforcement_surfaces:
        - resource-attributes
        - span-attributes
        - span-events
        - log-attributes
        - log-body
        - metric-attributes
        - baggage
      mode: default-deny
      prohibited_attribute_keys:
        exact:
          - app.installation.id
          - db.query.text
          - device.id
          - enduser.id
          - enduser.pseudo.id
          - gen_ai.completion
          - gen_ai.input.messages
          - gen_ai.output.messages
          - gen_ai.prompt
          - gen_ai.system_instructions
          - gen_ai.tool.call.arguments
          - gen_ai.tool.call.result
          - gen_ai.tool.definitions
          - http.request.header.authorization
          - http.request.header.cookie
          - http.request.header.proxy-authorization
          - http.response.header.set-cookie
          - messaging.message.body
          - process.command_args
          - session.id
          - session.previous_id
          - url.full
          - url.original
          - url.path
          - url.query
          - user.id
        prefixes:
          - db.operation.parameter.
          - db.query.parameter.
          - env.
          - process.environment_variable.
      prohibited_content_classes:
        - credential
        - authorization-header
        - cookie
        - environment-variable
        - prompt
        - model-response
        - tool-arguments
        - tool-result
        - source-content
        - diff
        - terminal-output
        - database-statement
        - database-bind-value
        - message-body
        - user-data-object-key
        - personal-identifier
        - raw-url-path
        - raw-url-query-string
      redaction: deterministic-only
      unsafe_record_action: drop
    enabled: true
    failure_mode: fail-open
    resource_attributes:
      deployment.environment.name: template-required
      me.robbiepalmer.project.id: project:personal-finance-app
      service.name: template-required
      service.namespace: template-required
      service.version: template-required
    runtime: typescript-worker
    semantic_conventions: stable-only
    signals:
      - traces
      - metrics
      - logs
    transport:
      protocol: http/protobuf
      route: direct
  ownership:
    owned_paths:
      - infra/personal-finance
      - packages/finance-housing-indices
      - packages/finance-inflation-indices
      - packages/finance-tax-rules
      - packages/planning-case-domain
