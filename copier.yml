_min_copier_version: "9.18.2"
_subdirectory: "copier-templates/monorepo-project"
_exclude:
  - "__no_terraform_root__"
  - "__no_rollout_root__"
  - "__no_operations_root__"
_skip_if_exists:
  - "packages/*/src/project-schema.ts"
  - "workers/*/src/project-authorization.ts"
  - "workers/*/src/project-routes.ts"

project_id:
  type: str

blueprint:
  type: yaml

terraform_root_path:
  type: str
  when: false
  default: >-
    {%- set all_roots = blueprint.components | selectattr("kind", "equalto", "terraform-root") | list -%}
    {%- set generated_roots = all_roots | rejectattr("template_ownership", "equalto", "project") | list -%}
    {%- set rollout = blueprint.rollout | default({}, true) -%}
    {%- set stateful_operations = rollout.stateful_operations | default(none, true) -%}
    {%- set roots = all_roots if all_roots | length == 1 and stateful_operations else generated_roots -%}
    {{ roots[0].path if roots | length == 1 else "__no_terraform_root__" }}

rollout_root_path:
  type: str
  when: false
  default: >-
    {%- set roots = blueprint.components | selectattr("kind", "equalto", "terraform-root") | list -%}
    {{ roots[0].path if roots | length == 1 else "__no_rollout_root__" }}

operations_root_path:
  type: str
  when: false
  default: >-
    {%- set roots = blueprint.components | selectattr("kind", "equalto", "terraform-root") | list -%}
    {%- set rollout = blueprint.rollout | default({}, true) -%}
    {%- set operations = rollout.stateful_operations | default(none, true) -%}
    {{ roots[0].path if roots | length == 1 and operations else "__no_operations_root__" }}
