schema_version: 1

project:
  id: "agentic-code-review"
  name: "Agentic Code Review"
  kind: "service"

components:
  - id: "ai-review-domain"
    name: "AI review domain"
    kind: "typescript-package"
  - id: "ai-review-evaluation"
    name: "AI review evaluation"
    kind: "python-pipeline"

layers:
  - layer: "governance"
  - layer: "base"
    slots:
      - "secrets.runtime-store"
      - "secrets.ci-store"
  - layer: "typescript"
  - layer: "backend-api"
    slots:
      - "backend-api.runtime"
  - layer: "database"
    slots:
      - "database.olap-engine"
  - layer: "infrastructure"
    slots:
      - "infrastructure.provisioner"
      - "infrastructure.state-backend"
  - layer: "observability"
  - layer: "storage"
    slots:
      - "storage.object-store"

requirements:
  - "runtime-derived-api-contract"
  - "data-classification"
  - "object-lifecycle-policy"
  - "scoped-storage-credentials"

reconciliation:
  mode: "tracking"

nix:
  boundary: "none"

opentelemetry:
  enabled: false
