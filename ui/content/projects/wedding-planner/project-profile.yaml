schema_version: 1

project:
  id: "wedding-planner"
  name: "Wedding planner"
  kind: "application"

components:
  - id: "publication"
    name: "Wedding planner publication"
    kind: "project-content"
  - id: "web"
    name: "Wedding planner"
    kind: "project-ui"
    mount_path: "/wedding-planner"
  - id: "wedding-planner-domain"
    name: "Wedding planner domain"
    kind: "typescript-package"

layers:
  - layer: "governance"
  - layer: "base"
  - layer: "typescript"
  - layer: "web-app"
    slots:
      - "web-app.host"

reconciliation:
  mode: "tracking"

nix:
  boundary: "none"

opentelemetry:
  enabled: false
