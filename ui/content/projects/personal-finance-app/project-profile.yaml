schema_version: 1

project:
  id: "personal-finance-app"
  name: "Personal Finance App"
  kind: "application"

components:
  - id: "web"
    name: "Asset Tracker"
    kind: "project-ui"
    mount_path: "/assettracker"
  - id: "finance-housing-indices"
    name: "Finance housing indices"
    kind: "typescript-package"
  - id: "finance-inflation-indices"
    name: "Finance inflation indices"
    kind: "typescript-package"
  - id: "finance-tax-rules"
    name: "Finance tax rules"
    kind: "typescript-package"
  - id: "planning-case-domain"
    name: "Planning case domain"
    kind: "typescript-package"
  - id: "personal-finance-api"
    name: "Personal Finance API"
    kind: "worker"
    template_ownership: "structure-only"
    runtime_role: "authenticated-worker"
  - id: "personal-finance-contracts"
    name: "Personal Finance contracts"
    kind: "typescript-package"
    template_ownership: "structure-only"
    runtime_role: "api-contracts"
  - id: "personal-finance-data"
    name: "Personal Finance data boundary"
    kind: "typescript-package"
    template_ownership: "structure-only"
    runtime_role: "relational-data"
  - id: "personal-finance"
    name: "Personal Finance infrastructure"
    kind: "terraform-root"
    template_ownership: "project"

layers:
  - layer: "governance"
  - layer: "base"
    slots:
      - "secrets.runtime-store"
      - "secrets.ci-store"
      - "delivery.preview-environment"
      - "security.preview-access"
  - layer: "typescript"
  - layer: "web-app"
    slots:
      - "web-app.host"
  - layer: "backend-api"
    slots:
      - "backend-api.runtime"
      - "backend-api.http-framework"
      - "backend-api.contract-format"
      - "backend-api.contract-generator"
      - "backend-api.relational-connection"
  - layer: "identity"
    slots:
      - "identity.authentication-library"
      - "identity.login-provider"
      - "identity.session-transport"
      - "identity.authorization-policy"
  - layer: "api-governance"
    slots:
      - "api-governance.compatibility-check"
  - layer: "database"
    slots:
      - "database.relational-engine"
      - "database.relational-host"
      - "database.relational-access"
      - "database.migration-discipline"
      - "database.backup-restore"
      - "database.preview-isolation"
  - layer: "infrastructure"
    slots:
      - "infrastructure.provisioner"
      - "infrastructure.state-backend"
  - layer: "observability"
    slots:
      - "observability.telemetry-protocol"
      - "observability.application-telemetry"
      - "observability.alert-evaluation"
      - "observability.alert-delivery"
  - layer: "storage"
    slots:
      - "storage.object-store"

requirements:
  - "preview-scoped-credentials"
  - "synthetic-preview-data"
  - "preview-cleanup"
  - "provider-registration"
  - "runtime-derived-api-contract"
  - "javascript-typescript-server-component"
  - "durable-session-store"
  - "server-side-authorization"
  - "same-origin-auth-routes"
  - "secure-http-only-cookie"
  - "environment-specific-redirect-uri"
  - "committed-api-contract"
  - "published-api-baseline"
  - "committed-migration-history"
  - "serialized-migration-runner"
  - "backup-key-custody"
  - "backup-retention-policy"
  - "restore-drill"
  - "fresh-migration-baseline"
  - "instrumented-runtime"
  - "telemetry-redaction"
  - "bounded-exporter-failure"
  - "telemetry-retention"
  - "responder-ownership"
  - "alert-routing"
  - "project-owned-slack-credentials"
  - "data-classification"
  - "object-lifecycle-policy"
  - "scoped-storage-credentials"

reconciliation:
  mode: tracking

nix:
  boundary: "none"

opentelemetry:
  enabled: true
  runtime: "typescript-worker"

rollout:
  operational_checks:
    - id: "copier-profile-conformance"
      command: "mise //packages/project-generator:check"
    - id: "compiled-provider-boundary"
      command: "mise //infra/project-modules:check"
    - id: "browser-export-recovery"
      command: "mise //ui:test -- app/_projects/personal-finance-app/tests/domain/assetTrackerBackup.test.ts app/_projects/personal-finance-app/tests/api/assettracker.test.ts"
  migration_checkpoints:
    - id: "export-browser-state-before-import"
      action: "Export and validate the current browser household backup before importing any data into the relational store."
      verification: "mise //ui:test -- app/_projects/personal-finance-app/tests/domain/assetTrackerBackup.test.ts"
      status: "pending"
      evidence: []
    - id: "preserve-browser-recovery-during-dual-read"
      action: "Keep assettracker:data:v1 readable and keep legacy raw and version-zero backup recovery while browser and server reads overlap."
      verification: "mise //ui:test -- app/_projects/personal-finance-app/tests/api/assettracker.test.ts app/_projects/personal-finance-app/tests/domain/assetTrackerBackup.test.ts"
      status: "pending"
      evidence: []
    - id: "prove-relational-restore-before-cutover"
      action: "Complete a relational restore drill and retain the browser export until server reads and rollback have both been verified."
      verification: "mise //infra/personal-finance:test"
      status: "pending"
      evidence: []
  stateful_operations:
    preview:
      github_environment: "preview-personal-finance"
      secret_config_ref: "doppler://personal-finance/drift_preview"
      provision: "mise //infra/personal-finance:preview:provision"
      migrate: "mise //infra/personal-finance:db:migrate:preview"
      seed_synthetic: "mise //infra/personal-finance:db:seed:preview"
      deploy: "mise //infra/personal-finance:deploy:preview"
      smoke_authenticated: "mise //infra/personal-finance:smoke:preview"
      smoke_telemetry: "mise //infra/personal-finance:smoke:telemetry"
      cleanup: "mise //infra/personal-finance:preview:cleanup"
    production:
      github_environment: "production-personal-finance"
      plan_secret_config_ref: "doppler://personal-finance/ops"
      apply_secret_config_ref: "doppler://personal-finance/apply_production"
      migrate: "mise //infra/personal-finance:db:migrate:production"
      deploy: "mise //infra/personal-finance:deploy:production"
      smoke: "mise //infra/personal-finance:smoke:production"
      rollback: "mise //infra/personal-finance:rollback:production"
    backup:
      github_environment: "production-personal-finance-backup"
      secret_config_ref: "doppler://personal-finance/backup"
      schedule: "23 4 * * 0"
      create: "mise //infra/personal-finance:backup:create"
      restore: "mise //infra/personal-finance:restore:drill"
    alerting:
      github_environment: "production-personal-finance-alerting"
      secret_config_ref: "doppler://personal-finance/apply_alerts"
      responder: "Personal Finance owner"
      smoke: "mise //infra/personal-finance:smoke:alert"
