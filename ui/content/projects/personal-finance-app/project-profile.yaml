schema_version: 1

project:
  id: "personal-finance-app"
  name: "Personal Finance App"
  kind: "application"

components:
  - id: "web"
    name: "Asset Tracker"
    kind: "project-ui"
    mount_path: "/assettracker"
  - id: "finance-housing-indices"
    name: "Finance housing indices"
    kind: "typescript-package"
  - id: "finance-inflation-indices"
    name: "Finance inflation indices"
    kind: "typescript-package"
  - id: "finance-tax-rules"
    name: "Finance tax rules"
    kind: "typescript-package"
  - id: "planning-case-domain"
    name: "Planning case domain"
    kind: "typescript-package"
  - id: "personal-finance"
    name: "Personal Finance infrastructure"
    kind: "terraform-root"

layers:
  - layer: "governance"
  - layer: "base"
    slots:
      - "secrets.runtime-store"
      - "secrets.ci-store"
  - layer: "infrastructure"
    slots:
      - "infrastructure.provisioner"
      - "infrastructure.state-backend"

reconciliation:
  mode: tracking

nix:
  boundary: "none"

opentelemetry:
  enabled: false
