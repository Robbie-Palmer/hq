project: "personal-engineering-platform"
layers:
  - slug: "base"
    title: "Base"
    description: "Repository, task-running, CI, and common security defaults."
  - slug: "governance"
    title: "Governance"
    description: "Ownership, publication, licensing, and source-boundary defaults."
  - slug: "typescript"
    title: "TypeScript"
    description: "Defaults for projects whose primary language is TypeScript."
    activated_by:
      slot: "project.primary-language"
      technology: "TypeScript"
  - slug: "python"
    title: "Python"
    description: "Defaults for projects whose primary language is Python."
    activated_by:
      slot: "project.primary-language"
      technology: "Python"
  - slug: "web-app"
    title: "Web application"
    description: "Defaults for browser-delivered applications."
  - slug: "backend-api"
    title: "Backend API"
    description: "Defaults for network APIs and server-side application code."
  - slug: "infrastructure"
    title: "Infrastructure"
    description: "Defaults for provisioning and infrastructure management."
  - slug: "observability"
    title: "Observability"
    description: "Defaults for application telemetry and node monitoring."
  - slug: "database"
    title: "Database"
    description: "Conditional defaults for transactional and analytical data."
slots:
  - slug: "governance.repository-visibility"
    title: "Repository visibility"
    description: "Who can read the source repository."
    rationale: "Public, private, and selectively shared repositories make different transparency and collaboration trade-offs."
    kind: "policy"
  - slug: "governance.license"
    title: "Source licence"
    description: "The terms under which other people may use and redistribute the source."
    rationale: "Copyleft, permissive, source-available, and proprietary terms create materially different obligations."
    kind: "policy"
  - slug: "governance.source-boundary"
    title: "Source boundary"
    description: "The repository boundary within which project source and shared engineering controls live."
    rationale: "A shared monorepo, dedicated repository, or split source tree changes ownership, reuse, and delivery coordination."
    kind: "policy"
  - slug: "project.repository-host"
    title: "Source repository host"
    description: "The service that hosts Git repositories, Pull Requests, and repository policy."
    rationale: "GitHub, GitLab, Bitbucket, and self-hosted forges provide comparable repository collaboration boundaries."
  - slug: "project.task-runner"
    title: "Task and tool-version interface"
    description: "The project-level command interface used locally and in CI."
    rationale: "Mise, Make, Task, and language-specific scripts can pin tools and expose repeatable project tasks."
  - slug: "project.primary-language"
    title: "Primary language"
    description: "The language that determines the project's language-tooling layer."
    rationale: "TypeScript, Python, Java and the JVM, Go, Rust, C++, R, and Erlang offer different ecosystems and language-specific tools."
  - slug: "development.coding-agents"
    title: "Coding agents"
    description: "Agents permitted to plan, implement, and verify changes in project repositories."
    rationale: "Claude Code, Codex, and other coding agents offer different model access, tool environments, and working styles."
    cardinality: "many"
  - slug: "quality.ai-reviewers"
    title: "AI reviewers"
    description: "Automated reviewers that provide independent findings on proposed changes."
    rationale: "Managed reviewers, coding-agent review, and an owned review service provide complementary coverage and availability."
    cardinality: "many"
  - slug: "delivery.ci"
    title: "Continuous integration"
    description: "The service that runs repository checks and delivery workflows."
    rationale: "GitHub Actions, GitLab CI, CircleCI, Buildkite, and other runners can execute the same project tasks."
  - slug: "delivery.dependency-updates"
    title: "Dependency update automation"
    description: "Automated discovery and proposal of dependency updates."
    rationale: "Renovate and Dependabot both maintain dependencies through reviewable Pull Requests."
  - slug: "delivery.workflow-linter"
    title: "Delivery workflow linter"
    description: "Static correctness checks for CI workflow syntax and expressions."
    rationale: "actionlint and platform-specific validators catch workflow errors before CI tries to execute them."
  - slug: "security.workflow-analysis"
    title: "Delivery workflow security analysis"
    description: "Static security analysis for CI workflow permissions, triggers, and expressions."
    rationale: "zizmor and comparable workflow-security tools check risks that ordinary syntax validation does not."
  - slug: "security.dependency-and-iac-scan"
    title: "Dependency and infrastructure scan"
    description: "Known-vulnerability and configuration scanning for dependencies and infrastructure files."
    rationale: "Trivy, Snyk, and Grype-based workflows cover overlapping dependency and configuration risks."
  - slug: "security.repository-posture"
    title: "Repository security posture"
    description: "Periodic checks of repository settings and software supply-chain practices."
    rationale: "OpenSSF Scorecard, Allstar, and manual audits can assess repository-level controls beyond source files."
  - slug: "security.secret-scan"
    title: "Committed secret detection"
    description: "Detection of credentials before commit and across repository history."
    rationale: "Gitleaks, TruffleHog, detect-secrets, and forge-native scanning address accidental credential disclosure."
  - slug: "quality.code-analysis"
    title: "Code quality analysis"
    description: "Cross-project analysis of maintainability, duplication, coverage, and security findings."
    rationale: "SonarQube, Code Climate, and Qlty provide repository-level code quality gates and trends."
  - slug: "content.spell-check"
    title: "Spelling checks"
    description: "Deterministic spelling checks for source code, documentation, and published content."
    rationale: "typos, codespell, and cspell trade recall against false-positive and configuration costs."
  - slug: "secrets.runtime-store"
    title: "Runtime secret store"
    description: "The source of truth for sensitive application and development configuration."
    rationale: "Doppler, 1Password, Vault, and cloud secret managers can store and deliver runtime configuration."
  - slug: "secrets.ci-store"
    title: "CI secret delivery"
    description: "The boundary that releases credentials to approved delivery jobs."
    rationale: "GitHub Secrets, external secret managers, and workload identity can provide credentials to CI."
  - slug: "typescript.package-manager"
    title: "TypeScript package manager"
    description: "Locked dependency installation and workspace management for TypeScript projects."
    rationale: "pnpm, npm, Yarn, and Bun provide package installation and workspace support with different isolation models."
  - slug: "typescript.test-runner"
    title: "TypeScript test runner"
    description: "The default runner for TypeScript unit and integration tests."
    rationale: "Vitest, Jest, Node's test runner, and uvu can execute TypeScript-oriented test suites."
  - slug: "typescript.linter-formatter"
    title: "TypeScript linter and formatter"
    description: "Fast formatting and static checks for JavaScript and TypeScript source."
    rationale: "Biome, ESLint with Prettier, and oxlint-based toolchains cover overlapping code-quality checks."
  - slug: "typescript.git-hooks"
    title: "TypeScript Git hook manager"
    description: "Repository hooks that run fast checks before a commit leaves the working tree."
    rationale: "Husky, lefthook, simple-git-hooks, and pre-commit can install and manage local Git hooks."
  - slug: "typescript.dead-code-analysis"
    title: "TypeScript dead-code analysis"
    description: "Whole-project detection of unused files, exports, and dependencies."
    rationale: "Knip, ts-prune, and package-manager audits cover different parts of TypeScript reachability and dependency hygiene."
  - slug: "typescript.source-security"
    title: "TypeScript source security analysis"
    description: "Semantic security analysis of TypeScript source and data flow."
    rationale: "CodeQL, Semgrep, and commercial SAST services provide source-aware security checks."
  - slug: "typescript.schema-validation"
    title: "TypeScript schema validation"
    description: "Runtime validation at TypeScript data boundaries."
    rationale: "Zod, Valibot, and ArkType address the same runtime-validation requirement."
  - slug: "python.package-manager"
    title: "Python package and environment manager"
    description: "Locked dependency resolution and virtual-environment management for Python projects."
    rationale: "uv, Poetry, PDM, and pip-tools provide reproducible Python dependency workflows."
  - slug: "python.linter-formatter"
    title: "Python linter and formatter"
    description: "Formatting and static lint checks for Python source."
    rationale: "Ruff, Black with Flake8, and pylint-based toolchains cover overlapping style and correctness checks."
  - slug: "python.test-runner"
    title: "Python test runner"
    description: "The default runner and fixture system for Python tests."
    rationale: "pytest, unittest, and nose2 provide different conventions for Python test execution."
  - slug: "python.data-validation"
    title: "Python data validation"
    description: "Typed validation for Python inputs and configuration."
    rationale: "Pydantic, attrs, and Marshmallow address comparable validation needs."
  - slug: "python.test-cases"
    title: "Python test cases"
    description: "Reusable and parameterised Python test cases."
    rationale: "pytest-cases competes with fixtures and native parameterisation for this role."
  - slug: "web-app.ui-library"
    title: "Web UI library"
    description: "The component and rendering model used to build browser interfaces."
    rationale: "React, Vue, Svelte, Solid, and native Web Components provide credible UI composition models."
  - slug: "web-app.framework"
    title: "Web application framework"
    description: "Routing, build, rendering, and deployment conventions for browser applications."
    rationale: "Next.js, Remix, Astro, Nuxt, and SvelteKit package different application and rendering models."
  - slug: "web-app.styling"
    title: "Web styling system"
    description: "The default way to express responsive styles and shared design tokens."
    rationale: "Tailwind CSS, CSS Modules, styled-components, and vanilla-extract provide different styling workflows."
  - slug: "web-app.component-library"
    title: "Web component starting point"
    description: "Accessible interface components that projects can own and adapt."
    rationale: "shadcn/ui, Material UI, Chakra UI, and headless libraries trade ownership against packaged behavior."
  - slug: "web-app.host"
    title: "Managed web application host"
    description: "Preview and production hosting for a browser-delivered application."
    rationale: "Cloudflare Pages, Vercel, Netlify, and object storage with a CDN can publish web applications."
  - slug: "backend-api.runtime"
    title: "Backend API runtime"
    description: "The managed runtime for an HTTP API."
    rationale: "Cloudflare Workers, AWS Lambda, ECS, EKS, Elastic Beanstalk, Railway, Google Cloud, Azure, and other container platforms can host the same API boundary."
  - slug: "infrastructure.provisioner"
    title: "Infrastructure provisioner"
    description: "Declarative provisioning for managed infrastructure."
    rationale: "Terraform, OpenTofu, and Pulumi address the same provisioning role."
  - slug: "infrastructure.state-backend"
    title: "Terraform state backend"
    description: "Protected shared storage and locking for Terraform state."
    rationale: "Terraform Cloud, S3-compatible backends, cloud storage, and self-hosted services can coordinate remote state."
  - slug: "infrastructure.linter"
    title: "Terraform static analysis"
    description: "Provider-aware lint checks beyond Terraform's built-in validation."
    rationale: "TFLint, Checkov, and custom policy checks catch different Terraform correctness and policy problems."
  - slug: "observability.application-telemetry"
    title: "Application telemetry"
    description: "Product analytics, traces, logs, and application-level signals."
    rationale: "PostHog, Grafana Cloud, and vendor suites can collect these signals."
  - slug: "observability.node-monitoring"
    title: "Node monitoring"
    description: "Host and node health metrics for operated machines."
    rationale: "Netdata, Prometheus, and hosted agents address node monitoring."
  - slug: "database.relational-engine"
    title: "Relational database engine"
    description: "Transactional relational storage when a project needs it."
    rationale: "PostgreSQL, MySQL, and SQLite answer comparable relational requirements."
  - slug: "database.relational-host"
    title: "Managed relational host"
    description: "A managed host for the selected relational engine."
    rationale: "Neon, Supabase, and cloud database services can host PostgreSQL."
  - slug: "database.olap-engine"
    title: "OLAP engine"
    description: "Analytical SQL processing when a project needs it."
    rationale: "DuckDB, ClickHouse, BigQuery, Redshift, and other warehouse services answer analytical workloads."
