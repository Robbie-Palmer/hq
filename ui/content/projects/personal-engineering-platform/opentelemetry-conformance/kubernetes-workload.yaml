schema_version: 1
fixture: "kubernetes-workload"
runtime: "kubernetes-workload"
resource:
  service.namespace: "agent-friendly-remote-development"
  service.name: "workspace-controller"
  service.version: "sha256:0123456789abcdef"
  service.instance.id: "remote-development.workspace-controller.pod-01"
  deployment.environment.name: "production"
  me.robbiepalmer.project.id: "agent-friendly-remote-development"
instance_strategy: "addressable-runtime"
signals: ["traces", "metrics", "logs"]
profiles_enabled: false
propagators: ["tracecontext", "baggage"]
transport:
  protocol: "grpc"
  route: "collector"
semantic_domains: ["http", "messaging", "object-storage"]
sampling:
  sampler: "parentbased_traceidratio"
  ratio: 0.1
batching:
  max_queue_size: 2048
  max_export_batch_size: 512
  schedule_delay_ms: 5000
  export_timeout_ms: 30000
cardinality:
  max_active_instances: 20
  max_metric_series_per_instrument: 2000
  max_span_name_templates: 75
allowed_attributes:
  - "k8s.namespace.name"
  - "k8s.pod.name"
  - "k8s.container.name"
  - "error.type"
rejected_attributes:
  - "messaging.system"
  - "messaging.operation.name"
  - "messaging.message.body"
  - "messaging.message.id"
  - "url.query"
assertions:
  - "The pod sends OTLP to the cluster collector rather than a public backend."
  - "Kubernetes resource detection agrees with service.instance.id."
  - "Collector backpressure cannot exhaust workload memory."
