schema_version: 2
enforcement: "migration"

project_kinds:
  - id: "application"
    description: "A user-facing product with one or more deployable components."
    task_profile: "standard"
  - id: "service"
    description: "An independently operated API, worker, or automation service."
    task_profile: "standard"
  - id: "library"
    description: "Reusable code distributed through a language workspace or package
      registry."
    task_profile: "standard"
  - id: "data-pipeline"
    description: "A reproducible ingestion, training, evaluation, or
      artifact-production workflow."
    task_profile: "standard"
  - id: "embedded-system"
    description: "Portable C++ logic plus host, simulator, browser, or firmware adapters."
    task_profile: "standard"
  - id: "infrastructure"
    description: "Provisioning code with an explicit state and operational owner."
    task_profile: "standard"
  - id: "platform"
    description: "Shared runtime, delivery, or developer capabilities consumed by
      multiple projects."
    task_profile: "standard"

projects:
  - id: "personal-engineering-platform"
    kind: "platform"
    catalog_record: "system:personal-engineering-platform/platform"
  - id: "recipe-site"
    kind: "application"
    catalog_record: "system:recipe-site/application"
  - id: "personal-finance-app"
    kind: "application"
    catalog_record: "system:personal-finance-app/application"
  - id: agent-first-writing
    kind: data-pipeline
    catalog_record: system:agent-first-writing/data-pipeline
  - id: agentic-code-review
    kind: service
    catalog_record: system:agentic-code-review/service
  - id: personal-knowledge-graph
    kind: application
    catalog_record: system:personal-knowledge-graph/application
  - id: work-graph
    kind: service
    catalog_record: system:work-graph/service
  - id: personal-digital-infrastructure
    kind: platform
    catalog_record: system:personal-digital-infrastructure/platform
  - id: wedding-planner
    kind: application
    catalog_record: system:wedding-planner/application
  - id: annotation-workbench
    kind: application
    catalog_record: system:annotation-workbench/application

component_kinds:
  - id: "ui"
    description: "Migration-only compatibility kind for the current shared frontend host."
    technology: "typescript"
    directory: "ui"
    migration_only: true
    mise_config_root: true
    pnpm_workspace_package: true
    task_ownership: inherited
  - id: "project-ui"
    description: "Project-owned browser code mounted into the shared frontend host."
    technology: "typescript"
    directory: "typescript/apps/site-ui/features/{project}"
    migration_directories: [ "ui/app/_projects/{project}" ]
    mise_config_root: false
    pnpm_workspace_package: false
    task_ownership: delegated
    delegated_task_project: "//typescript/apps/site-ui"
    migration_delegated_task_project: "//ui"
  - id: "project-content"
    description: "Project knowledge-graph content rendered by the shared frontend."
    technology: "content"
    directory: "content/projects/{project}"
    migration_directories: [ "ui/content/projects/{project}" ]
    mise_config_root: false
    pnpm_workspace_package: false
    task_ownership: delegated
    delegated_task_project: "//typescript/apps/site-ui"
    migration_delegated_task_project: "//ui"
  - id: "worker"
    description: "A TypeScript application, Worker, or independently deployed service."
    technology: "typescript"
    directory: "typescript/apps/{component}"
    migration_directories: [ "workers/{component}" ]
    mise_config_root: true
    pnpm_workspace_package: true
    task_ownership: inherited
  - id: "typescript-package"
    technology: "typescript"
    directory: "typescript/packages/{component}"
    migration_directories: [ "packages/{component}" ]
    mise_config_root: true
    pnpm_workspace_package: true
    task_ownership: inherited
  - id: "python-pipeline"
    description: "A Python application, pipeline, training job, or evaluation."
    technology: "python"
    directory: "python/apps/{component}"
    migration_directories: [ "ml-pipelines/{component}" ]
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "python-package"
    technology: "python"
    directory: "python/packages/{component}"
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "cpp-project"
    description: "A C++ application, firmware system, simulator, or host tool."
    technology: "cpp"
    directory: "cpp/apps/{component}"
    migration_directories: [ "cpp/{component}" ]
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "cpp-library"
    technology: "cpp"
    directory: "cpp/packages/{component}"
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "terraform-root"
    technology: "terraform"
    directory: "terraform/roots/{component}"
    migration_directories: [ "infra/{component}" ]
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "terraform-module"
    technology: "terraform"
    directory: "terraform/modules/{component}"
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "kubernetes-component"
    description: "A reusable Kubernetes package consumed by one or more applications."
    technology: "kubernetes"
    directory: "kubernetes/packages/{component}"
    migration_directories: [ "homelab/k3s/components/{component}" ]
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "kubernetes-app"
    technology: "kubernetes"
    directory: "kubernetes/apps/{component}"
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "homelab-system"
    description: "Migration-only compatibility kind for the aggregate Home Lab root."
    technology: "nix"
    directory: "homelab"
    migration_only: true
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "homelab-subsystem"
    description: "Migration-only compatibility kind for a Home Lab subtree."
    technology: "nix"
    directory: "homelab/{component}"
    migration_only: true
    mise_config_root: false
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "nix-host"
    technology: "nix"
    directory: "nix/hosts/{component}"
    mise_config_root: false
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "nix-module"
    technology: "nix"
    directory: "nix/modules/{component}"
    mise_config_root: false
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "nix-package"
    technology: "nix"
    directory: "nix/packages/{component}"
    mise_config_root: false
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "ansible-inventory"
    technology: "ansible"
    directory: "ansible/inventories/{component}"
    mise_config_root: false
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "ansible-playbook"
    technology: "ansible"
    directory: "ansible/playbooks/{component}"
    mise_config_root: false
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "ansible-role"
    technology: "ansible"
    directory: "ansible/roles/{component}"
    mise_config_root: false
    pnpm_workspace_package: false
    task_ownership: inherited
  - id: "container-image"
    technology: "containers"
    directory: "containers/images/{component}"
    mise_config_root: true
    pnpm_workspace_package: false
    task_ownership: inherited

task_contract:
  id: "standard"
  required:
    - "install"
    - "format"
    - "lint"
    - "typecheck-or-compile"
    - "test"
    - "build"
    - "clean"

knowledge_graph:
  project_index: "content/projects/{project}/index.mdx"
  architecture_decisions: "content/projects/{project}/adrs/{sequence}-{slug}.mdx"
  product_decisions: "content/projects/{project}/pdrs/{sequence}-{slug}.mdx"

migration_knowledge_graph:
  project_index: "ui/content/projects/{project}/index.mdx"
  architecture_decisions: "ui/content/projects/{project}/adrs/{sequence}-{slug}.mdx"
  product_decisions: "ui/content/projects/{project}/pdrs/{sequence}-{slug}.mdx"

shared_manifests:
  - path: "ui/content/projects/personal-engineering-platform/repository-layout.yaml"
    allowed_edits: [ "projects" ]
  - path: ".mise.toml"
    allowed_edits: [ "monorepo.config_roots" ]
  - path: "pnpm-workspace.yaml"
    allowed_edits: [ "packages" ]
  - path: "ui/content/projects/personal-engineering-platform/platform.yaml"
    allowed_edits: [ "catalog.records" ]

workspace_policy:
  node_workspace: "pnpm-workspace.yaml"
  node_lockfile: "pnpm-lock.yaml"
  standalone_node_roots: [ "homelab/images/t3-code" ]
  approved_npm_lockfiles:
    - "homelab/images/t3-code/package-lock.json"
    - "packages/agent-auth-mcp/package-lock.json"
  local_mise_roots: [ "homelab/images/t3-code" ]
  technology_roots:
    - { id: "typescript", directory: "typescript", workspace: "pnpm" }
    - { id: "python", directory: "python", workspace: "uv" }
    - { id: "cpp", directory: "cpp", workspace: "cmake" }
    - { id: "terraform", directory: "terraform", workspace: "terraform" }
    - { id: "nix", directory: "nix", workspace: "nix" }
    - { id: "kubernetes", directory: "kubernetes", workspace: "kubernetes" }
    - { id: "ansible", directory: "ansible", workspace: "ansible" }
    - { id: "containers", directory: "containers", workspace: "container" }
    - { id: "content", directory: "content", workspace: "content" }
