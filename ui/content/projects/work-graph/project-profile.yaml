schema_version: 3

project:
  id: "work-graph"
  name: "Work Graph"
  kind: "service"

components:
  - id: "work-graph-api"
    name: "Work Graph API"
    kind: "worker"
  - id: "work-graph-observer"
    name: "Work Graph observer"
    kind: "worker"
  - id: "work-graph-cli"
    name: "Work Graph CLI"
    kind: "typescript-package"
  - id: "work-graph-db"
    name: "Work Graph database"
    kind: "typescript-package"
  - id: "work-graph-domain"
    name: "Work Graph domain"
    kind: "typescript-package"
  - id: "work-graph"
    name: "Work Graph infrastructure"
    kind: "terraform-root"

layers:
  - layer: "governance"
  - layer: "base"
    slots:
      - "secrets.runtime-store"
      - "secrets.ci-store"
      - "security.service-auth"
  - layer: "typescript"
  - layer: "backend-api"
    slots:
      - "backend-api.runtime"
      - "backend-api.http-framework"
      - "backend-api.contract-format"
      - "backend-api.contract-generator"
      - "backend-api.relational-connection"
  - layer: "database"
    slots:
      - "database.relational-engine"
      - "database.relational-host"
      - "database.relational-access"
      - "database.migration-discipline"
      - "database.backup-restore"
  - layer: "infrastructure"
    slots:
      - "infrastructure.provisioner"
      - "infrastructure.state-backend"
  - layer: "observability"
  - layer: "storage"
    slots:
      - "storage.object-store"

requirements:
  - "credential-rotation"
  - "runtime-derived-api-contract"
  - "committed-migration-history"
  - "serialized-migration-runner"
  - "backup-key-custody"
  - "backup-retention-policy"
  - "restore-drill"
  - "data-classification"
  - "object-lifecycle-policy"
  - "scoped-storage-credentials"

capabilities:
  delivery_evidence:
    contract: "project-delivery-evidence"
    contract_version: 1
    repository: "Robbie-Palmer/hq"
    targets:
      - id: "api"
        subjects:
          - "component:work-graph/work-graph-api"
          - "component:work-graph/work-graph-db"
          - "component:work-graph/work-graph-domain"
        source_paths:
          - path: ".github/workflows/work-graph-api-cd.yml"
            mode: "exclusive"
          - path: ".github/workflows/work-graph-api-ci.yml"
            mode: "exclusive"
        github:
          required_ci_names: ["Work Graph API CI"]
          production_environments: ["production-work-graph"]
      - id: "infrastructure"
        subjects:
          - "component:work-graph/work-graph"
        source_paths:
          - path: ".github/workflows/work-graph-infra.yml"
            mode: "exclusive"
          - path: ".github/workflows/work-graph-infra-ci.yml"
            mode: "exclusive"
        github:
          required_ci_names: ["Work Graph Infrastructure CI"]
          production_environments: ["production-work-graph-infra"]
      - id: "observer"
        subjects:
          - "component:work-graph/work-graph-db"
          - "component:work-graph/work-graph-domain"
          - "component:work-graph/work-graph-observer"
        source_paths:
          - path: ".github/workflows/work-graph-observer-ci.yml"
            mode: "exclusive"
        github:
          required_ci_names: ["Work Graph Observer CI"]
          production_environments: ["production-work-graph"]
      - id: "site-ui"
        shared_host: "site-ui"
        source_paths:
          - path: "ui/content/projects/work-graph"
            mode: "shared"
        github:
          required_ci_names: ["UI CI"]
          production_environments: ["production-site-ui"]

reconciliation:
  mode: "tracking"

nix:
  boundary: "none"

opentelemetry:
  enabled: false
