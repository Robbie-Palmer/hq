schema_version: 1

project:
  id: "work-graph"
  name: "Work Graph"
  kind: "service"

components:
  - id: "work-graph-api"
    name: "Work Graph API"
    kind: "worker"
    task_exceptions:
      - task: "format"
        reason: "Repository-wide formatting covers this Worker."
      - task: "lint"
        reason: "The Worker check task owns linting."
      - task: "build"
        reason: "The deployment check builds the Worker bundle."
      - task: "clean"
        reason: "The shared workspace owns cleanup."
  - id: "work-graph-observer"
    name: "Work Graph observer"
    kind: "worker"
    task_exceptions:
      - task: "format"
        reason: "Repository-wide formatting covers this Worker."
      - task: "lint"
        reason: "The Worker check task owns linting."
      - task: "build"
        reason: "The deployment check builds the Worker bundle."
      - task: "clean"
        reason: "The shared workspace owns cleanup."
  - id: "work-graph-cli"
    name: "Work Graph CLI"
    kind: "typescript-package"
    task_exceptions:
      - task: "format"
        reason: "Repository-wide formatting covers this package."
      - task: "lint"
        reason: "Repository-wide lint tasks cover this package."
      - task: "clean"
        reason: "The shared workspace owns cleanup."
  - id: "work-graph-db"
    name: "Work Graph database"
    kind: "typescript-package"
    task_exceptions:
      - task: "format"
        reason: "Repository-wide formatting covers this package."
      - task: "lint"
        reason: "Repository-wide lint tasks cover this package."
      - task: "test"
        reason: "Database behavior is verified by the integration suite."
      - task: "build"
        reason: "The package exposes TypeScript source directly."
      - task: "clean"
        reason: "The shared workspace owns cleanup."
  - id: "work-graph-domain"
    name: "Work Graph domain"
    kind: "typescript-package"
    task_exceptions:
      - task: "format"
        reason: "Repository-wide formatting covers this package."
      - task: "lint"
        reason: "Repository-wide lint tasks cover this package."
      - task: "build"
        reason: "The package exposes TypeScript source directly."
      - task: "clean"
        reason: "The shared workspace owns cleanup."
  - id: "work-graph"
    name: "Work Graph infrastructure"
    kind: "terraform-root"
    task_exceptions:
      - task: "install"
        reason: "Terraform initialization remains environment-aware."
      - task: "typecheck-or-compile"
        reason: "Terraform validation and linting replace compilation."
      - task: "test"
        reason: "Terraform plan checks cover the infrastructure contract."
      - task: "build"
        reason: "Infrastructure has no standalone build artifact."
      - task: "clean"
        reason: "Terraform working data is ephemeral or operator-managed."

layers:
  - layer: "governance"
  - layer: "base"
    slots:
      - "secrets.runtime-store"
      - "secrets.ci-store"
      - "security.service-auth"
  - layer: "typescript"
  - layer: "backend-api"
    slots:
      - "backend-api.runtime"
      - "backend-api.http-framework"
      - "backend-api.contract-format"
      - "backend-api.contract-generator"
      - "backend-api.relational-connection"
  - layer: "database"
    slots:
      - "database.relational-engine"
      - "database.relational-host"
      - "database.relational-access"
      - "database.migration-discipline"
      - "database.backup-restore"
  - layer: "infrastructure"
    slots:
      - "infrastructure.provisioner"
      - "infrastructure.state-backend"
  - layer: "observability"
  - layer: "storage"
    slots:
      - "storage.object-store"

requirements:
  - "credential-rotation"
  - "runtime-derived-api-contract"
  - "committed-migration-history"
  - "serialized-migration-runner"
  - "backup-key-custody"
  - "backup-retention-policy"
  - "restore-drill"
  - "data-classification"
  - "object-lifecycle-policy"
  - "scoped-storage-credentials"

reconciliation:
  mode: "tracking"

nix:
  boundary: "none"

opentelemetry:
  enabled: false
