[env]
VALID_IMAGE_EXTENSIONS = "jpg|jpeg|png|gif|webp"

[tasks.install]
description = "Install all dependencies"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml"]
outputs = ["node_modules"]

[tasks.dev]
description = "Start Next.js development server"
depends = ["//ui:install", "//cpp/autonomic-satellite-swarm:browser:build"]
run = "pnpm dev"

[tasks."dev:qr"]
description = "Start dev server and show QR code for mobile testing"
depends = ["//ui:install", "//cpp/autonomic-satellite-swarm:browser:build"]
run = "pnpm dev:qr"

[tasks.build]
description = "Build Next.js application for production"
depends = ["//ui:install", "//cpp/autonomic-satellite-swarm:browser:build"]
run = "pnpm build"
sources = ["app/**/*", "components/**/*", "content/**/*", "lib/**/*", "public/**/*", "scripts/**/*", "*.ts", "*.tsx", "*.json"]
outputs = ["out/**/*"]

[tasks.test]
description = "Run all tests"
depends = ["//ui:install"]
run = "pnpm test"

[tasks."test:coverage"]
description = "Run UI unit tests with LCOV coverage"
depends = ["//:install"]
run = "pnpm test:coverage"

[tasks."test:integration"]
description = "Run UI integration tests"
run = "pnpm test:integration"
depends = ["//ui:build"]

[tasks."test:e2e:preview"]
description = "Run Playwright QA against an authenticated PR preview"
depends = ["//ui:test:e2e:install", "//ui:test:e2e:typecheck"]
run = "pnpm test:e2e:preview"

[tasks."test:e2e:mermaid"]
description = "Render Mermaid diagrams in light and dark themes with Playwright"
depends = ["//ui:test:e2e:install", "//ui:test:e2e:typecheck"]
run = "pnpm test:e2e:mermaid"

[tasks."test:e2e:install"]
description = "Install Chromium for Playwright tests"
depends = ["//ui:install"]
run = "pnpm exec playwright install chromium"

[tasks."test:e2e:typecheck"]
description = "Typecheck the Playwright tests"
depends = ["//ui:install"]
run = "pnpm exec tsc --project tsconfig.e2e.json"

[tasks."audit:satellite-swarm"]
description = "Audit satellite-swarm payloads, rendering, provenance, and offline requests"
depends = ["//ui:test:e2e:install"]
run = "pnpm audit:satellite-swarm"

[tasks."audit:satellite-swarm:serve"]
description = "Build, serve, and audit the satellite-swarm production export"
depends = ["//ui:build", "//ui:test:e2e:install"]
run = '''
audit_port=${SATELLITE_SWARM_AUDIT_PORT:-0}
case "$audit_port" in
  *[!0-9]*|'') echo "SATELLITE_SWARM_AUDIT_PORT must be an integer" >&2; exit 2 ;;
esac
audit_server_log=$(mktemp "${TMPDIR:-/tmp}/satellite-swarm-audit.XXXXXX")
./node_modules/.bin/serve out -l "tcp://127.0.0.1:$audit_port" >"$audit_server_log" 2>&1 &
audit_server_pid=$!
trap 'kill "$audit_server_pid" 2>/dev/null || true; rm -f -- "$audit_server_log"' EXIT
audit_url=
for _ in $(seq 1 40); do
  if ! kill -0 "$audit_server_pid" 2>/dev/null; then
    cat "$audit_server_log" >&2
    exit 1
  fi
  audit_url=$(sed -n 's|.*\(http://127\.0\.0\.1:[0-9][0-9]*\).*|\1|p' "$audit_server_log" | tail -n 1)
  if [ -n "$audit_url" ]; then break; fi
  sleep 0.25
done
if [ -z "$audit_url" ]; then
  cat "$audit_server_log" >&2
  echo "Static-site server did not report its listening address" >&2
  exit 1
fi
source_revision=${SATELLITE_SWARM_SOURCE_REVISION:-${GITHUB_SHA:-$(git rev-parse HEAD)}}
case "$source_revision" in
  *[!0-9a-f]*|'') echo "SATELLITE_SWARM_SOURCE_REVISION must be a full lowercase Git revision" >&2; exit 2 ;;
esac
revision_length=$(printf %s "$source_revision" | wc -c)
if [ "$revision_length" -ne 40 ]; then
  echo "SATELLITE_SWARM_SOURCE_REVISION must be a full lowercase Git revision" >&2
  exit 2
fi
SATELLITE_SWARM_AUDIT_SERVER_PID="$audit_server_pid" \
  SATELLITE_SWARM_AUDIT_URL="$audit_url" \
  SATELLITE_SWARM_SOURCE_REVISION="$source_revision" \
  pnpm audit:satellite-swarm
'''

[tasks."test:watch"]
description = "Run tests in watch mode"
depends = ["//ui:install"]
run = "pnpm test:watch"

[tasks.lint]
description = "Lint and format check with Biome"
depends = ["//ui:install"]
run = "pnpm lint"

[tasks.format]
description = "Format and fix issues with Biome"
depends = ["//ui:install"]
run = "pnpm format"

[tasks."format:check"]
description = "Check formatting without making changes"
depends = ["//ui:install"]
run = "pnpm format:check"

[tasks.typegen]
description = "Generate Next.js types (PageProps, etc.)"
depends = ["//ui:install"]
run = "pnpm exec next typegen"

[tasks.typecheck]
description = "Run TypeScript type checking"
depends = ["//ui:typegen"]
run = "pnpm typecheck"

[tasks."generate:typos-dictionary"]
description = "Regenerate the recipe editor spell-check dictionary from the pinned typos version (run on typos bump)"
depends = ["//ui:install"]
run = "pnpm generate:typos-dictionary"

[tasks.clean]
description = "Clean build artifacts and dependencies"
run = """
rm -rf .next
rm -rf .next-dev
rm -rf node_modules
rm -rf out
"""

[tasks.check]
description = "Run all checks (lint, format, typecheck, test)"
depends = ["//ui:lint", "//ui:format:check", "//ui:typecheck", "//ui:test"]

[tasks."check:static"]
description = "Static checks the production build relies on (type-check + Biome lint), without the slower test suite — gates deploy/preview workflows that skip the in-build type-check"
depends = ["//ui:typecheck", "//ui:lint"]

# Image management tasks
[tasks."images:sync"]
description = "Upload versioned images to Cloudflare Images with CalVer validation"
depends = ["//ui:install"]
run = "pnpm images:sync"

[tasks."images:health-check"]
description = "Validate Cloudflare Images configuration and connectivity"
depends = ["//ui:install"]
run = "pnpm images:health-check"

[tasks.deploy]
description = "Deploy to Cloudflare Pages via Wrangler"
depends = ["//ui:build"]
run = "pnpm exec wrangler pages deploy ui/out --cwd .. --project-name=personal-site --branch=\"${DEPLOY_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}\""

# Lighthouse performance testing tasks
[tasks.lighthouse]
description = "Run Lighthouse against running dev server (start dev server first)"
depends = ["//ui:install"]
run = "pnpm lighthouse"

[tasks."lighthouse:serve"]
description = "Build, serve static export, and run Lighthouse tests (desktop + mobile)"
depends = ["//ui:build"]
run = """
#!/usr/bin/env bash
set -e

echo "Starting static server on port 3000..."
pnpm exec serve out -l 3000 &
SERVER_PID=$!
sleep 2

pnpm lighthouse || EXIT_CODE=$?
kill $SERVER_PID 2>/dev/null || true
exit ${EXIT_CODE:-0}
"""
