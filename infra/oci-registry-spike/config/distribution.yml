version: 0.1
log:
  level: info
storage:
  s3:
    region: us-east-1
    regionendpoint: http://localstack:4566
    forcepathstyle: true
    bucket: distribution-registry
    rootdirectory: /registry
    encrypt: false
    secure: false
    v4auth: true
    chunksize: 5242880
  delete:
    enabled: true
  redirect:
    disable: true
  maintenance:
    uploadpurging:
      enabled: true
      age: 1h
      interval: 5m
      dryrun: false
http:
  addr: :5000
  debug:
    addr: :5001
    prometheus:
      enabled: true
      path: /metrics
auth:
  htpasswd:
    realm: oci-registry-spike
    path: /run/secrets/registry-htpasswd

