schema_version: 1
project_id: example-service

provider_origins:
  doppler: https://api.doppler.com
  github: https://api.github.com
  cloudflare: https://api.cloudflare.com

identities:
  doppler:
    token_env: DOPPLER_BOOTSTRAP_TOKEN
    project: example-service
    configs: [prd]
  github:
    token_env: GITHUB_BOOTSTRAP_TOKEN
    repository: example/example-service
    environments: [production-example-service]
  cloudflare:
    token_env: CLOUDFLARE_BOOTSTRAP_TOKEN
    account_id_env: CLOUDFLARE_ACCOUNT_ID
    workers: [example-service]

checkpoints:
  - id: create-cloudflare-deploy-token
    provider: cloudflare
    instructions: >-
      Create a token with Workers Scripts Write for the one deployment account,
      then export it as NEW_CLOUDFLARE_API_TOKEN for this run.
  - id: register-google-oauth-client
    provider: google
    instructions: >-
      Register the production callback URI, then export the issued client
      secret as NEW_GOOGLE_CLIENT_SECRET for this run.

secrets:
  - id: cloudflare-api-token
    name: CLOUDFLARE_API_TOKEN
    sensitive: true
    system_of_record:
      kind: doppler
      config: prd
      name: CLOUDFLARE_API_TOKEN
    consumers:
      - kind: github-environment
        environment: production-example-service
        name: CLOUDFLARE_API_TOKEN
    rotation_owner: platform-operations
    creation:
      mode: manual
      value_env: NEW_CLOUDFLARE_API_TOKEN
      checkpoint: create-cloudflare-deploy-token

  - id: better-auth-secret
    name: BETTER_AUTH_SECRET
    sensitive: true
    system_of_record:
      kind: doppler
      config: prd
      name: BETTER_AUTH_SECRET
    consumers:
      - kind: github-environment
        environment: production-example-service
        name: BETTER_AUTH_SECRET
      - kind: cloudflare-worker
        worker: example-service
        name: BETTER_AUTH_SECRET
    rotation_owner: application-operations
    creation:
      mode: generated
      bytes: 32

  - id: google-client-secret
    name: GOOGLE_CLIENT_SECRET
    sensitive: true
    system_of_record:
      kind: doppler
      config: prd
      name: GOOGLE_CLIENT_SECRET
    consumers:
      - kind: github-environment
        environment: production-example-service
        name: GOOGLE_CLIENT_SECRET
      - kind: cloudflare-worker
        worker: example-service
        name: GOOGLE_CLIENT_SECRET
    rotation_owner: application-operations
    creation:
      mode: manual
      value_env: NEW_GOOGLE_CLIENT_SECRET
      checkpoint: register-google-oauth-client
