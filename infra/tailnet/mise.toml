[tasks.init]
description = "Initialize tailnet Terraform"
run = "bash scripts/doppler-terraform-env.sh plan terraform init -input=false"

[tasks.format]
description = "Format tailnet Terraform files"
run = "terraform fmt -recursive ."

[tasks."format:check"]
description = "Check tailnet Terraform formatting"
run = "terraform fmt -check -recursive ."

[tasks.validate]
description = "Validate tailnet Terraform without remote state or credentials"
run = """
#!/usr/bin/env bash
set -euo pipefail
validate_data_dir="$(mktemp -d "${TMPDIR:-/tmp}/tailnet-terraform-validate.XXXXXX")"
trap 'rm -rf "$validate_data_dir"' EXIT
export TF_DATA_DIR="$validate_data_dir"
terraform init -backend=false -input=false > /dev/null
terraform validate
"""

[tasks."lint:tflint"]
description = "Lint tailnet Terraform"
run = """
#!/usr/bin/env bash
# Lint the whole root; ignore file arguments appended by lint-staged.
tflint --format compact
"""

[tasks."test:scripts"]
description = "Test tailnet credential and apply guards"
run = "bash scripts/doppler-terraform-env.test.sh && bash scripts/guarded-apply.test.sh && bash scripts/import-baseline.test.sh"

[tasks.test]
description = "Test tailnet operator scripts"
depends = ["test:scripts"]

[tasks.lint]
description = "Run tailnet Terraform static checks"
depends = ["validate", "lint:tflint", "test:scripts"]

[tasks.precommit-lint]
description = "Validate tailnet Terraform without its remote backend"
depends = ["validate"]

[tasks.plan]
description = "Plan tailnet policy with read-only credentials"
depends = ["init"]
run = "bash scripts/doppler-terraform-env.sh plan terraform plan -input=false -out .planfile"
outputs = [".planfile"]

[tasks."plan:refresh-only"]
description = "Refresh imported tailnet state without proposing changes"
depends = ["init"]
run = "bash scripts/doppler-terraform-env.sh plan terraform plan -refresh-only -input=false"

[tasks.import]
description = "Import an existing tailnet resource with read-only API credentials"
depends = ["init"]
run = """
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -ne 2 ]]; then
  echo "Usage: mise run //infra/tailnet:import -- <resource-address> <import-id>" >&2
  exit 2
fi
bash scripts/doppler-terraform-env.sh plan terraform import -input=false "$1" "$2"
"""

[tasks."import:baseline"]
description = "Import the current policy and complete DNS configuration"
depends = ["init"]
run = "bash scripts/doppler-terraform-env.sh plan bash scripts/import-baseline.sh terraform"

[tasks.apply]
description = "Apply a reviewed tailnet Terraform plan behind an explicit guard"
depends = ["init"]
run = "bash scripts/doppler-terraform-env.sh apply bash scripts/guarded-apply.sh .planfile terraform apply -input=false .planfile"

[tasks.check]
description = "Run secretless tailnet Terraform checks"
depends = ["format:check", "lint", "test"]
