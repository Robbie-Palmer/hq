apiVersion: v1
kind: Namespace
metadata:
  name: t3-pilot
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-data
  namespace: t3-pilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 90Gi
  storageClassName: hcloud-volumes-retain
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-code
  namespace: t3-pilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: t3-code
      remote-development.robbiepalmer.dev/workspace: pilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3-code
        remote-development.robbiepalmer.dev/workspace: pilot
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        remote-development.robbiepalmer.dev/workspace: pilot
      tolerations:
        - key: remote-development.robbiepalmer.dev/workspace
          operator: Equal
          value: pilot
          effect: NoSchedule
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directories
          image: ghcr.io/robbie-palmer/t3-code:0.0.38-agent-tools-12
          command:
            - /bin/sh
            - -eu
            - -c
            - >-
              mkdir -p /data/home/.t3 /data/home/.t3/worktrees
              /data/home/.codex /data/home/.codex-personal /data/workspaces
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: t3-code
          image: ghcr.io/robbie-palmer/t3-code:0.0.38-agent-tools-12
          env:
            - name: HOME
              value: /data/home
            - name: T3CODE_HOME
              value: /data/home/.t3
          ports:
            - name: http
              containerPort: 3773
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 500m
              ephemeral-storage: 4Gi
              memory: 1Gi
            limits:
              cpu: "3"
              ephemeral-storage: 16Gi
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /data/home/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: workspace-data
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: t3-code
  namespace: t3-pilot
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: t3-code
    remote-development.robbiepalmer.dev/workspace: pilot
  ports:
    - name: http
      port: 3773
      targetPort: http
      nodePort: 30774
