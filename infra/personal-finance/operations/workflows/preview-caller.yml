name: Personal Finance App preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: personal-finance-app-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  up:
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/project-stateful-operations.yml
    with:
      action: preview-up
      operations_root: "infra/personal-finance"
      github_environment: "preview-personal-finance"
      secret_config_ref: "doppler://personal-finance/drift_preview"
      subject: ${{ github.event.pull_request.number }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.PROJECT_PREVIEW_DOPPLER_TOKEN }}

  cleanup:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/project-stateful-operations.yml
    with:
      action: preview-cleanup
      operations_root: "infra/personal-finance"
      github_environment: "preview-personal-finance"
      secret_config_ref: "doppler://personal-finance/drift_preview"
      subject: ${{ github.event.pull_request.number }}
      checkout_ref: ${{ github.event.pull_request.base.sha }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.PROJECT_PREVIEW_DOPPLER_TOKEN }}
