[tasks.init]
description = "Initialize Personal Finance Terraform"
run = "bash scripts/doppler-terraform-env.sh plan terraform init -input=false"

[tasks.format]
description = "Format Personal Finance Terraform files"
run = "terraform fmt -recursive ."

[tasks."format:check"]
description = "Check Personal Finance Terraform formatting"
run = "terraform fmt -check -recursive ."

[tasks.validate]
description = "Validate Personal Finance Terraform without remote state or credentials"
run = """
#!/usr/bin/env bash
set -euo pipefail
validate_data_dir="$(mktemp -d "${TMPDIR:-/tmp}/personal-finance-terraform-validate.XXXXXX")"
trap 'rm -rf "$validate_data_dir"' EXIT
export TF_DATA_DIR="$validate_data_dir"
terraform init -backend=false -input=false > /dev/null
terraform validate
"""

[tasks."lint:tflint"]
description = "Lint Personal Finance Terraform"
run = "tflint --format compact"

[tasks."security:scan"]
description = "Scan Personal Finance Terraform for high-severity configuration findings"
run = "mise exec trivy@0.76.0 -- trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-check-update --skip-version-check --skip-dirs .terraform ."

[tasks.lint]
description = "Run Personal Finance Terraform static checks"
depends = ["validate", "lint:tflint", "security:scan"]

[tasks."test:scripts"]
description = "Test Personal Finance credential boundaries"
run = "bash scripts/doppler-terraform-env.test.sh"

[tasks."test:foundation"]
description = "Verify the generated stateful workload boundary"
run = """
#!/usr/bin/env bash
set -euo pipefail
grep -Fq 'module "cloudflare_worker"' generated-project.tf
grep -Fq 'module "neon"' generated-project.tf
grep -Fq 'module "cloudflare_r2"' generated-project.tf
grep -Fq 'module "telemetry"' generated-project.tf
grep -Fq 'module "posthog_alerts"' generated-project.tf
"""

[tasks."test:terraform"]
description = "Exercise the empty Personal Finance Terraform baseline"
run = """
#!/usr/bin/env bash
set -euo pipefail
test_data_dir="$(mktemp -d "${TMPDIR:-/tmp}/personal-finance-terraform-test.XXXXXX")"
trap 'rm -rf "$test_data_dir"' EXIT
export TF_DATA_DIR="$test_data_dir"
terraform init -backend=false -input=false > /dev/null
terraform test
"""

[tasks.test]
description = "Test the Personal Finance stateful infrastructure"
depends = ["test:scripts", "test:foundation", "test:terraform", "test:operations"]

[tasks.plan]
description = "Plan Personal Finance infrastructure with plan credentials"
depends = ["init"]
run = "bash scripts/doppler-terraform-env.sh plan terraform plan -input=false -out .planfile"
outputs = [".planfile"]

[tasks."plan:drift"]
description = "Check Personal Finance infrastructure drift with read-only credentials"
run = """
#!/usr/bin/env bash
set -euo pipefail
bash scripts/doppler-terraform-env.sh drift terraform init -input=false
bash scripts/doppler-terraform-env.sh drift terraform plan -input=false -detailed-exitcode
"""

[tasks."credentials:sync"]
description = "Install config-scoped Personal Finance Doppler tokens in protected GitHub environments"
run = "bash scripts/install-service-tokens.sh"

[tasks."bootstrap:check"]
description = "Validate the redacted Personal Finance provider handoff contract"
run = "bash scripts/check-bootstrap.sh contract"

[tasks."bootstrap:check:runtime"]
description = "Check that the current scoped config supplies its declared handoff names"
run = "bash scripts/check-bootstrap.sh runtime"

[tasks."preview:provision"]
description = "Create the isolated Neon branch and Cloudflare Access application for a preview"
run = "bash scripts/provider-operation.sh preview-provision"

[tasks."db:migrate:preview"]
description = "Apply committed migrations to the isolated preview database"
run = "bash scripts/provider-operation.sh preview-migrate"

[tasks."db:seed:preview"]
description = "Insert the synthetic-only preview fixture"
run = "bash scripts/provider-operation.sh preview-seed"

[tasks."deploy:preview"]
description = "Deploy the isolated Personal Finance preview Worker"
run = "bash scripts/provider-operation.sh preview-deploy"

[tasks."smoke:preview"]
description = "Create and read the authenticated synthetic preview record"
run = "bash scripts/provider-operation.sh preview-smoke"

[tasks."smoke:telemetry"]
description = "Verify the redacted preview telemetry event"
run = "bash scripts/provider-operation.sh preview-telemetry"

[tasks."preview:cleanup"]
description = "Delete the preview Worker, Access application, and Neon branch"
run = "bash scripts/provider-operation.sh preview-cleanup"

[tasks."db:migrate:production"]
description = "Apply committed migrations to the production database"
run = "bash scripts/provider-operation.sh production-migrate"

[tasks."deploy:production"]
description = "Deploy the reviewed Personal Finance production Worker revision"
run = "bash scripts/provider-operation.sh production-deploy"

[tasks."smoke:production"]
description = "Smoke-test the authenticated production Worker"
run = "bash scripts/provider-operation.sh production-smoke"

[tasks."rollback:production"]
description = "Deploy a declared prior Personal Finance Worker version"
run = "bash scripts/provider-operation.sh production-rollback"

[tasks."backup:create"]
description = "Create and verify an encrypted Personal Finance database backup"
run = "bash scripts/provider-operation.sh backup-create"

[tasks."restore:drill"]
description = "Restore an encrypted Personal Finance backup into a scratch database"
run = "bash scripts/provider-operation.sh restore-drill"

[tasks."smoke:alert"]
description = "Emit and verify a synthetic Personal Finance alert event"
run = "bash scripts/provider-operation.sh alert-smoke"

[tasks."test:operations"]
description = "Test Personal Finance provider operation and handoff boundaries"
run = "bash scripts/provider-operation.test.sh"

[tasks.apply]
description = "Apply a reviewed Personal Finance Terraform plan"
depends = ["init"]
run = "bash scripts/doppler-terraform-env.sh apply terraform apply -input=false .planfile"

[tasks.check]
description = "Check and plan Personal Finance infrastructure"
depends = ["format:check", "lint", "test", "plan"]
