schema_version: 1
project_id: cloudflare-r2-parent-credentials

provider_origins:
  doppler: https://api.doppler.com
  github: https://api.github.com
  cloudflare: https://api.cloudflare.com

identities:
  doppler:
    project: cloudflare-token-bootstrap
    configs:
      - name: ops_provisioner
        token_env: DOPPLER_BOOTSTRAP_TOKEN
  github:
    token_env: GH_BOOTSTRAP_TOKEN
    repository: Robbie-Palmer/hq
    environments:
      - production-cloudflare-token-bootstrap
  cloudflare_token_provisioner:
    token_env: CLOUDFLARE_TOKEN_PROVISIONER_TOKEN
    account_id_env: CLOUDFLARE_ACCOUNT_ID

checkpoints:
  - id: rotate-r2-parent-credentials
    provider: cloudflare
    instructions: >-
      Keep the old parent until its replacement issues a working temporary
      credential. That proof remains blocked on
      pep-r2-temporary-credential-broker.

secrets:
  - id: r2-parent-credentials
    name: CLOUDFLARE_R2_PARENT_CREDENTIALS
    sensitive: true
    system_of_record:
      kind: doppler
      config: ops_provisioner
      name: CLOUDFLARE_R2_PARENT_CREDENTIALS
    consumers:
      - kind: github-environment
        environment: production-cloudflare-token-bootstrap
        name: CLOUDFLARE_R2_PARENT_CREDENTIALS
    rotation_owner: platform-operations
    creation:
      mode: extension
      extension: cloudflare-r2-parent-credentials
      checkpoint: rotate-r2-parent-credentials
      token_name: hq-r2-temporary-credential-parent
      permission_group:
        id: bf7481a1826f439697cb59a20b22293e
        name: Workers R2 Storage Write
