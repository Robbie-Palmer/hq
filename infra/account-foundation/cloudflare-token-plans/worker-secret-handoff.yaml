schema_version: 1
project_id: cloudflare-worker-secret-handoff

provider_origins:
  doppler: https://api.doppler.com
  github: https://api.github.com
  cloudflare: https://api.cloudflare.com

identities:
  doppler:
    project: cloudflare-token-bootstrap
    configs:
      - name: ops_provisioner
        token_env: DOPPLER_BOOTSTRAP_TOKEN
  github:
    token_env: GH_BOOTSTRAP_TOKEN
    repository: Robbie-Palmer/hq
    environments:
      - production-cloudflare-token-bootstrap
  cloudflare:
    token_env: CLOUDFLARE_BOOTSTRAP_TOKEN
    account_id_env: CLOUDFLARE_ACCOUNT_ID
    workers:
      - hq-worker-secret-handoff-proof
  cloudflare_token_provisioner:
    token_env: CLOUDFLARE_TOKEN_PROVISIONER_TOKEN
    account_id_env: CLOUDFLARE_ACCOUNT_ID

checkpoints:
  - id: rotate-cloudflare-worker-secret-handoff
    provider: cloudflare
    instructions: >-
      Record the active handoff token ID from the verify endpoint. Keep that
      token active while automation creates and distributes its account-owned
      replacement. Revoke the recorded token only after exact conformance and
      the disposable Worker-secret proof pass from the protected environment.

secrets:
  - id: cloudflare-worker-secret-handoff
    name: CLOUDFLARE_BOOTSTRAP_TOKEN
    sensitive: true
    system_of_record:
      kind: doppler
      config: ops_provisioner
      name: CLOUDFLARE_BOOTSTRAP_TOKEN
    consumers:
      - kind: github-environment
        environment: production-cloudflare-token-bootstrap
        name: CLOUDFLARE_BOOTSTRAP_TOKEN
    rotation_owner: platform-operations
    creation:
      mode: extension
      extension: cloudflare-account-token
      checkpoint: rotate-cloudflare-worker-secret-handoff
      token_name: hq-worker-secret-handoff
      permission_groups:
        - id: e086da7e2179491d91ee5f35b3ca210a
          name: Workers Scripts Write
